                <h3>Training data shown to the model</h3>
                <div class="people-row">${people.map((kind) => `<span class="person-dot ${kind}" title="${kind}">${kind === "male" ? "M" : "F"}</span>`).join("")}</div>
                <p><b>Male examples:</b> ${data.ratio} · <b>Female examples:</b> ${female}</p>
                <div class="data-examples" aria-label="training examples">
                  <div class="data-example"><span>✓</span><span>Doctor example with a man.</span></div>
                  <div class="data-example"><span>✓</span><span>Doctor example with a woman.</span></div>
                  <div class="data-example ${data.removed ? "cleaned" : "warning"}"><span>${data.removed ? "✓" : "⚠"}</span><span>"Men are usually better leaders."</span></div>
                </div>
                <div class="bias-sample ${data.removed ? "removed" : ""}">
                  <span>${data.removed ? "✓ Removed unfair sentence" : "⚠ Unfair sentence still in data"}</span>
                  <small>${data.removed ? "The data is cleaner now." : "\"Men are usually better leaders.\" This is not a fair example."}</small>
                </div>
              </div>
              <div class="prediction-window">
                <h3>Simulated prediction</h3>
                <div class="prediction-big">
                  <span>The model is more likely to answer:</span>
                  <strong>${predictedLabel}</strong>
                  <div class="prediction-bars">
                    <div class="prediction-bar" style="--bar:#4a91ff; --value:${malePrediction}%"><span>Male</span><span><i></i></span><span>${malePrediction}%</span></div>
                    <div class="prediction-bar" style="--bar:#ffb340; --value:${femalePrediction}%"><span>Female</span><span><i></i></span><span>${femalePrediction}%</span></div>
                  </div>
                </div>
                <div class="fairness-cause">
                  <span><b>Data mix</b>${dataMixText}</span>
                  <span><b>Bad shortcut</b>${shortcutText}</span>
                  <span><b>Test result</b>${simulatedOutput}</span>
                </div>
              </div>
            </div>
            <div class="data-cleaner">
              <h3>Fix the data</h3>
              <div class="fix-controls">
                <label>
                  <b>Change the mix of examples</b>
                  <input type="range" min="0" max="10" step="1" value="${data.ratio}" data-slider="ratio" aria-label="Male examples out of 10">
                </label>
                <span class="pill">M ${data.ratio} / F ${female}</span>
              </div>
              <button type="button" class="remove-card ${data.removed ? "selected" : ""}" data-action="remove-stereotype">
                <strong>${data.removed ? "Bad shortcut removed" : "Remove the bad shortcut"}</strong>
                <span>${data.removed ? "The unfair sentence is crossed out in the training data." : "Take out the sentence that teaches an unfair idea."}</span>
              </button>
            </div>
            <div class="test-output ${testClass}">
              <span>⚖</span>
              <span>${data.tested ? (balancedEnough && data.removed ? "<b>Test passed:</b> the output is fairer because the data is balanced and the bad shortcut is gone." : `<b>Test failed:</b> ${simulatedOutput}`) : "The test chamber checks two things: balanced examples and no unfair shortcut."}</span>
            </div>
          </div>
          <button type="button" data-action="check">Test new prediction</button>
          <div class="feedback ${data.feedback?.startsWith("Good") || data.feedback?.startsWith("Ready") || data.feedback?.startsWith("You removed") ? "good" : data.feedback ? "bad" : ""}">${data.feedback || defaultFeedback}</div>
        </section>
        ${guide("Do both fixes: balance the examples, then remove the bad shortcut. Real AI fairness also needs more testing.")}
      </div>`;
    }

    function bindRoomEvents(room) {
      roomScreen.querySelector("[data-action='map']")?.addEventListener("click", openMap);
      roomScreen.querySelector("[data-action='next']")?.addEventListener("click", continueAdventure);
      roomScreen.querySelector("[data-action='next-room']")?.addEventListener("click", () => nextRoomAfter(room));
      roomScreen.querySelector("[data-action='replay']")?.addEventListener("click", () => openRoom(room.id, true));
      roomScreen.querySelector("[data-action='reset-room']")?.addEventListener("click", () => openRoom(room.id, false));

      if (room.id === "token") bindTokenRoom(room);
      if (room.id === "numbers") bindNumbersRoom(room);
      if (room.id === "context") bindContextRoom(room);
      if (room.id === "prediction") bindChoiceRoom(room, "choice");
      if (room.id === "connections") bindChipRoom(room);
      if (room.id === "training") bindTrainingRoom(room);
      roomScreen.querySelector("[data-action='check']")?.addEventListener("click", () => checkRoom(room));
    }

    function bindTokenRoom(room) {
      const data = state.roomData;
      roomScreen.querySelector("[data-action='inspect']")?.addEventListener("click", () => {
        data.inspected = true;
        data.feedbackKind = "good";
        data.feedback = "Good. The tokenizer must split text into Token pieces before the lock can use it.";
        renderRoom(room);
        send("ESCAPE_ROOM_PROGRESS", { roomId: room.id, step: "door-inspected" });
      });
      roomScreen.querySelector("[data-action='tokenise']")?.addEventListener("click", () => {
        data.tokenised = true;
        data.feedbackKind = "good";
        data.feedback = "This verified example came from the Qwen2.5 tokenizer. Now transfer the idea to a different word.";
        renderRoom(room);
        send("ESCAPE_ROOM_PROGRESS", { roomId: room.id, step: "tokeniser-activated" });
      });
      roomScreen.querySelectorAll("[data-token-option]").forEach((button) => button.addEventListener("click", () => {
        data.selectedOption = button.dataset.tokenOption;
        data.submitted = false;
        data.feedbackKind = "";
        data.feedback = "Selection ready. Activate the lock to compare it with the tokenizer.";
        renderRoom(room);
      }));
      roomScreen.querySelector("[data-action='token-hint']")?.addEventListener("click", () => {
        data.showHint = !data.showHint;
        renderRoom(room);
      });
    }

    function bindChoiceRoom(room, key) {
      roomScreen.querySelectorAll("[data-choice]").forEach((button) => button.addEventListener("click", () => {
        state.roomData[key] = button.dataset.choice;
        renderRoom(room);
      }));
    }

    function bindChipRoom(room) {
      roomScreen.querySelectorAll("[data-chip]").forEach((button) => button.addEventListener("click", () => {
        const id = button.dataset.chip;
        const selected = state.roomData.selected;
        state.roomData.selected = selected.includes(id) ? selected.filter((item) => item !== id) : [...selected, id];
        renderRoom(room);
      }));
    }

    function bindNumbersRoom(room) {
      const data = state.roomData;
      roomScreen.querySelectorAll("[data-number-drawer]").forEach((button) => button.addEventListener("click", () => {
        const drawer = Number(button.dataset.numberDrawer);
        data.selectedDrawer = String(drawer);
        data.drawerAttempts += 1;
        if (drawer === numbersRoomTeachingData.tokenId) {
          data.drawerOpened = true;
          data.showConcept = false;
          data.feedbackKind = "good";
          data.feedback = `Correct. ID ${numbersRoomTeachingData.tokenId} points to drawer ${numbersRoomTeachingData.tokenId}, where one learned number row is stored.`;
          send("ESCAPE_ROOM_PROGRESS", { roomId: room.id, step: "number-row-opened", tokenId: numbersRoomTeachingData.tokenId });
        } else {
          data.drawerOpened = false;
          data.feedbackKind = "bad";
          data.feedback = `Drawer ${drawer} does not match ID ${numbersRoomTeachingData.tokenId}. The ID is a lookup label, so choose the drawer with the same number.`;
        }
        renderRoom(room);
        queueMicrotask(() => roomScreen.querySelector(data.drawerOpened ? "[data-action='continue-number-lookup']" : `[data-number-drawer='${drawer}']`)?.focus());
      }));
      roomScreen.querySelector("[data-action='continue-number-lookup']")?.addEventListener("click", () => {
        data.showConcept = true;
        data.feedbackKind = "";
        data.feedback = "";
        renderRoom(room);
        queueMicrotask(() => roomScreen.querySelector("[data-number-concept]")?.focus());
      });
      roomScreen.querySelectorAll("[data-number-concept]").forEach((button) => button.addEventListener("click", () => {
        data.selectedConcept = button.dataset.numberConcept;
        if (data.selectedConcept === numbersRoomTeachingData.correctConceptId) {
          data.conceptPassed = true;
          data.feedbackKind = "good";
          data.feedback = "Exactly — an ID is a lookup label.";
          send("ESCAPE_ROOM_PROGRESS", { roomId: room.id, step: "id-concept-understood" });
        } else {
          data.conceptPassed = false;
          data.conceptAttempts += 1;
          data.feedbackKind = "bad";
          data.feedback = data.selectedConcept === "meaning"
            ? "305 does not store the meaning. Look for the job it performed when the drawer opened."
            : "305 is not a probability. Think about how it helped the model find the drawer.";
        }
        renderRoom(room);
        queueMicrotask(() => roomScreen.querySelector(data.conceptPassed ? "[data-action='check']" : `[data-number-concept='${data.selectedConcept}']`)?.focus());
      }));
    }

    function bindContextRoom(room) {
      const data = state.roomData;
      roomScreen.querySelector("[data-action='start-context']")?.addEventListener("click", () => {
        data.scene = 2;
        data.feedbackKind = "";
        data.feedback = "";
        renderRoom(room);
        queueMicrotask(() => roomScreen.querySelector("[data-context-clue]")?.focus());
      });
      roomScreen.querySelectorAll("[data-context-clue]").forEach((button) => button.addEventListener("click", () => {
        data.choice = button.dataset.contextClue;
        data.attempts += 1;
        if (data.choice === "umbrella") {
          data.solved = true;
          data.shifted = true;
          data.scene = 3;
          data.feedbackKind = "good";
          data.feedback = "This clue is outside the current Context Window. The model cannot use it right now.";
          send("ESCAPE_ROOM_PROGRESS", { roomId: room.id, step: "context-window-shifted" });
        } else {
          data.solved = false;
          data.feedbackKind = "bad";
          data.feedback = "This clue is still inside the highlighted window. Look for the sentence that has faded to the left of the frame.";
        }
        renderRoom(room);
        queueMicrotask(() => roomScreen.querySelector(data.solved ? "[data-action='check']" : `[data-context-clue='${data.choice}']`)?.focus());
      }));
    }

    function bindTrainingRoom(room) {
      roomScreen.querySelector("[data-action='training-step']")?.addEventListener("click", () => {
        state.roomData.step = Math.min(5, (state.roomData.step || 0) + 1);
        renderRoom(room);
      });
    }

    function bindFairnessRoom(room) {
      roomScreen.querySelector("[data-slider='ratio']")?.addEventListener("input", (event) => {
        state.roomData.ratio = Number(event.target.value);
        state.roomData.tested = false;
        state.roomData.feedback = "";
        renderRoom(room);
      });
      roomScreen.querySelector("[data-action='remove-stereotype']")?.addEventListener("click", () => {
        state.roomData.removed = !state.roomData.removed;
        state.roomData.tested = false;
        state.roomData.feedback = state.roomData.removed ? "You removed the unfair sentence. Now test the prediction." : "The unfair sentence is back in the data.";
        renderRoom(room);
      });
    }

    function checkRoom(room) {
      const data = state.roomData;
      if (room.id === "token") {
        if (!data.selectedOption) {
          data.feedbackKind = "bad";
          data.feedback = "Choose one Token split before activating the lock.";
        } else if (data.selectedOption === tokenRoomTeachingData.challenge.correctOptionId) {
          return roomComplete(room);
        } else {
          data.submitted = true;
          data.attempts += 1;
          data.feedbackKind = "bad";
          data.feedback = "Not quite. Token boundaries do not always match whole-word or human word-part boundaries. Compare the two rows, then try again.";
        }
      }
      if (room.id === "numbers") {
        if (data.drawerOpened && data.conceptPassed) return roomComplete(room);
        data.feedbackKind = "bad";
        data.feedback = "Open the matching drawer and explain what the token ID does before collecting the crystal.";
      }
      if (room.id === "context") {
        if (data.solved && data.shifted) return roomComplete(room);
        data.feedbackKind = "bad";
        data.feedback = "Find the clue outside the current Context Window before collecting the crystal.";
      }
      if (room.id === "connections") {
        const selected = new Set(data.selected);
        if (selected.size === 2 && selected.has("dog") && selected.has("slept")) return roomComplete(room);
        data.feedback = "Choose exactly two clues: who can sleep, and which action confirms it?";
      }
      if (room.id === "prediction") {
        const expected = data.round === 0 ? "door" : "inside";
        if (data.choice === expected && data.round === 0) {
          data.generated = [data.choice];
          data.round = 1;
          data.choice = "";
          data.feedback = "Good. The selected token joins the text, so the model predicts again.";
          renderRoom(room);
          return;
        }
        if (data.choice === expected && data.round === 1) return roomComplete(room);
        data.feedback = "Compare the reviewed chances and choose the strongest candidate.";
      }
      if (room.id === "training") {
        if (data.step >= 5) return roomComplete(room);
        data.feedback = "Complete each part of the training loop before collecting the crystal.";
      }
      renderRoom(room);
    }

    function renderExit() {
      const allDone = rooms.every((room) => state.completed.has(room.id) && state.crystals.has(room.crystal));
      const placedCrystals = state.finalComplete ? new Set(rooms.map((room) => room.crystal)) : state.exitPlaced;
      const allPlaced = allDone && rooms.every((room) => placedCrystals.has(room.crystal));
      const modelPlaced = state.finalComplete ? finalModelOrder : state.exitModel;
      const reviewPlaced = state.finalComplete ? finalReviewOrder : state.exitReview;
      const modelCorrect = finalModelOrder.every((id, index) => modelPlaced[index] === id);
      const reviewCorrect = finalReviewOrder.every((id, index) => reviewPlaced[index] === id);
      const modelReady = finalModelOrder.every((_, index) => Boolean(modelPlaced[index]));
      const reviewReady = finalReviewOrder.every((_, index) => Boolean(reviewPlaced[index]));
      const canTryFinal = allPlaced && modelReady && reviewReady;
      const finalReady = allPlaced && modelCorrect && reviewCorrect;
      const exitComplete = state.finalComplete;
      const hasPlacedCards = state.exitModel.length > 0 || state.exitReview.length > 0;
      const titleText = exitComplete ? "Language Model Door opened" : allDone ? "Power the Language Model Door" : "Final room not ready";
      const leadText = exitComplete
        ? "Review mode: the exit is already open. Replay the final lock if you want to solve it again."
        : allDone
          ? "Use the six crystals to rebuild the generation path and the separate training loop."
          : "Collect all six room crystals before opening the final exit.";
      const consoleTitle = exitComplete ? "Final model complete" : allPlaced ? "Build the final model" : "Place the crystals";
      const consoleInstruction = exitComplete
        ? "The puzzle is complete. Click Replay final puzzle to unlock the controls again."
        : allPlaced
          ? canTryFinal
            ? "Both paths are full. Click Activate Language Model. If the order feels wrong, use Reset cards."
            : "Drag each card into an empty slot. You can also click a card to fill the next empty slot. Click a filled slot to remove it."
          : allDone
            ? "Click each crystal chip. It will move into a slot around the language model."
            : "The brain door needs every room crystal.";
      const pieceLabel = (collection, id) => collection.find((piece) => piece.id === id)?.label || "";
      const renderSequence = (kind, pieces, order, placed, title, hint) => `
        <section class="sequence-board">
          <h3>${title}</h3>
          <p>${hint}</p>
          <div class="sequence-slots">
            ${order.map((_, index) => {
              const id = placed[index];
              return `<button type="button" class="sequence-slot ${id ? "filled" : ""}" data-exit-slot="${kind}" data-index="${index}" data-piece="${id || ""}" draggable="${id && !state.finalComplete ? "true" : "false"}" ${state.finalComplete ? "disabled" : ""}>
                <small>${index + 1}</small>
                <span>${id ? pieceLabel(pieces, id) : "Empty slot"}</span>
              </button>`;
            }).join("")}
          </div>
          <div class="sequence-tray" aria-label="${title} cards">
            ${pieces.map((piece) => {
              const used = placed.includes(piece.id);
              return `<button type="button" class="sequence-piece" data-exit-piece="${kind}" data-piece="${piece.id}" draggable="${used || state.finalComplete ? "false" : "true"}" ${used || state.finalComplete ? "disabled" : ""}>
                <small>+</small>
                <span>${piece.label}</span>
              </button>`;
            }).join("")}
          </div>
        </section>`;
      exitScreen.innerHTML = `<section class="exit ${exitComplete ? "review-mode" : ""}">
        <div>
          <span class="clue">Final Exit</span>
          <h1>${titleText}</h1>
          <p>${leadText}</p>
          <div class="exit-steps" aria-label="Final exit steps">
            <span class="${allPlaced ? "done" : "active"}">1. Place crystals</span>
            <span class="${modelCorrect ? "done" : allPlaced ? "active" : ""}">2. Build the generation path</span>
            <span class="${reviewCorrect ? "done" : modelReady ? "active" : ""}">3. Build the training loop</span>
          </div>
        </div>
        <div class="brain-door">
          <section class="brain-chamber" aria-label="Language Model Door">
            <div class="brain-core ${allPlaced ? "charged" : ""} ${finalReady ? "ready" : ""}">
              <span>AI</span>
            </div>
            ${rooms.map((room) => {
              const placed = placedCrystals.has(room.crystal);
              return `<div class="brain-slot ${placed ? "filled" : ""}" style="--room:${room.colour}" aria-label="${room.power} slot">
                ${placed ? `<img src="${crystalAsset(room)}" alt="${room.power} crystal">` : `<span>${room.number}</span>`}
              </div>`;
            }).join("")}
            <div class="brain-status">${state.finalComplete ? "Door open" : finalReady ? "Ready to open" : allPlaced ? "Brain charged" : "Waiting for crystals"}</div>
          </section>
          <section class="review-console">
            <h2>${consoleTitle}</h2>
            <p>${consoleInstruction}</p>
            <div class="exit-guide ${exitComplete ? "complete" : ""}">
              ${exitComplete
                ? "Complete. Review both paths here, or replay the final puzzle to practise again."
                : allPlaced
                  ? "Step 2: build how a model generates text. Step 3: build the earlier training loop. Training does not happen during each reply."
                  : "Step 1: click the crystal chips below to power the Language Model Door."}
            </div>
            <div class="crystal-tray" aria-label="Collected crystals">
              ${rooms.map((room) => {
                const collected = state.crystals.has(room.crystal);
                const placed = placedCrystals.has(room.crystal);
                return `<button type="button" class="crystal-token ${placed ? "placed" : ""}" style="--room:${room.colour}" data-exit-crystal="${room.crystal}" ${collected && !state.finalComplete ? "" : "disabled"}>
                  ${collected ? `<img src="${crystalAsset(room)}" alt="">` : `<span>${room.number}</span>`}
                  <span>${room.power}</span>
                </button>`;
              }).join("")}
            </div>
            <div class="brain-puzzle" ${allPlaced ? "" : "hidden"}>
              ${renderSequence("model", finalModelPieces, finalModelOrder, modelPlaced, "Generation path", "What happens while the model makes a reply?")}
              ${renderSequence("review", finalReviewPieces, finalReviewOrder, reviewPlaced, "Training loop", "What happened earlier while the model learned from examples?")}
            </div>
            <div class="exit-actions">
              <button type="button" class="secondary" data-action="map">Room Map</button>
              ${!exitComplete && allPlaced ? `<button type="button" class="ghost-reset" data-action="clear-final" ${hasPlacedCards ? "" : "disabled"}>Reset cards</button>` : ""}
              ${exitComplete ? `<button type="button" class="gold" data-action="replay-final">Replay final puzzle</button>` : ""}
              <button type="button" class="success" data-action="complete" ${canTryFinal && !exitComplete ? "" : "disabled"}>${exitComplete ? "Exit is open" : "Activate Language Model"}</button>
            </div>
          </section>
        </div>
        <div class="feedback ${finalReady || state.finalComplete ? "good" : "bad"}">${state.finalComplete ? "You followed the full path: text becomes tokens and numbers; context and helpful connections shape one next-token prediction; the chosen token is added and the process repeats. Training is a separate earlier loop that adjusts the model across many examples." : state.exitFeedback || (finalReady ? "Both paths are correct. Activate the Language Model Door." : allPlaced ? "Build the generation path and the separate training loop." : allDone ? "Place all six crystals around the model door." : "The final room needs every room crystal.")}</div>
      </section>`;
      exitScreen.querySelector("[data-action='map']").addEventListener("click", openMap);
      const replayButton = exitScreen.querySelector("[data-action='replay-final']");
      if (replayButton) replayButton.addEventListener("click", () => {
        state.finalComplete = false;
        state.exitPlaced = new Set();
        state.exitModel = [];
        state.exitReview = [];
        state.exitFeedback = "Final lock reset. Place the six crystals, then rebuild the model.";
        renderExit();
      });
      const clearButton = exitScreen.querySelector("[data-action='clear-final']");
      if (clearButton) clearButton.addEventListener("click", () => {
        state.exitModel = [];
        state.exitReview = [];
        state.exitFeedback = "Cards cleared. Build the generation path, then the separate training loop.";
        renderExit();
      });
      exitScreen.querySelectorAll("[data-exit-crystal]").forEach((button) => button.addEventListener("click", () => {
        if (!allDone || state.finalComplete) return;
        const crystal = button.dataset.exitCrystal;
        if (state.exitPlaced.has(crystal)) state.exitPlaced.delete(crystal);
        else state.exitPlaced.add(crystal);
        state.exitFeedback = state.exitPlaced.size === rooms.length
          ? "All crystals are placed. Now build the generation path and the training loop."
          : `${state.exitPlaced.size} / ${rooms.length} crystals placed. Keep powering the Language Model Door.`;
        if (!state.exitPlaced.size) {
          state.exitModel = [];
          state.exitReview = [];
        }
        renderExit();
      }));

      const exitTarget = (kind) => kind === "review" ? state.exitReview : state.exitModel;
      const exitLimit = (kind) => kind === "review" ? finalReviewOrder.length : finalModelOrder.length;
      const placeExitPiece = (kind, piece, requestedIndex = null, fromIndex = null) => {
        if (!allPlaced || state.finalComplete) return;
        const target = exitTarget(kind);
        const limit = exitLimit(kind);
        const safeIndex = (value) => {
          if (value === null || value === undefined || value === "") return null;
          const index = Number(value);
          return Number.isInteger(index) && index >= 0 && index < limit ? index : null;
        };
        const destination = safeIndex(requestedIndex);
        const source = safeIndex(fromIndex);

        if (source === null && target.includes(piece)) return;
        if (source !== null && target[source] !== piece) return;

        if (destination !== null) {
          if (source === destination) return;
          if (source === null && target[destination]) {
            state.exitFeedback = "That slot already has a card. Drag the card to swap, or choose an empty slot.";
            renderExit();
            return;
          }
          const displaced = target[destination];
          target[destination] = piece;
          if (source !== null) target[source] = displaced;
        } else {
          const emptyIndex = Array.from({ length: limit }, (_, index) => index).find((index) => !target[index]);
          if (emptyIndex === undefined) return;
          if (source !== null) target[source] = undefined;
          target[emptyIndex] = piece;
        }

        state.exitFeedback = Array.from({ length: limit }, (_, index) => target[index]).filter(Boolean).length === limit
          ? "This console is filled. Drag cards to change the order, or fill the other console."
          : "Card added to a slot. Keep filling the empty slots.";
        renderExit();
      };

      const readExitDragPayload = (event) => {
        const transfer = event.dataTransfer;
        const json = transfer?.getData("application/x-ai-exit-piece");
        if (json) {
          try {
            const payload = JSON.parse(json);
            if (payload.kind && payload.piece) {
              return {
                kind: payload.kind,
                piece: payload.piece,
                fromIndex: payload.fromIndex === null || payload.fromIndex === undefined ? null : Number(payload.fromIndex)
              };
            }
          } catch (error) {
            // Fall back to text/plain below.
          }
        }
        const raw = transfer?.getData("text/plain") || "";
        const [kind, piece, fromIndex] = raw.split(":");
        if (!kind || !piece) {
          return activeExitDrag?.kind && activeExitDrag?.piece
            ? {
                kind: activeExitDrag.kind,
                piece: activeExitDrag.piece,
                fromIndex: activeExitDrag.fromIndex === null || activeExitDrag.fromIndex === undefined
                  ? null
                  : Number(activeExitDrag.fromIndex)
              }
            : null;
        }
        return { kind, piece, fromIndex: fromIndex === "" || fromIndex === undefined ? null : Number(fromIndex) };
      };

      const handleExitDrop = (event, boardKind, requestedIndex = null, visualTarget = null) => {
        if (state.finalComplete) return;
        event.preventDefault();
        event.stopPropagation();
        exitScreen.querySelectorAll(".drop-ready, .drop-error").forEach((node) => node.classList.remove("drop-ready", "drop-error"));
        const payload = readExitDragPayload(event);
        activeExitDrag = null;
        if (!payload) {
          state.exitFeedback = "I could not read that card. Try dragging it again, or click it instead.";
          renderExit();
          return;
        }
        if (payload.kind !== boardKind) {
          if (visualTarget) visualTarget.classList.add("drop-error");
          state.exitFeedback = "That card belongs in the other console. Match the card to its console title.";
          renderExit();
          return;
        }
        placeExitPiece(boardKind, payload.piece, requestedIndex, payload.fromIndex);
      };

      const writeExitDragPayload = (event, payload, label) => {
        if (!event.dataTransfer) return;
        activeExitDrag = payload;
        event.dataTransfer.effectAllowed = "move";
        const serialised = JSON.stringify(payload);
        event.dataTransfer.setData("application/x-ai-exit-piece", serialised);
        event.dataTransfer.setData("text/plain", `${payload.kind}:${payload.piece}:${payload.fromIndex ?? ""}`);

        const dragImage = document.createElement("div");
        dragImage.className = "sequence-drag-ghost";
        dragImage.textContent = label;
        dragImage.style.left = "-1000px";
        dragImage.style.top = "-1000px";
        document.body.appendChild(dragImage);
        event.dataTransfer.setDragImage(dragImage, 30, 24);
        window.setTimeout(() => dragImage.remove(), 0);
      };

      const showNativeDropTarget = (event, boardKind, visualTarget) => {
        if (state.finalComplete) return;
        const payload = activeExitDrag || readExitDragPayload(event);
        if (!payload) return;
        event.preventDefault();
        event.stopPropagation();
        if (event.dataTransfer) event.dataTransfer.dropEffect = payload.kind === boardKind ? "move" : "none";
        clearExitDropHighlights();
        visualTarget.classList.add(payload.kind === boardKind ? "drop-ready" : "drop-error");
      };

      const clearExitDropHighlights = () => {
        exitScreen.querySelectorAll(".drop-ready, .drop-error").forEach((node) => node.classList.remove("drop-ready", "drop-error"));
      };

      const pointInside = (rect, clientX, clientY) => (
        clientX >= rect.left &&
        clientX <= rect.right &&
        clientY >= rect.top &&
        clientY <= rect.bottom
      );

      const findExitDropTarget = (clientX, clientY, preferredKind = null) => {
        const allSlots = Array.from(exitScreen.querySelectorAll("[data-exit-slot]"));
        const slots = preferredKind
          ? allSlots.filter((slot) => slot.dataset.exitSlot === preferredKind)
          : allSlots;
        const allBoards = Array.from(exitScreen.querySelectorAll(".sequence-board"));
        const boards = preferredKind
          ? allBoards.filter((board) => board.querySelector(`[data-exit-slot="${preferredKind}"]`))
          : allBoards;

        const targetForSlot = (slot) => ({
          kind: slot.dataset.exitSlot,
          index: Number(slot.dataset.index),
          element: slot
        });

        const targetForBoard = (board) => {
          const selector = preferredKind ? `[data-exit-slot="${preferredKind}"]` : "[data-exit-slot]";
          const firstSlot = board.querySelector(selector);
          return firstSlot ? {
            kind: firstSlot.dataset.exitSlot,
            index: null,
            element: board
          } : null;
        };

        const distanceToRect = (rect) => {
          const x = Math.max(rect.left, Math.min(clientX, rect.right));
          const y = Math.max(rect.top, Math.min(clientY, rect.bottom));
          return Math.hypot(clientX - x, clientY - y);
        };

        const directSlot = slots.find((slot) => pointInside(slot.getBoundingClientRect(), clientX, clientY));
        if (directSlot) return targetForSlot(directSlot);

        const directBoard = boards.find((board) => pointInside(board.getBoundingClientRect(), clientX, clientY));
        if (directBoard) return targetForBoard(directBoard);

        const elements = typeof document.elementsFromPoint === "function"
          ? document.elementsFromPoint(clientX, clientY)
          : [document.elementFromPoint(clientX, clientY)];
        for (const element of elements) {
          if (!element || element.classList?.contains("sequence-drag-ghost")) continue;
          const slot = element.closest?.("[data-exit-slot]");
          if (slot && exitScreen.contains(slot) && (!preferredKind || slot.dataset.exitSlot === preferredKind)) {
            return targetForSlot(slot);
          }
          const board = element.closest?.(".sequence-board");
          if (board && exitScreen.contains(board)) {
            const boardTarget = targetForBoard(board);
            if (boardTarget) return boardTarget;
          }
        }

        let nearestSlot = null;
        slots.forEach((slot) => {
          const distance = distanceToRect(slot.getBoundingClientRect());
          if (distance <= 140 && (!nearestSlot || distance < nearestSlot.distance)) {
            nearestSlot = { slot, distance };
          }
        });
        if (nearestSlot) return targetForSlot(nearestSlot.slot);

        let nearestBoard = null;
        boards.forEach((board) => {
          const distance = distanceToRect(board.getBoundingClientRect());
          if (distance <= 180 && (!nearestBoard || distance < nearestBoard.distance)) {
            nearestBoard = { board, distance };
          }
        });
        if (nearestBoard) return targetForBoard(nearestBoard.board);

        return null;
      };

      const highlightExitPointerTarget = (clientX, clientY, payload) => {
        clearExitDropHighlights();
        const target = findExitDropTarget(clientX, clientY, payload?.kind || null);
        lastExitPointerTarget = target;
        if (!target || !payload) return null;
        target.element.classList.add(target.kind === payload.kind ? "drop-ready" : "drop-error");
        return target;
      };

      const startExitPointerDrag = (event, payload, label, sourceElement) => {
        if (!allPlaced || state.finalComplete || sourceElement.disabled) return;
        if (event.button !== undefined && event.button !== 0) return;

        event.preventDefault();
        sourceElement.classList.add("dragging");
        activeExitDrag = payload;
        lastExitPointerTarget = null;

	      const startX = event.clientX;
	      const startY = event.clientY;
	      let moved = false;
	      let finished = false;
	      let lastPoint = { clientX: startX, clientY: startY };
	      try {
	        sourceElement.setPointerCapture?.(event.pointerId);
	      } catch (error) {
	        // Pointer capture is a reliability helper. Dragging still works without it.
	      }
	      const ghost = document.createElement("div");
        ghost.className = "sequence-drag-ghost";
        ghost.textContent = label;
        document.body.appendChild(ghost);

        const moveGhost = (clientX, clientY) => {
          ghost.style.left = `${clientX}px`;
          ghost.style.top = `${clientY}px`;
        };

        const finish = (dropEvent, cancelled = false) => {
          if (finished) return;
          finished = true;
          dropEvent.preventDefault?.();
          dropEvent.stopPropagation?.();
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp, true);
          window.removeEventListener("pointercancel", onCancel, true);
          document.removeEventListener("pointerup", onUp, true);
          document.removeEventListener("pointercancel", onCancel, true);
	          try {
	            sourceElement.releasePointerCapture?.(dropEvent.pointerId);
	          } catch (error) {
	            // The pointer may already be released by the browser.
	          }
	          sourceElement.classList.remove("dragging");
          const rememberedTarget = lastExitPointerTarget;
          ghost.remove();
          clearExitDropHighlights();

          if (cancelled) {
            activeExitDrag = null;
            lastExitPointerTarget = null;
            return;
          }

          const finalX = Number.isFinite(dropEvent.clientX) ? dropEvent.clientX : lastPoint.clientX;
          const finalY = Number.isFinite(dropEvent.clientY) ? dropEvent.clientY : lastPoint.clientY;
          const distance = Math.hypot(finalX - startX, finalY - startY);
          if (!moved || distance < 8) {
            suppressExitClick = true;
            window.setTimeout(() => { suppressExitClick = false; }, 0);
            if (payload.fromIndex === null || payload.fromIndex === undefined) {
              placeExitPiece(payload.kind, payload.piece);
            } else {
              const target = exitTarget(payload.kind);
              if (target[payload.fromIndex] === payload.piece) {
                target[payload.fromIndex] = undefined;
                state.exitFeedback = "Card removed. Try the order again.";
                renderExit();
              }
            }
            activeExitDrag = null;
            lastExitPointerTarget = null;
            return;
          }

          suppressExitClick = true;
          window.setTimeout(() => { suppressExitClick = false; }, 0);
          const target = rememberedTarget || findExitDropTarget(finalX, finalY, payload.kind);
          activeExitDrag = null;
          lastExitPointerTarget = null;
          if (!target) {
            state.exitFeedback = "Drop the card onto a slot or inside the matching console.";
            renderExit();
            return;
          }
          if (target.kind !== payload.kind) {
            state.exitFeedback = "That card belongs in the other console. Match the card to its console title.";
            renderExit();
            return;
          }
          placeExitPiece(target.kind, payload.piece, target.index, payload.fromIndex);
        };

        const onMove = (moveEvent) => {
          moveEvent.preventDefault();
          moved = true;
          lastPoint = { clientX: moveEvent.clientX, clientY: moveEvent.clientY };
          moveGhost(moveEvent.clientX, moveEvent.clientY);
          highlightExitPointerTarget(moveEvent.clientX, moveEvent.clientY, payload);
        };
        const onUp = (upEvent) => finish(upEvent);
        const onCancel = (cancelEvent) => finish(cancelEvent, true);

        moveGhost(startX, startY);
        window.addEventListener("pointermove", onMove, { passive: false });
        window.addEventListener("pointerup", onUp, { capture: true });
        window.addEventListener("pointercancel", onCancel, { capture: true });
        document.addEventListener("pointerup", onUp, { capture: true });
        document.addEventListener("pointercancel", onCancel, { capture: true });
      };

      exitScreen.querySelectorAll("[data-exit-piece]").forEach((button) => {
        button.addEventListener("click", (event) => {
          if (suppressExitClick) {
            event.preventDefault();
            event.stopPropagation();
            return;
          }
          placeExitPiece(button.dataset.exitPiece, button.dataset.piece);
        });
        button.addEventListener("pointerdown", (event) => {
          startExitPointerDrag(
            event,
            { kind: button.dataset.exitPiece, piece: button.dataset.piece, fromIndex: null },
            button.textContent.trim(),
            button
          );
        });
        button.addEventListener("dragstart", (event) => {
          if (!allPlaced || state.finalComplete || button.disabled) {
            event.preventDefault();
            return;
          }
          writeExitDragPayload(
            event,
            { kind: button.dataset.exitPiece, piece: button.dataset.piece, fromIndex: null },
            button.textContent.trim()
          );
          button.classList.add("dragging");
        });
        button.addEventListener("dragend", () => {
          button.classList.remove("dragging");
          activeExitDrag = null;
          clearExitDropHighlights();
        });
      });

      exitScreen.querySelectorAll("[data-exit-slot]").forEach((button) => {
        button.addEventListener("click", (event) => {
          if (suppressExitClick) {
            event.preventDefault();
            event.stopPropagation();
            return;
          }
          if (state.finalComplete) return;
          const target = exitTarget(button.dataset.exitSlot);
          const index = Number(button.dataset.index);
          if (!target[index]) return;
          target[index] = undefined;
          state.exitFeedback = "Card removed. Try the order again.";
          renderExit();
        });
        button.addEventListener("pointerdown", (event) => {
          if (state.finalComplete) return;
          const target = exitTarget(button.dataset.exitSlot);
          const index = Number(button.dataset.index);
          const piece = target[index];
          if (!piece) return;
          startExitPointerDrag(
            event,
            { kind: button.dataset.exitSlot, piece, fromIndex: index },
            button.textContent.trim().replace(/^\d+\s*/, ""),
            button
          );
        });
        button.addEventListener("dragstart", (event) => {
          if (state.finalComplete || button.disabled) {
            event.preventDefault();
            return;
          }
          const target = exitTarget(button.dataset.exitSlot);
          const index = Number(button.dataset.index);
          const piece = target[index];
          if (!piece) {
            event.preventDefault();
            return;
          }
          writeExitDragPayload(
            event,
            { kind: button.dataset.exitSlot, piece, fromIndex: index },
            button.textContent.trim().replace(/^\d+\s*/, "")
          );
          button.classList.add("dragging");
        });
        button.addEventListener("dragend", () => {
          button.classList.remove("dragging");
          activeExitDrag = null;
          clearExitDropHighlights();
        });
        button.addEventListener("dragenter", (event) => showNativeDropTarget(event, button.dataset.exitSlot, button));
        button.addEventListener("dragover", (event) => showNativeDropTarget(event, button.dataset.exitSlot, button));
        button.addEventListener("dragleave", () => button.classList.remove("drop-ready", "drop-error"));
        button.addEventListener("drop", (event) => handleExitDrop(event, button.dataset.exitSlot, Number(button.dataset.index), button));
      });

      exitScreen.querySelectorAll(".sequence-board").forEach((board) => {
        const firstSlot = board.querySelector("[data-exit-slot]");
        const kind = firstSlot?.dataset.exitSlot;
        if (!kind) return;
        board.addEventListener("dragenter", (event) => showNativeDropTarget(event, kind, board));
        board.addEventListener("dragover", (event) => showNativeDropTarget(event, kind, board));
        board.addEventListener("dragleave", (event) => {
          if (!board.contains(event.relatedTarget)) board.classList.remove("drop-ready", "drop-error");
        });
        board.addEventListener("drop", (event) => handleExitDrop(event, kind, null, board));
      });

      exitScreen.querySelector("[data-action='complete']").addEventListener("click", () => {
        if (state.finalComplete) return;
        if (!allPlaced) {
          state.exitFeedback = "Place every crystal around the Language Model Door first.";
          renderExit();
          return;
        }
        if (!modelReady || !reviewReady) {
          state.exitFeedback = "Fill every empty slot before activating the brain.";
          renderExit();
          return;
        }
        if (!modelCorrect) {
          state.exitFeedback = "The generation order is not right yet. Start with tokens and numbers, then use context and connections before predicting and repeating.";
          renderExit();
          return;
        }
        if (!reviewCorrect) {
          state.exitFeedback = "The training order is not right yet. Start with an example, predict, reveal the actual token, adjust, then repeat.";
          renderExit();
          return;
        }
        state.finalComplete = true;
        state.exitPlaced = new Set(rooms.map((room) => room.crystal));
        state.exitModel = [...finalModelOrder];
        state.exitReview = [...finalReviewOrder];
        state.exitFeedback = "";
        send("ESCAPE_ROOM_COMPLETE", {});
        renderExit();
      });
    }

    window.addEventListener("message", (event) => {
      if (event.origin !== targetOrigin) return;
      const data = event.data || {};
      if (data.payload?.progress) applyInit(data.payload.progress);
      if (data.type === "ESCAPE_ROOM_INIT") applyInit(data.payload || {});
      if (data.type === "ESCAPE_ROOM_REQUEST_STATE") {
        if (data.payload?.progress) applyInit(data.payload.progress);
        send("ESCAPE_ROOM_READY");
      }
      if (data.type === "ESCAPE_ROOM_OPEN_HUB" || data.type === "ESCAPE_ROOM_RETURN_TO_HUB") openMap();
      if (data.type === "ESCAPE_ROOM_CONTINUE") continueAdventure();
      if (data.type === "ESCAPE_ROOM_OPEN_FINAL_EXIT") openExit();
      if (data.type === "ESCAPE_ROOM_OPEN_ROOM" || data.type === "ESCAPE_ROOM_REPLAY_ROOM") openRoom(data.payload?.roomId || "token", Boolean(data.payload?.replay));
      if (data.type === "ESCAPE_ROOM_RESET") {
        state.completed.clear();
        state.crystals.clear();
        state.exitPlaced.clear();
        state.exitModel = [];
        state.exitReview = [];
        state.exitFeedback = "";
        state.finalComplete = false;
        openMap();
      }
    });

    $("topMap").addEventListener("click", openMap);
    $("topContinue").addEventListener("click", continueAdventure);

    if (debug) {
      $("debugBanner").hidden = false;
      $("debugToggle").hidden = false;
      $("debugConsole").hidden = false;
      $("debugToggle").addEventListener("click", () => $("debugConsole").classList.toggle("open"));
      $("debugControls").innerHTML = rooms.map((room) => `<button type="button" data-debug-room="${room.id}">Complete R${room.number}</button>`).join("") + `<button type="button" data-debug-final>Final</button>`;
      $("debugControls").querySelectorAll("[data-debug-room]").forEach((button) => button.addEventListener("click", () => roomComplete(roomById(button.dataset.debugRoom))));
      $("debugControls").querySelector("[data-debug-final]").addEventListener("click", () => send("ESCAPE_ROOM_COMPLETE", {}));
    }

    const startRoom = searchParams.get("room");
    render();
    if (startRoom && roomById(startRoom)) openRoom(startRoom, true);
    send("ESCAPE_ROOM_READY");
  </script>
</body>
</html>
