<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How Language Models Work — Escape Room</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff8ff;
      --muted: #d8d0f4;
      --panel: rgba(14, 10, 32, .78);
      --line: rgba(228, 214, 255, .2);
      --purple: #9b6cff;
      --gold: #ffd15a;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      background: #070917;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      color: #fff;
      background: linear-gradient(135deg, #775cff, #5037ed);
      box-shadow: 0 12px 24px rgba(38, 20, 120, .22);
      font-weight: 950;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }
    button:disabled {
      opacity: .62;
      cursor: not-allowed;
      filter: grayscale(.35);
      box-shadow: none;
      color: #b9c2d8;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(230,220,255,.15);
    }
    button.secondary { background: rgba(255,255,255,.08); border: 1px solid var(--line); box-shadow: none; }
    button.gold { color: #281c05; background: linear-gradient(135deg, #ffe08a, #ffbf34); }
    button.success { color: #072917; background: linear-gradient(135deg, #7cf4b2, #25b866); }
    button.success:disabled { color: #9ca7bf; background: rgba(255,255,255,.08); }
    button.danger { background: linear-gradient(135deg, #ff7587, #e64058); }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background:
        radial-gradient(circle at 20% 8%, rgba(155,108,255,.28), transparent 24%),
        radial-gradient(circle at 82% 78%, rgba(255,193,63,.2), transparent 24%),
        linear-gradient(135deg, #0a0d20, #17102d 48%, #07101f);
    }

    .topbar {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(230,220,255,.14);
      background: rgba(7, 9, 23, .72);
      backdrop-filter: blur(14px);
    }

    body.embedded .topbar { display: none; }
    body.embedded .screen {
      min-height: calc(100vh - 16px);
      max-width: min(2100px, calc(100vw - 12px));
    }
    body.embedded .room,
    body.embedded .room-inner,
    body.embedded .exit { min-height: calc(100vh - 16px); }
    body.embedded .stage { padding: 8px; }
    body.embedded .hero {
      min-height: 270px;
      padding: 28px 36px;
      grid-template-columns: minmax(0, 1fr) 230px;
    }
    body.embedded .hero h1 { font-size: clamp(2rem, 4vw, 3.5rem); }
    body.embedded .hero p { max-width: 640px; }
    body.embedded .hero .robot { width: 210px; }
    body.embedded .map-grid { margin-top: 12px; }
    body.embedded .room-card { min-height: 156px; padding: 17px; }

    .brand span {
      display: block;
      color: #b7a6ff;
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 950;
    }

    .brand strong { font-size: 1.1rem; }
    .top-actions { display: flex; align-items: center; justify-content: flex-end; gap: 9px; flex-wrap: wrap; }
    .pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 9px 12px; color: #f5f0ff; background: rgba(255,255,255,.1); border: 1px solid rgba(230,220,255,.18); font-weight: 950; }

    .stage {
      min-height: 0;
      position: relative;
      overflow: auto;
      padding: 18px;
    }

    .screen {
      min-height: calc(100vh - 104px);
      display: none;
      max-width: min(1500px, calc(100vw - 36px));
      margin: 0 auto;
    }

    .screen.active { display: block; }

    .hero {
      min-height: 360px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 360px);
      gap: 24px;
      align-items: center;
      padding: clamp(24px, 4vw, 52px);
      border: 1px solid rgba(224,212,255,.18);
      border-radius: 28px;
      background:
        radial-gradient(circle at 80% 24%, rgba(155,108,255,.4), transparent 26%),
        linear-gradient(135deg, rgba(21, 14, 48, .9), rgba(10, 11, 30, .92)),
        url('/assets/img/final-challenge/room1/room-bg.png') center / cover;
      box-shadow: inset 0 0 120px rgba(0,0,0,.28), 0 24px 70px rgba(0,0,0,.22);
    }

    .hero h1, .room h1, .exit h1 { margin: 8px 0 12px; font-size: clamp(2.3rem, 5vw, 5rem); line-height: .95; }
    .hero p, .room p, .exit p { color: var(--muted); font-weight: 780; line-height: 1.5; font-size: 1rem; }
    .robot { width: min(280px, 100%); filter: drop-shadow(0 24px 40px rgba(0,0,0,.35)); animation: float 3.4s ease-in-out infinite; justify-self: center; }

    .map-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .room-card {
      min-height: 186px;
      position: relative;
      overflow: hidden;
      display: grid;
      align-content: space-between;
      gap: 12px;
      padding: 20px;
      border: 1px solid color-mix(in srgb, var(--room) 42%, rgba(255,255,255,.2));
      border-radius: 22px;
      text-align: left;
      color: #fff;
      background:
        radial-gradient(circle at 82% 18%, color-mix(in srgb, var(--room) 36%, transparent), transparent 26%),
        linear-gradient(135deg, rgba(13, 12, 33, .94), rgba(8, 11, 26, .92));
      box-shadow: inset 0 0 80px rgba(0,0,0,.25), 0 18px 38px rgba(0,0,0,.16);
    }

    .room-card::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .16;
      background:
        linear-gradient(transparent 0 38px, rgba(255,255,255,.12) 39px 41px, transparent 42px),
        linear-gradient(90deg, transparent 0 78px, rgba(255,255,255,.1) 79px 81px, transparent 82px);
      pointer-events: none;
    }

    .room-card > * { position: relative; z-index: 1; }
    .room-card small { color: color-mix(in srgb, var(--room) 44%, #fff); font-weight: 950; letter-spacing: .08em; text-transform: uppercase; }
    .room-card strong { font-size: 1.5rem; text-transform: uppercase; }
    .room-card p { margin: 0; color: #e9e3ff; font-weight: 760; }
    .room-card footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .crystal { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 15px; color: var(--room); background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); filter: drop-shadow(0 0 16px color-mix(in srgb, var(--room) 64%, transparent)); font-size: 1.7rem; }
    .room-card.locked { opacity: .58; }
    .room-card.locked button { background: rgba(255,255,255,.08); color: #d8d0f4; }
    .room-card.completed::after {
      content: "Crystal collected";
      position: absolute;
      right: 14px;
      top: 14px;
      z-index: 2;
      padding: 6px 9px;
      border-radius: 999px;
      color: #0b2418;
      background: #9ff3c4;
      font-size: .72rem;
      font-weight: 950;
    }

    .map-footer {
      margin-top: 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 15px 18px;
      border: 1px solid rgba(226,214,255,.18);
      border-radius: 20px;
      background: rgba(10, 10, 28, .66);
    }

    .inventory {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-weight: 950;
    }

    .inventory span {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 12px;
      color: rgba(255,255,255,.35);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
    }

    .inventory span.collected { color: var(--room); box-shadow: 0 0 18px color-mix(in srgb, var(--room) 56%, transparent); }

    .room {
      min-height: calc(100vh - 104px);
      border: 1px solid rgba(224,212,255,.18);
      border-radius: 28px;
      overflow: hidden;
      background:
        radial-gradient(circle at 78% 24%, color-mix(in srgb, var(--room) 32%, transparent), transparent 25%),
        linear-gradient(135deg, #101328, #090b1b);
      box-shadow: inset 0 0 120px rgba(0,0,0,.28), 0 24px 70px rgba(0,0,0,.22);
    }

    .room-bg-token {
      background:
        linear-gradient(90deg, rgba(4,5,15,.18), rgba(4,5,15,.06) 50%, rgba(4,5,15,.34)),
        url('/assets/img/final-challenge/room1/room-bg.png') center / cover;
    }

    .room-bg-numbers {
      background:
        linear-gradient(105deg, rgba(6, 10, 30, .9), rgba(18, 25, 67, .72) 54%, rgba(9, 9, 29, .9)),
        radial-gradient(circle at 72% 18%, rgba(91, 158, 255, .34), transparent 28%),
        url('/assets/img/final-challenge/room1/room-bg.png') center / cover;
    }

    .room-bg-context {
      background:
        linear-gradient(105deg, rgba(5, 12, 29, .92), rgba(11, 38, 58, .74) 58%, rgba(8, 12, 34, .9)),
        radial-gradient(circle at 76% 20%, rgba(56, 196, 201, .3), transparent 28%),
        url('/assets/img/final-challenge/room1/room-bg.png') center / cover;
    }

    .room-inner {
      min-height: calc(100vh - 104px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 16px;
      padding: clamp(18px, 3vw, 34px);
      background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.2));
    }

    .room-head { display: flex; justify-content: space-between; gap: 16px; align-items: start; }
    .room-head span { color: color-mix(in srgb, var(--room) 48%, #fff); font-weight: 950; text-transform: uppercase; letter-spacing: .08em; }
    .room-head h1 { font-size: clamp(2rem, 4vw, 4.2rem); }
    .room-objective { max-width: 620px; }

    .room-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 370px);
      gap: 18px;
      align-items: stretch;
    }

    .puzzle-board, .guide-panel {
      border: 1px solid rgba(232,222,255,.18);
      border-radius: 22px;
      padding: 18px;
      background: rgba(8, 9, 25, .68);
      box-shadow: inset 0 0 50px rgba(0,0,0,.18);
    }

    .puzzle-board { display: grid; align-content: start; gap: 14px; }
    .guide-panel { display: grid; align-content: start; gap: 12px; }
    .guide-panel img { width: 104px; justify-self: center; filter: drop-shadow(0 18px 24px rgba(0,0,0,.3)); animation: float 3.4s ease-in-out infinite; }
    .guide-panel h2 { margin: 0; }
    .guide-panel p { margin: 0; }

    .step-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 2px;
    }

    .step-pill {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      min-height: 48px;
      padding: 8px 10px;
      border-radius: 14px;
      color: rgba(255,255,255,.66);
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(230,220,255,.13);
      font-weight: 900;
    }

    .step-pill span:first-child {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: #fff;
      background: rgba(255,255,255,.12);
      font-size: .82rem;
    }

    .step-pill.current {
      color: #fff;
      border-color: color-mix(in srgb, var(--room) 58%, rgba(255,255,255,.2));
      background: color-mix(in srgb, var(--room) 22%, rgba(255,255,255,.08));
    }

    .step-pill.done {
      color: #d9ffe9;
      border-color: rgba(124,244,178,.3);
      background: rgba(32,155,93,.16);
    }

    .step-pill.done span:first-child {
      color: #072917;
      background: #7cf4b2;
    }

    .clue {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border-radius: 999px;
      color: #fff;
      background: color-mix(in srgb, var(--room) 28%, rgba(255,255,255,.08));
      border: 1px solid color-mix(in srgb, var(--room) 40%, rgba(255,255,255,.18));
      font-weight: 950;
    }

    .door-zone {
      min-height: 230px;
      display: grid;
      place-items: center;
      gap: 10px;
      text-align: center;
    }

    .tokeniser-device {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 16px;
      align-items: center;
      margin: 14px 0;
      padding: 14px;
      border-radius: 18px;
      background: rgba(0,0,0,.3);
      border: 1px solid rgba(180,210,255,.22);
    }

    .tokeniser-device img { width: 110px; }
    .output-tokens, .slot-row, .choice-grid, .chip-grid { display: flex; flex-wrap: wrap; gap: 10px; }

    .token {
      min-width: 72px;
      min-height: 46px;
      display: grid;
      place-items: center;
      padding: 8px 12px;
      border-radius: 15px;
      color: #32200e;
      background: #dec68e;
      border: 2px solid rgba(95,59,24,.22);
      font-weight: 950;
      font-size: 1.12rem;
      box-shadow: 0 10px 20px rgba(0,0,0,.18);
    }

    .token.selected { outline: 4px solid #ffe56a; transform: translateY(-4px); }
    .token.example-token { min-width: 62px; background: #eadcff; color: #241747; }
    .token.used { opacity: .45; }
    .token[draggable="true"] { cursor: grab; }
    .token[draggable="true"]:active { cursor: grabbing; }
    .slot[draggable="true"] { cursor: grab; }
    .slot[draggable="true"]:active { cursor: grabbing; }
    .token.dragging {
      opacity: .72;
      transform: translateY(-6px) scale(1.03);
      outline: 4px solid rgba(255,229,106,.75);
    }
    .slot.dragging {
      opacity: .72;
      transform: translateY(-5px) scale(1.03);
      border-color: #ffe56a;
      box-shadow: 0 0 0 5px rgba(255,229,106,.12), 0 0 24px rgba(255,229,106,.22);
    }
    .slot {
      width: 76px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: #fff;
      background: rgba(0,0,0,.24);
      border: 2px dashed rgba(230,220,255,.32);
      font-weight: 950;
    }
    .slot.filled { border-style: solid; border-color: color-mix(in srgb, var(--room) 55%, #fff); background: rgba(255,255,255,.14); }
    .slot.drag-over {
      border-style: solid;
      border-color: #ffe56a;
      background: rgba(255,229,106,.16);
      box-shadow: 0 0 0 5px rgba(255,229,106,.12), 0 0 24px rgba(255,229,106,.22);
    }
    .slot.error { border-color: #ff7083; animation: shake .25s ease; }

    .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .choice-grid button, .chip-grid button {
      min-height: 54px;
      color: #f8f4ff;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(230,220,255,.18);
      box-shadow: none;
      text-align: left;
    }
    .choice-grid button.selected, .chip-grid button.selected {
      border-color: color-mix(in srgb, var(--room) 62%, #fff);
      background: color-mix(in srgb, var(--room) 24%, rgba(255,255,255,.1));
    }

    .room-bg-token .door-zone { align-content: start; }
    .token-split-challenge {
      width: min(820px, 100%);
      display: grid;
      gap: 13px;
      margin-top: 6px;
      border: 1px solid rgba(215, 201, 255, .25);
      border-radius: 20px;
      padding: 18px;
      color: #f8f6ff;
      background: rgba(11, 10, 34, .48);
      box-shadow: inset 0 0 28px rgba(155, 108, 255, .1);
      text-align: left;
    }
    .token-question-badge {
      width: fit-content;
      border-radius: 999px;
      padding: 6px 10px;
      color: #241747;
      background: #eadcff;
      font-size: .78rem;
      font-weight: 950;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .token-split-challenge h2, .token-split-challenge p { margin: 0; }
    .token-target-sentence {
      border-radius: 14px;
      padding: 13px 15px;
      color: #282044;
      background: rgba(255,255,255,.94);
      font-size: 1.2rem;
      font-weight: 850;
    }
    .token-target-sentence mark {
      border-radius: 7px;
      padding: 2px 5px;
      color: #3e2386;
      background: #e9dcff;
      box-shadow: 0 3px 0 #aa86ef;
    }
    .token-split-options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .token-split-option {
      min-height: 90px;
      display: grid;
      align-content: center;
      gap: 9px;
      border: 1px solid rgba(225, 215, 255, .28);
      border-bottom: 5px solid rgba(157, 126, 225, .48);
      border-radius: 16px;
      padding: 12px;
      color: #f9f7ff;
      background: rgba(255,255,255,.08);
      text-align: left;
    }
    .token-split-option small { color: #cdc3e9; font-weight: 900; }
    .token-split-option > span { display: flex; flex-wrap: wrap; gap: 5px; }
    .token-split-option b, .token-comparison span {
      border-radius: 9px;
      padding: 6px 8px;
      color: #2a1b50;
      background: #eee4ff;
      box-shadow: 0 3px 0 #a986e8;
    }
    .token-split-option:hover { border-color: #cbb6ff; background: rgba(155,108,255,.17); }
    .token-split-option.selected {
      border-color: #ffe56a;
      border-bottom-color: #cda72d;
      background: rgba(255,229,106,.13);
      box-shadow: 0 0 0 3px rgba(255,229,106,.12);
    }
    .token-split-option:focus-visible { outline: 3px solid #ffe76d; outline-offset: 3px; }
    .token-comparison {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      border-radius: 16px;
      padding: 13px;
      color: #2a2442;
      background: rgba(255,255,255,.94);
    }
    .token-comparison > div { display: grid; gap: 7px; }
    .token-comparison small { color: #635879; font-weight: 950; text-transform: uppercase; letter-spacing: .04em; }
    .token-comparison div > div { display: flex; flex-wrap: wrap; gap: 5px; }
    .token-comparison em { color: #665d78; font-size: .78rem; font-style: normal; font-weight: 800; }
    .token-comparison > b { color: #6f55cb; }
    .token-hint { border-left: 4px solid #ffe56a; border-radius: 10px; padding: 9px 11px; background: rgba(255,229,106,.1); }
    .token-room-actions { display: flex; flex-wrap: wrap; gap: 9px; }
    .token-lock-accepts { margin: 0; color: #d7ffe8; font-weight: 950; }
    .token-success-chain {
      display: grid;
      grid-template-columns: minmax(110px,1fr) auto minmax(110px,1fr) auto minmax(190px,1.4fr);
      align-items: center;
      gap: 10px;
      width: min(760px, 100%);
    }
    .token-success-chain > span { display: grid; gap: 5px; border-radius: 14px; padding: 11px; background: rgba(255,255,255,.1); }
    .token-success-chain small { color: #d5cced; font-weight: 900; text-transform: uppercase; }
    .token-success-chain i { color: #c3adff; font-size: 1.3rem; font-style: normal; font-weight: 950; }

    .numbers-room-body {
      grid-template-columns: minmax(0, 1fr) minmax(280px, 340px);
      align-items: start;
    }
    .room-bg-numbers .numbers-puzzle-intro {
      border-color: rgba(184, 167, 255, .32);
      background: linear-gradient(145deg, rgba(12, 15, 43, .9), rgba(16, 28, 65, .78));
      box-shadow: inset 0 0 56px rgba(105, 87, 230, .11), 0 18px 44px rgba(0, 0, 0, .24);
    }
    .room-bg-numbers .guide-panel {
      min-height: 0;
      grid-template-columns: 76px minmax(0, 1fr);
      grid-template-rows: auto auto;
      column-gap: 14px;
      row-gap: 6px;
      align-items: center;
      align-self: start;
      border-color: rgba(194, 179, 255, .3);
      padding: 16px;
      background: linear-gradient(145deg, rgba(18, 15, 50, .94), rgba(11, 18, 43, .9));
      box-shadow: inset 0 0 30px rgba(138, 106, 255, .09), 0 14px 34px rgba(0,0,0,.22);
    }
    .room-bg-numbers .guide-panel img {
      grid-column: 1;
      grid-row: 1 / span 2;
      width: 72px;
    }
    .room-bg-numbers .guide-panel h2,
    .room-bg-numbers .guide-panel p { grid-column: 2; }
    .room-bg-numbers .guide-panel h2 { font-size: 1.15rem; }
    .room-bg-numbers .guide-panel p { color: #ded8f5; font-size: .9rem; line-height: 1.42; }
    .numbers-workspace {
      grid-column: 1 / -1;
      display: grid;
      gap: 15px;
      border: 1px solid rgba(184, 167, 255, .25);
      border-radius: 22px;
      padding: 18px;
      background: linear-gradient(155deg, rgba(8, 12, 35, .9), rgba(13, 23, 56, .82));
      box-shadow: inset 0 0 54px rgba(77, 118, 224, .08), 0 18px 44px rgba(0,0,0,.2);
    }
    .numbers-intro { margin: 0; max-width: 820px; color: #d9e7ff; }
    .numbers-lookup-chain {
      display: grid;
      grid-template-columns: minmax(130px, .75fr) auto minmax(160px, .9fr) auto minmax(210px, 1.3fr);
      gap: 11px;
      align-items: center;
      border: 1px solid rgba(181, 166, 255, .36);
      border-radius: 20px;
      padding: 16px;
      background: linear-gradient(135deg, rgba(98, 77, 220, .22), rgba(67, 151, 236, .18));

    .data-examples {

      background: rgba(255,255,255,.07);
      border: 1px solid rgba(230,220,255,.15);

    .data-example.warning {
      color: #ffe2e7;
      background: rgba(170,37,58,.2);
      border-color: rgba(255,112,131,.34);

      gap: 4px;
      align-content: start;
      min-height: 78px;
      padding: 10px;
      border-radius: 14px;

      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.13);
      font-weight: 850;

    .prediction-big {
      display: grid;
      gap: 8px;
      padding: 14px;
      border-radius: 16px;
      background: rgba(0,0,0,.28);
      border: 1px solid rgba(255,255,255,.14);
    }

      font-size: clamp(1.6rem, 4vw, 3rem);

      gap: 8px;
      margin-top: 8px;
    }

      color: #f9f5ff;

    }

      background: rgba(255,255,255,.13);
    }

    .prediction-bar i {
      display: block;
      height: 100%;
      width: var(--value);
      border-radius: inherit;
      background: linear-gradient(90deg, var(--bar), #fff2b0);
      transition: width .24s ease;
    }

    .fix-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .remove-card {
      width: 100%;
      display: grid;
      gap: 4px;
      min-height: 72px;
      text-align: left;
      color: #fff;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(230,220,255,.18);
      box-shadow: none;
    }

    .remove-card.selected {
      color: #d7ffe8;
      border-color: rgba(124,244,178,.45);
      background: rgba(32,155,93,.2);
    }

    .remove-card:not(.selected)::before,
    .remove-card.selected::before {
      content: "";
      display: block;
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff5770, #ffbd3d);
      opacity: .85;
    }

    .remove-card.selected::before {
      background: linear-gradient(90deg, #38c985, #7cf4b2);
    }

    .test-output {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      padding: 12px;
      border-radius: 16px;
      color: #f8f4ff;
      background: rgba(155,108,255,.12);
      border: 1px solid rgba(155,108,255,.28);
      font-weight: 850;
    }

    .test-output b { color: #fff; }

    .test-output.good {
      color: #d7ffe8;
      background: rgba(32,155,93,.18);
      border-color: rgba(124,244,178,.36);
    }

    .test-output.bad {
      color: #ffd5db;
      background: rgba(170,37,58,.22);
      border-color: rgba(255,112,131,.36);
    }

    .room-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 8px;
      border-top: 1px solid rgba(230,220,255,.14);
    }

    .feedback {
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 14px;
      padding: 10px 12px;
      color: #f8f4ff;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      font-weight: 850;
    }
    .feedback.good { color: #d7ffe8; border-color: rgba(124,244,178,.38); background: rgba(32,155,93,.22); }
    .feedback.bad { color: #ffd5db; border-color: rgba(255,112,131,.4); background: rgba(170,37,58,.24); }

    .completion {
      display: grid;
      place-items: center;
      gap: 14px;
      text-align: center;
      padding: 26px;
    }
    .crystal-stage {
      position: relative;
      width: clamp(132px, 16vw, 190px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      isolation: isolate;
    }
    .crystal-stage::before {
      content: "";
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.78), color-mix(in srgb, var(--room) 46%, transparent) 32%, transparent 70%);
      filter: blur(5px);
      opacity: .9;
      animation: crystalBurst .8s ease-out both, crystalAura 2.2s ease-in-out .8s infinite;
      z-index: -2;
    }
    .crystal-stage::after {
      content: "";
      position: absolute;
      inset: -8%;
      background:
        radial-gradient(circle at 18% 28%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 78% 20%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 86% 68%, color-mix(in srgb, var(--room) 72%, #fff) 0 3px, transparent 4px),
        radial-gradient(circle at 28% 78%, color-mix(in srgb, var(--room) 76%, #fff) 0 2px, transparent 3px);
      opacity: .86;
      animation: crystalSparkle 2.4s ease-in-out infinite;
      z-index: -1;
    }
    .completion-crystal {
      width: clamp(94px, 10vw, 136px);
      filter:
        brightness(1.08)
        saturate(1.08)
        drop-shadow(0 0 16px #fff)
        drop-shadow(0 0 30px var(--room));
      animation: crystalRise .78s cubic-bezier(.17,.84,.44,1) both, float 2.2s ease-in-out .8s infinite;
    }
    .completion .clue { animation: collectedPop .42s ease .16s both; }
    .completion h2,
    .completion p,
    .completion div { animation: softReveal .46s ease .34s both; }

    .exit {
      min-height: calc(100vh - 104px);
      display: grid;
      gap: 18px;
      border: 1px solid rgba(224,212,255,.18);
      border-radius: 28px;
      padding: clamp(20px, 3vw, 38px);
      background:
        radial-gradient(circle at 50% 36%, rgba(155,108,255,.34), transparent 28%),
        radial-gradient(circle at 84% 16%, rgba(255,209,90,.22), transparent 24%),
        linear-gradient(135deg, #14112a, #080a19);
    }
    body.embedded .exit {
      min-height: calc(100vh - 16px);
    }
    .exit.review-mode {
      background:
        radial-gradient(circle at 50% 36%, rgba(124,244,178,.18), transparent 30%),
        radial-gradient(circle at 84% 16%, rgba(255,209,90,.18), transparent 24%),
        linear-gradient(135deg, #111927, #080a19);
    }
    .brain-door {
      display: grid;
      grid-template-columns: minmax(360px, .9fr) minmax(460px, 1.1fr);
      gap: 18px;
      align-items: stretch;
    }
    .brain-chamber, .review-console {
      border: 1px solid rgba(230,220,255,.18);
      border-radius: 24px;
      background: rgba(255,255,255,.07);
      padding: 18px;
      min-height: 430px;
      min-width: 0;
    }
    .brain-chamber {
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .brain-core {
      width: clamp(280px, 22vw, 410px);
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: clamp(3.4rem, 8vw, 6rem);
      font-weight: 950;
      background:
        radial-gradient(circle, rgba(255,255,255,.22), transparent 32%),
        radial-gradient(circle at 52% 46%, rgba(155,108,255,.62), rgba(20,14,48,.88) 62%);
      border: 2px solid rgba(210,190,255,.35);
      box-shadow: 0 0 55px rgba(155,108,255,.34), inset 0 0 45px rgba(255,255,255,.08);
      transition: filter .28s ease, transform .28s ease;
    }
    .brain-core.ready {
      filter: brightness(1.18) saturate(1.22);
      transform: scale(1.02);
      box-shadow: 0 0 80px rgba(155,108,255,.52), inset 0 0 55px rgba(255,255,255,.16);
    }
    .brain-core.charged {
      box-shadow: 0 0 54px rgba(155,108,255,.42), inset 0 0 42px rgba(255,255,255,.12);
    }
    .brain-slot {
      position: absolute;
      width: 74px;
      height: 74px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      border: 1px dashed rgba(232,223,255,.42);
      background: rgba(8,8,24,.46);
      box-shadow: inset 0 0 22px rgba(0,0,0,.28);
    }
    .brain-slot.filled {
      border-style: solid;
      border-color: color-mix(in srgb, var(--room) 78%, white);
      background:
        radial-gradient(circle, color-mix(in srgb, var(--room) 30%, transparent), transparent 68%),
        rgba(18,14,42,.76);
      box-shadow:
        0 0 22px color-mix(in srgb, var(--room) 36%, transparent),
        inset 0 0 22px rgba(255,255,255,.08);
    }
    .brain-slot span {
      color: rgba(232,223,255,.72);
      font-weight: 950;
    }
    .brain-slot img { width: 58px; height: 58px; object-fit: contain; animation: float 2.4s ease-in-out infinite; }
    .brain-slot:nth-child(2) { top: 22px; left: 50%; transform: translateX(-50%); }
    .brain-slot:nth-child(3) { top: 120px; right: 34px; }
    .brain-slot:nth-child(4) { bottom: 72px; right: 72px; }
    .brain-slot:nth-child(5) { bottom: 72px; left: 72px; }
    .brain-slot:nth-child(6) { top: 120px; left: 34px; }
    .brain-slot:nth-child(7) { bottom: 22px; left: 50%; transform: translateX(-50%); }
    .crystal-tray {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .crystal-token {
      min-width: 118px;
      min-height: 74px;
      padding: 8px 10px;
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 8px;
      align-items: center;
      text-align: left;
      color: #fff;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(230,220,255,.2);
      box-shadow: none;
    }
    .crystal-token img { width: 38px; height: 38px; object-fit: contain; }
    .crystal-token.placed {
      border-color: var(--room);
      background: color-mix(in srgb, var(--room) 24%, rgba(255,255,255,.08));
      transform: translateY(-2px);
    }
    .brain-chain {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }
    .brain-chain div {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: center;
      border: 1px solid rgba(230,220,255,.16);
      border-radius: 16px;
      padding: 10px 12px;
      color: #f5f0ff;
      background: rgba(255,255,255,.07);
      font-weight: 880;
    }
    .brain-chain span {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: #160f2f;
      background: #7cf4b2;
      font-weight: 950;
    }
    .exit-steps {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .exit-steps span {
      border: 1px solid rgba(230,220,255,.2);
      border-radius: 999px;
      padding: 8px 12px;
      color: rgba(245,240,255,.78);
      background: rgba(255,255,255,.07);
      font-weight: 900;
      font-size: .9rem;
    }
    .exit-steps span.done {
      color: #15331f;
      border-color: rgba(124,244,178,.6);
      background: #7cf4b2;
    }
    .exit-steps span.active {
      color: #fff;
      border-color: rgba(155,108,255,.8);
      background: rgba(155,108,255,.28);
      box-shadow: 0 0 24px rgba(155,108,255,.18);
    }
    .brain-status {
      position: absolute;
      inset: auto 20px 26px;
      text-align: center;
      color: rgba(245,240,255,.86);
      font-weight: 950;
    }
    .brain-puzzle {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(260px, .92fr);
      gap: 12px;
      margin-top: 14px;
    }
    .sequence-board {
      border: 1px solid rgba(230,220,255,.18);
      border-radius: 20px;
      padding: 14px;
      background: rgba(255,255,255,.06);
    }
    .sequence-board.drop-ready {
      border-color: rgba(255,229,106,.68);
      background: rgba(255,229,106,.08);
      box-shadow: 0 0 0 4px rgba(255,229,106,.08);
    }
    .sequence-board h3 { margin-bottom: 4px; }
    .sequence-board p {
      color: rgba(232,223,255,.76);
      font-weight: 780;
      margin-bottom: 10px;
    }
    .sequence-slots, .sequence-tray {
      display: grid;
      gap: 8px;
    }
    .sequence-slots {
      padding: 8px;
      border-radius: 16px;
      background: rgba(7,6,22,.18);
    }
    .sequence-slot, .sequence-piece {
      width: 100%;
      min-height: 46px;
      border-radius: 14px;
      padding: 8px 10px;
      border: 1px dashed rgba(230,220,255,.28);
      background: rgba(12,10,32,.54);
      color: rgba(245,240,255,.82);
      font-weight: 900;
      box-shadow: none;
      text-align: left;
      display: grid;
      grid-template-columns: 30px 1fr;
      align-items: center;
      gap: 8px;
    }
    .sequence-slot.filled {
      border-style: solid;
      border-color: rgba(124,244,178,.6);
      background: rgba(124,244,178,.12);
      color: #fff;
    }
    .sequence-slot small, .sequence-piece small {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(155,108,255,.24);
      color: #fff;
      font-weight: 950;
    }
    .sequence-piece {
      border-style: solid;
      border-color: rgba(155,108,255,.42);
      background: rgba(155,108,255,.18);
      cursor: pointer;
    }
    .sequence-piece:hover, .sequence-slot.filled:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.54);
    }
    .sequence-piece:not(:disabled),
    .sequence-slot.filled:not(:disabled) {
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: element;
    }
    .sequence-piece:not(:disabled):active,
    .sequence-slot.filled:not(:disabled):active {
      cursor: grabbing;
    }
    .sequence-piece.dragging, .sequence-slot.dragging {
      opacity: .74;
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(255,229,106,.82);
      box-shadow: 0 0 0 4px rgba(255,229,106,.12);
    }
    .sequence-drag-ghost {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 9999;
      pointer-events: none;
      transform: translate(-50%, -50%);
      min-width: 160px;
      max-width: 280px;
      padding: 12px 16px;
      border: 2px solid rgba(255,229,106,.88);
      border-radius: 16px;
      background: rgba(37,28,75,.96);
      color: #fff;
      font-weight: 950;
      text-align: center;
      box-shadow: 0 16px 38px rgba(0,0,0,.38), 0 0 28px rgba(255,229,106,.18);

    .sequence-slot.drop-ready {
      border-style: solid;
      border-color: #ffe56a;
      background: rgba(255,229,106,.13);
      box-shadow: 0 0 0 4px rgba(255,229,106,.09), 0 0 22px rgba(255,229,106,.16);
    }
    .sequence-slot.drop-error {
      border-style: solid;
      border-color: rgba(255,90,118,.8);
      background: rgba(255,90,118,.16);
    }
    .sequence-piece:disabled {
      opacity: .42;
      cursor: default;
    }
    .exit-guide {
      margin: 14px 0 0;
      padding: 12px 14px;
      border: 1px solid rgba(124,244,178,.28);
      border-radius: 16px;
      color: #eafff2;
      background: rgba(124,244,178,.12);
      font-weight: 900;
      line-height: 1.35;
    }
    .exit-guide.complete {
      color: #15331f;
      background: #7cf4b2;
      border-color: rgba(124,244,178,.7);
    }
    .exit-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      align-items: center;
      margin-top: 14px;
    }
    .exit-actions .gold {
      color: #271a02;
      background: linear-gradient(135deg, #ffe07a, #ffbd38);
      border-color: rgba(255,224,122,.7);
    }
    .exit-actions .ghost-reset {
      color: #fff;
      border-color: rgba(255,255,255,.28);
      background: rgba(255,255,255,.08);
    }
    @media (max-width: 900px) {
      .brain-puzzle { grid-template-columns: 1fr; }
    }
    @media (min-width: 1500px) {
      .screen {
        max-width: min(1880px, calc(100vw - 44px));
      }
      body.embedded .stage {
        padding: 10px;
      }
      body.embedded .screen {
        max-width: min(2140px, calc(100vw - 16px));
      }
      .exit {
        padding: clamp(24px, 2vw, 46px);
        gap: 22px;
      }
      .brain-door {
        grid-template-columns: minmax(620px, 1fr) minmax(740px, 1.15fr);
        gap: 26px;
      }
      .brain-chamber,
      .review-console {
        min-height: 560px;
        padding: 24px;
      }
      .crystal-token {
        min-width: 146px;
      }
    }
    @media (min-width: 1800px) {
      .brain-door {
        grid-template-columns: minmax(740px, 1.05fr) minmax(880px, 1.2fr);
      }
      .brain-core {
        width: clamp(380px, 24vw, 520px);
      }
      .brain-slot {
        width: 86px;
        height: 86px;
      }
      .brain-slot img {
        width: 68px;
        height: 68px;
      }
    }

    .debug-banner { position: fixed; left: 16px; top: 16px; z-index: 30; padding: 8px 12px; border-radius: 999px; color: #241747; background: #ffe58f; font-weight: 950; box-shadow: 0 10px 24px rgba(0,0,0,.25); }
    .debug-toggle { position: fixed; right: 16px; bottom: 16px; z-index: 40; }
    .debug-console { position: fixed; right: 16px; bottom: 66px; z-index: 39; width: min(360px, calc(100vw - 32px)); max-height: 220px; overflow-y: auto; border: 1px solid rgba(220,206,255,.25); border-radius: 16px; padding: 12px; background: rgba(10, 8, 28, .9); box-shadow: 0 18px 45px rgba(0,0,0,.3); display: none; }
    .debug-console.open { display: block; }
    .debug-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .debug-controls button { padding: 9px 10px; font-size: .78rem; }
    .log { white-space: pre-wrap; color: #dcd4ff; font-weight: 700; font-size: .78rem; line-height: 1.4; text-align: left; }

    .journey-strip, .training-demo { display:grid; grid-template-columns:minmax(140px,1fr) auto minmax(140px,1fr) auto minmax(210px,1.35fr); gap:12px; align-items:center; margin:18px 0; }
    .journey-strip button, .training-demo>div { display:grid; gap:7px; min-height:108px; align-content:center; border:1px solid rgba(114,91,203,.3); border-bottom:5px solid rgba(78,61,156,.55); border-radius:18px; padding:16px; color:#201846; background:rgba(255,255,255,.9); text-align:center; }
    .journey-strip button.selected { color:#fff; background:linear-gradient(135deg,#7256d8,#458ed9); }
    .journey-strip small, .training-demo small { font-weight:900; text-transform:uppercase; letter-spacing:.05em; opacity:.72; }
    .journey-strip strong, .training-demo strong { font-size:clamp(1rem,2vw,1.35rem); }
    .journey-strip>span, .training-demo>span { color:var(--room); font-size:1.7rem; font-weight:950; }
    .simulation-note { border-radius:14px; padding:12px 14px; color:#45516d; background:rgba(255,255,255,.72); }
    .context-story { display:grid; gap:10px; margin:18px 0; }
    .context-story p { margin:0; }
    .context-story .outside { border:2px dashed #aeb7c8; border-radius:16px; padding:14px 18px; color:#78849b; background:rgba(238,241,247,.74); opacity:.67; }
    .context-story .inside { border:3px solid var(--room); border-radius:18px; padding:15px 18px; background:rgba(232,252,249,.86); box-shadow:0 8px 0 rgba(39,145,150,.2); }
    .context-story small { display:block; margin-bottom:7px; font-weight:950; text-transform:uppercase; letter-spacing:.05em; }
    .training-demo { grid-template-columns:1fr auto 1fr auto 1fr; }
    @media (max-width:760px) { .journey-strip,.training-demo,.token-split-options,.token-success-chain { grid-template-columns:1fr; }.journey-strip>span,.training-demo>span { transform:rotate(90deg); text-align:center; }.token-success-chain i { transform:rotate(90deg); }.token-comparison { grid-template-columns:1fr; }.token-comparison > b { text-align:center; } }

    @keyframes float { 50% { transform: translateY(-8px); } }
    @keyframes crystalRise {
      from { opacity: 0; transform: translateY(18px) scale(.72); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes crystalBurst {
      from { opacity: 0; transform: scale(.38); }
      to { opacity: .9; transform: scale(1); }
    }
    @keyframes crystalAura { 50% { opacity: .58; transform: scale(1.08); } }
    @keyframes crystalSparkle { 50% { opacity: .42; transform: rotate(6deg) scale(1.04); } }
    @keyframes collectedPop {
      from { opacity: 0; transform: translateY(6px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes softReveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shake { 25% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
    @media (max-width: 980px) {
      body { overflow: auto; }
      .app { min-height: 100vh; height: auto; }
      .stage { overflow: visible; }
      .hero, .room-body, .brain-door { grid-template-columns: 1fr; }
      .fairness-data-row, .fix-controls { grid-template-columns: 1fr; }
      .map-grid { grid-template-columns: 1fr; }
      .screen, .room, .room-inner, .exit { min-height: auto; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span>Final learning challenge</span><strong>Language Model Escape Room</strong></div>
      <div class="top-actions">
        <button class="secondary" type="button" id="topMap">Room Map</button>
        <button type="button" id="topContinue">Continue</button>
        <span class="pill" id="topProgress">0 / 6 crystals</span>
      </div>
    </header>

    <main class="stage">
      <section class="screen active" id="mapScreen"></section>
      <section class="screen" id="roomScreen"></section>
      <section class="screen" id="exitScreen"></section>
    </main>
  </div>

  <div class="debug-banner" id="debugBanner" hidden>HTML5 prototype runtime — replace with Construct export later.</div>
  <button class="debug-toggle secondary" type="button" id="debugToggle" hidden>Developer log</button>
  <aside class="debug-console" id="debugConsole" aria-label="Developer bridge console" hidden>
    <div class="debug-controls" id="debugControls"></div>
    <div class="log" id="log">Debug console ready.</div>
  </aside>

  <script>
    const searchParams = new URLSearchParams(window.location.search);
    const debug = searchParams.get("debug") === "1";
    if (window.parent !== window) document.body.classList.add("embedded");
    const targetOrigin = window.location.origin;
    const rooms = [
      { id: "token", number: 1, title: "Token Workshop", power: "Tokens", crystal: "token", colour: "#9b6cff", aim: "Choose the real tokenizer split for one highlighted word." },
      { id: "numbers", number: 2, title: "Number Lookup", power: "Numbers", crystal: "numbers", colour: "#3a8bff", aim: "Follow a token ID to one learned row of numbers." },
      { id: "context", number: 3, title: "Context Window", power: "Context", crystal: "context", colour: "#38c4c9", aim: "See which earlier tokens are available right now." },
      { id: "connections", number: 4, title: "Connection Lab", power: "Connections", crystal: "connections", colour: "#ff9d3d", aim: "Find the visible tokens that provide the most helpful clues." },
      { id: "prediction", number: 5, title: "Next-Token Machine", power: "Prediction", crystal: "prediction", colour: "#ff5f9e", aim: "Choose one possible next token, add it, and predict again." },
      { id: "training", number: 6, title: "Training Workshop", power: "Training", crystal: "training", colour: "#46b86f", aim: "Follow prediction, answer, adjustment and repetition during training." }
    ];
    const tokenRoomTeachingData = Object.freeze({
      checkpoint: "Qwen/Qwen2.5-0.5B-Instruct",
      revision: "7ae557604adf67be50417f59c2c2f167def9a775",
      example: Object.freeze({
        text: "unbelievable!",
        ids: Object.freeze([359, 31798, 23760, 0]),
        pieces: Object.freeze(["un", "belie", "vable", "!"])
      }),
      challenge: Object.freeze({
        sentence: "The robot found an unhelpful clue.",
        targetWord: "unhelpful",
        targetIds: Object.freeze([650, 8653, 1262]),
        targetRawPieces: Object.freeze(["Ġun", "help", "ful"]),
        targetPieces: Object.freeze(["un", "help", "ful"]),
        correctOptionId: "qwen",
        options: Object.freeze([
          Object.freeze({ id: "whole", pieces: Object.freeze(["unhelpful"]) }),
          Object.freeze({ id: "human", pieces: Object.freeze(["un", "helpful"]) }),
          Object.freeze({ id: "qwen", pieces: Object.freeze(["un", "help", "ful"]) })
        ])
      })
    });
    const numbersRoomTeachingData = Object.freeze({
      token: "robot",
      tokenId: 305,
      drawers: Object.freeze([128, 305, 742]),
      illustrativeRow: Object.freeze(["0.42", "-0.18", "0.73", "0.11", "…"]),
      correctConceptId: "lookup-label",
      concepts: Object.freeze([
        Object.freeze({ id: "meaning", label: "It stores the meaning of robot." }),
        Object.freeze({ id: "lookup-label", label: "It is a lookup label that points to one learned number row." }),
        Object.freeze({ id: "probability", label: "It is the probability that robot appears." })
      ]),
      accuracyNote: "Simplified teaching row — real models use much larger learned representations."
    });
    const finalModelPieces = [
      { id: "tokens", label: "Text becomes tokens" },
      { id: "numbers", label: "Tokens point to numbers" },
      { id: "context", label: "Context keeps earlier tokens available" },
      { id: "connections", label: "Helpful tokens shape the current representation" },
      { id: "prediction", label: "Predict one next token" },
      { id: "repeat", label: "Add it to the text and repeat" }
    ];
    const finalReviewPieces = [
      { id: "examples", label: "Read a training example" },
      { id: "train-predict", label: "Predict its next token" },
      { id: "actual", label: "Reveal the actual token" },
      { id: "adjust", label: "Adjust internal parameters" },
      { id: "train-repeat", label: "Repeat across many examples" }
    ];
    const finalModelOrder = finalModelPieces.map((piece) => piece.id);
    const finalReviewOrder = finalReviewPieces.map((piece) => piece.id);

    const state = {
      completed: new Set(),
      crystals: new Set(),
      exitPlaced: new Set(),
      exitModel: [],
      exitReview: [],
      exitFeedback: "",
      finalComplete: false,
      currentScreen: "room-select",
      currentRoom: null,
      currentStep: "hub",
      selected: null,
      roomData: {},
      latestInit: null
    };
    let activeExitDrag = null;
    let lastExitPointerTarget = null;
    let suppressExitClick = false;

    const $ = (id) => document.getElementById(id);
    const mapScreen = $("mapScreen");
    const roomScreen = $("roomScreen");
    const exitScreen = $("exitScreen");
    const log = $("log");

    function write(message) {
      if (!debug) return;
      log.textContent = `${new Date().toLocaleTimeString()}  ${message}\n` + log.textContent;
    }

    function send(type, payload = {}) {
      window.parent.postMessage({ type, payload }, targetOrigin);
      write(`sent ${type}`);
    }

    function applyInit(payload = {}) {
      state.latestInit = payload;
      state.completed = new Set(payload.completedRooms || []);
      state.crystals = new Set(payload.crystals || []);
      state.finalComplete = Boolean(payload.finalExitCompleted);
      state.exitPlaced = state.finalComplete ? new Set(rooms.map((room) => room.crystal)) : new Set();
      state.exitModel = state.finalComplete ? [...finalModelOrder] : [];
      state.exitReview = state.finalComplete ? [...finalReviewOrder] : [];
      state.exitFeedback = "";
      const requestedScreen = ["room-select", "room", "final-exit"].includes(payload.currentScreen) ? payload.currentScreen : "room-select";
      const requestedRoom = roomById(payload.currentRoom)?.id || null;
      state.currentScreen = requestedScreen === "room" && requestedRoom ? "room" : requestedScreen === "final-exit" ? "final-exit" : "room-select";
      state.currentRoom = state.currentScreen === "room" ? requestedRoom : null;
      state.currentStep = typeof payload.currentStep === "string" ? payload.currentStep : state.currentScreen === "room-select" ? "hub" : "playing";
      state.roomData = state.currentRoom ? defaultRoomData(state.currentRoom) : state.roomData;
      render();
    }

    function roomById(id) {
      return rooms.find((room) => room.id === id || room.crystal === id);
    }

    function firstIncomplete() {
      return rooms.find((room) => !state.completed.has(room.id));
    }

    function isUnlocked(room) {
      if (room.number === 1) return true;
      const previous = rooms[room.number - 2];
      return state.completed.has(previous.id) || state.completed.has(room.id);
    }

    function updateTop() {
      $("topProgress").textContent = `${state.crystals.size} / ${rooms.length} crystals`;
    }

    function showScreen(name) {
      state.currentScreen = name;
      mapScreen.classList.toggle("active", name === "room-select");
      roomScreen.classList.toggle("active", name === "room");
      exitScreen.classList.toggle("active", name === "final-exit");
      if (name === "room-select") send("ESCAPE_ROOM_RETURNED_TO_HUB");
      else send("ESCAPE_ROOM_SCREEN_CHANGED", { currentScreen: name, roomId: state.currentRoom, step: "playing" });
    }

    function openMap() {
      state.currentRoom = null;
      renderMap();
      showScreen("room-select");
    }

    function continueAdventure() {
      const next = firstIncomplete();
      if (next) return openRoom(next.id, false);
      return openExit();
    }

    function nextRoomAfter(room) {
      const next = rooms[room.number];
      if (next) return openRoom(next.id, false);
      return openExit();
    }

    function openRoom(id, replay = false) {
      const room = roomById(id);
      if (!room) return;
      if (!isUnlocked(room) && !replay) {
        flashMapMessage(`Room ${room.number} is locked. Finish the previous room first.`);
        return;
      }
      state.currentRoom = room.id;
      state.currentStep = "playing";
      state.selected = null;
      state.roomData = defaultRoomData(room.id);
      renderRoom(room, replay);
      showScreen("room");
      send("ESCAPE_ROOM_ROOM_STARTED", { roomId: room.id, replay: replay || state.completed.has(room.id) });
    }

    function openExit() {
      state.currentRoom = null;
      renderExit();
      showScreen("final-exit");
    }

    function defaultRoomData(id) {
      if (id === "token") return {
        inspected: false,
        tokenised: false,
        selectedOption: "",
        submitted: false,
        attempts: 0,
        showHint: false,
        feedbackKind: "",
        feedback: ""
      };
      if (id === "numbers") return {
        selectedDrawer: "",
        drawerOpened: false,
        showConcept: false,
        selectedConcept: "",
        conceptPassed: false,
        drawerAttempts: 0,
        conceptAttempts: 0,
        feedbackKind: "",
        feedback: ""
      };
      if (id === "context") return {
        scene: 1,
        choice: "",
        solved: false,
        shifted: false,
        attempts: 0,
        feedbackKind: "",
        feedback: ""
      };
      if (id === "connections") return { selected: [], feedback: "" };
      if (id === "prediction") return { round: 0, choice: "", generated: [], feedback: "" };
      if (id === "training") return { step: 0, feedback: "" };
      return {};
    }

    function roomComplete(room) {
      const already = state.completed.has(room.id) && state.crystals.has(room.crystal);
      state.completed.add(room.id);
      state.crystals.add(room.crystal);
      state.currentScreen = "room";
      state.currentRoom = room.id;
      state.currentStep = "completion";
      renderRoom(room, false, true);
      updateTop();
      send("ESCAPE_ROOM_SCREEN_CHANGED", { currentScreen: "completion", roomId: room.id, step: "completion" });
      if (!already) {
        send("ESCAPE_ROOM_ROOM_COMPLETE", { roomId: room.id, crystal: room.crystal });
      }
    }

    function flashMapMessage(text) {
      const box = document.querySelector(".map-feedback");
      if (!box) return;
      box.textContent = text;
      box.className = "feedback bad map-feedback";
      setTimeout(() => {
        box.textContent = "Choose an unlocked room. Completed rooms can be replayed.";
        box.className = "feedback map-feedback";
      }, 2600);
    }

    function render() {
      updateTop();
      renderMap();
      if (state.currentScreen === "room" && state.currentRoom) renderRoom(roomById(state.currentRoom), false, state.currentStep === "complete" || state.currentStep === "completion");
      if (state.currentScreen === "final-exit") renderExit();
      mapScreen.classList.toggle("active", state.currentScreen === "room-select");
      roomScreen.classList.toggle("active", state.currentScreen === "room");
      exitScreen.classList.toggle("active", state.currentScreen === "final-exit");
    }

    function renderMap() {
      const completedCount = rooms.filter((room) => state.completed.has(room.id)).length;
      mapScreen.innerHTML = `
        <section class="hero">
          <div>
            <span class="clue">Final Challenge</span>
            <h1>Language Model Escape Room</h1>
            <p>Help the robot restore six crystals. Each room follows one step in how a language model processes text, predicts, and learns.</p>
            <button type="button" class="gold" data-action="continue">${completedCount ? "Continue adventure" : "Start Room 1"}</button>
          </div>
          <img class="robot" src="/assets/img/final-challenge/room1/guide-robot.png" alt="Guide robot">
        </section>
        <section class="map-grid">
          ${rooms.map((room) => {
            const done = state.completed.has(room.id);
            const unlocked = isUnlocked(room);
            return `<article class="room-card ${unlocked ? "" : "locked"} ${done ? "completed" : ""}" style="--room:${room.colour}">
              <small>Room ${room.number}</small>
              <strong>${room.title}</strong>
              <p>${room.aim}</p>
              <footer>
                <span class="crystal">${done ? "◆" : unlocked ? "◇" : "🔒"}</span>
                <button type="button" data-room="${room.id}" ${unlocked ? "" : "disabled"}>${done ? "Replay puzzle" : unlocked ? "Enter room" : "Locked"}</button>
              </footer>
            </article>`;
          }).join("")}
        </section>
        <section class="map-footer">
          <div class="inventory">
            <strong>Inventory</strong>
            ${rooms.map((room) => `<span class="${state.crystals.has(room.crystal) ? "collected" : ""}" style="--room:${room.colour}" title="${room.power}">${state.crystals.has(room.crystal) ? "◆" : room.number}</span>`).join("")}
          </div>
          <button type="button" class="success" data-action="exit" ${completedCount === rooms.length ? "" : "disabled"}>${state.finalComplete ? "Review Final Exit" : "Open Final Exit"}</button>
        </section>
        <div class="feedback map-feedback">Choose an unlocked room. Completed rooms can be replayed.</div>
      `;
      mapScreen.querySelectorAll("[data-room]").forEach((button) => button.addEventListener("click", () => openRoom(button.dataset.room, state.completed.has(button.dataset.room))));
      mapScreen.querySelector("[data-action='continue']").addEventListener("click", continueAdventure);
      mapScreen.querySelector("[data-action='exit']").addEventListener("click", openExit);
    }

    function renderRoom(room, replay = false, completedView = false) {
      const data = state.roomData;
      roomScreen.innerHTML = `
        <section class="room ${room.id === "token" ? "room-bg-token" : room.id === "numbers" ? "room-bg-numbers" : room.id === "context" ? "room-bg-context" : ""}" style="--room:${room.colour}; --tilt:0deg">
          <div class="room-inner">
            <header class="room-head">
              <div class="room-objective">
                <span>Room ${room.number} · ${replay ? "Replay mode" : "Crystal hunt"}</span>
                <h1>${room.title}</h1>
                <p>${room.aim}</p>
              </div>
              <button type="button" class="secondary" data-action="map">Room Map</button>
            </header>
      ${completedView ? completionMarkup(room) : puzzleMarkup(room, data)}
          </div>
        </section>
      `;
      bindRoomEvents(room);
    }

    function completionMarkup(room) {
      const next = rooms[room.number];
      const crystalName = `${room.power} Crystal`;
      const crystalSrc = crystalAsset(room);
      const completionNote = room.id === "token"
        ? "A Token can be a whole word, part of a word, punctuation, or another text piece. The exact split depends on the tokenizer."
        : room.id === "numbers"
          ? "The token ID is a lookup label. It points to a learned number row that the model can use in later calculations."
        : room.id === "context"
          ? "The model can use only the Tokens currently inside its Context Window. As new text arrives, older Tokens can move outside it."
        : next
          ? `Door opened. Room ${next.number} is ready.`
          : "All rooms cleared. The final exit is ready.";
      const tokenMechanism = room.id === "token" ? `<p class="token-lock-accepts">The lock accepts the text as Token pieces.</p><div class="token-success-chain" aria-label="Text passes through the tokenizer and becomes Token pieces">
        <span><small>Text</small><b>${tokenRoomTeachingData.challenge.targetWord}</b></span>
        <i aria-hidden="true">↓</i>
        <span><small>Tokenizer</small><b>Qwen2.5</b></span>
        <i aria-hidden="true">↓</i>
        <span class="token-success-pieces"><small>Token pieces</small><b>${tokenRoomTeachingData.challenge.targetPieces.map((piece) => `[${piece}]`).join(" ")}</b></span>
      </div>` : "";
      const numbersMechanism = room.id === "numbers" ? `<div class="token-success-chain" aria-label="Token robot uses ID 305 to find a learned number row">
        <span><small>Token</small><b>${numbersRoomTeachingData.token}</b></span>
        <i aria-hidden="true">→</i>
        <span><small>Lookup label</small><b>${numbersRoomTeachingData.tokenId}</b></span>
        <i aria-hidden="true">→</i>
        <span><small>Learned number row</small><b>[${numbersRoomTeachingData.illustrativeRow.join(", ")}]</b></span>
      </div><p class="numbers-accuracy-note">${numbersRoomTeachingData.accuracyNote}</p>` : "";
      return `<section class="completion">
        <div class="crystal-stage" aria-hidden="true">
          <img class="completion-crystal" src="${crystalSrc}" alt="">
        </div>
        <span class="clue">${crystalName} collected</span>
        <h2>${room.power} restored</h2>
        ${tokenMechanism}
        ${numbersMechanism}
        <p>${completionNote}</p>
        <div>
          <button type="button" class="secondary" data-action="map">Room Map</button>
          <button type="button" data-action="replay">Replay</button>
          <button type="button" class="gold" data-action="next-room">${next ? `Enter Room ${next.number}` : "Open Final Exit"}</button>
        </div>
      </section>`;
    }

    function crystalAsset(room) {
      if (room.crystal === "token") {
        return "/assets/img/final-challenge/room1/token-crystal-clean.png";
      }
      const reusedArtwork = {
        numbers: "prediction",
        context: "context",
        connections: "verification",
        prediction: "patterns",
        training: "fairness"
      };
      return `/assets/img/final-challenge/crystals/crystal-${reusedArtwork[room.crystal] || room.crystal}.png`;
    }

    function puzzleMarkup(room, data) {
      if (room.id === "token") return tokenPuzzle(data);
      if (room.id === "numbers") return numbersPuzzle(data);
      if (room.id === "context") return contextWindowPuzzle(data);
      if (room.id === "connections") return connectionsPuzzle(data);
      if (room.id === "prediction") return nextTokenPuzzle(data);
      if (room.id === "training") return trainingLoopPuzzle(data);
      return "";
    }

    function stepStrip(steps, currentIndex) {
      return `<div class="step-strip" aria-label="Room steps">${steps.map((step, index) => {
        const stateClass = index < currentIndex ? "done" : index === currentIndex ? "current" : "";
        return `<div class="step-pill ${stateClass}"><span>${index < currentIndex ? "✓" : index + 1}</span><span>${step}</span></div>`;
      }).join("")}</div>`;
    }

    function numbersIcon(name) {
      const paths = {
        lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
        brain: '<path d="M9.5 4.5A3 3 0 0 0 6.5 7v.7A3.5 3.5 0 0 0 5 14.3V16a4 4 0 0 0 4 4h1V5.5a1 1 0 0 0-.5-1Z"/><path d="M14.5 4.5a3 3 0 0 1 3 2.5v.7a3.5 3.5 0 0 1 1.5 6.6V16a4 4 0 0 1-4 4h-1V5.5a1 1 0 0 1 .5-1Z"/>',
        search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
        dice: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 8h.01M16 8h.01M8 16h.01M16 16h.01M12 12h.01"/>'
      };
      return `<svg class="numbers-lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]}</svg>`;
    }

    function contextIcon(name) {
      const paths = {
        umbrella: '<path d="M22 12a10.06 10.06 0 0 0-20 0Z"/><path d="M12 12v8a2 2 0 0 0 4 0"/><path d="M12 2v1"/>',
        cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9Z"/>',
        eye: '<path d="M2.06 12.35a1 1 0 0 1 0-.7C3.73 7.6 7.6 5 12 5c4.4 0 8.27 2.6 9.94 6.65a1 1 0 0 1 0 .7C20.27 16.4 16.4 19 12 19c-4.4 0-8.27-2.6-9.94-6.65Z"/><circle cx="12" cy="12" r="3"/>',
        arrow: '<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>'
      };

        ? "The unfair sentence has been removed."

      const simulatedOutput = balancedEnough && data.removed

      const testClass = data.tested ? (balancedEnough && data.removed ? "good" : "bad") : "";
      const defaultFeedback = balancedEnough && data.removed
        ? "Ready to test. The examples are balanced and the unfair sentence is gone."

      const people = [

      ];
      return `<div class="room-body">
