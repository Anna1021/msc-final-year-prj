<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How Language Models Work — Escape Room</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff8ff;
      --muted: #d8d0f4;
      --panel: rgba(14, 10, 32, .78);
      --line: rgba(228, 214, 255, .2);
      --purple: #9b6cff;
      --gold: #ffd15a;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      background: #070917;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      color: #fff;
      background: linear-gradient(135deg, #775cff, #5037ed);
      box-shadow: 0 12px 24px rgba(38, 20, 120, .22);
      font-weight: 950;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }
    button:disabled {
      opacity: .62;
      cursor: not-allowed;
      filter: grayscale(.35);
      box-shadow: none;
      color: #b9c2d8;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(230,220,255,.15);
    }
    button.secondary { background: rgba(255,255,255,.08); border: 1px solid var(--line); box-shadow: none; }
    button.gold { color: #281c05; background: linear-gradient(135deg, #ffe08a, #ffbf34); }
    button.success { color: #072917; background: linear-gradient(135deg, #7cf4b2, #25b866); }
    button.success:disabled { color: #9ca7bf; background: rgba(255,255,255,.08); }
    button.danger { background: linear-gradient(135deg, #ff7587, #e64058); }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background:
        radial-gradient(circle at 20% 8%, rgba(155,108,255,.28), transparent 24%),
        radial-gradient(circle at 82% 78%, rgba(255,193,63,.2), transparent 24%),
        linear-gradient(135deg, #0a0d20, #17102d 48%, #07101f);
    }

    .topbar {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(230,220,255,.14);
      background: rgba(7, 9, 23, .72);
      backdrop-filter: blur(14px);
    }

    body.embedded .topbar { display: none; }
    body.embedded .screen {
      min-height: calc(100vh - 16px);
      max-width: min(2100px, calc(100vw - 12px));
    }
    body.embedded .room,
    body.embedded .room-inner,
    body.embedded .exit { min-height: calc(100vh - 16px); }
    body.embedded .stage { padding: 8px; }
    body.embedded .hero {
      min-height: 270px;
      padding: 28px 36px;
      grid-template-columns: minmax(0, 1fr) 230px;
    }
    body.embedded .hero h1 { font-size: clamp(2rem, 4vw, 3.5rem); }
    body.embedded .hero p { max-width: 640px; }
    body.embedded .hero .robot { width: 210px; }
    body.embedded .map-grid { margin-top: 12px; }
    body.embedded .room-card { min-height: 156px; padding: 17px; }

    .brand span {
      display: block;
      color: #b7a6ff;
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 950;
    }

    .brand strong { font-size: 1.1rem; }
    .top-actions { display: flex; align-items: center; justify-content: flex-end; gap: 9px; flex-wrap: wrap; }
    .pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 9px 12px; color: #f5f0ff; background: rgba(255,255,255,.1); border: 1px solid rgba(230,220,255,.18); font-weight: 950; }

    .stage {
      min-height: 0;
      position: relative;
      overflow: auto;
      padding: 18px;
    }

    .screen {
      min-height: calc(100vh - 104px);
      display: none;
      max-width: min(1500px, calc(100vw - 36px));
      margin: 0 auto;
    }

    .screen.active { display: block; }

    .hero {
      min-height: 360px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 360px);
      gap: 24px;
      align-items: center;
      padding: clamp(24px, 4vw, 52px);
      border: 1px solid rgba(224,212,255,.18);
      border-radius: 28px;
      background:
        radial-gradient(circle at 80% 24%, rgba(155,108,255,.4), transparent 26%),
        linear-gradient(135deg, rgba(21, 14, 48, .9), rgba(10, 11, 30, .92)),
        url('/assets/img/final-challenge/room1/room-bg.png') center / cover;
      box-shadow: inset 0 0 120px rgba(0,0,0,.28), 0 24px 70px rgba(0,0,0,.22);
    }

    .hero h1, .room h1, .exit h1 { margin: 8px 0 12px; font-size: clamp(2.3rem, 5vw, 5rem); line-height: .95; }
    .hero p, .room p, .exit p { color: var(--muted); font-weight: 780; line-height: 1.5; font-size: 1rem; }
    .robot { width: min(280px, 100%); filter: drop-shadow(0 24px 40px rgba(0,0,0,.35)); animation: float 3.4s ease-in-out infinite; justify-self: center; }

    .map-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .room-card {
      min-height: 186px;
      position: relative;
      overflow: hidden;
      display: grid;
      align-content: space-between;
      gap: 12px;
      padding: 20px;
      border: 1px solid color-mix(in srgb, var(--room) 42%, rgba(255,255,255,.2));
      border-radius: 22px;
      text-align: left;
      color: #fff;
      background:
        radial-gradient(circle at 82% 18%, color-mix(in srgb, var(--room) 36%, transparent), transparent 26%),
        linear-gradient(135deg, rgba(13, 12, 33, .94), rgba(8, 11, 26, .92));
      box-shadow: inset 0 0 80px rgba(0,0,0,.25), 0 18px 38px rgba(0,0,0,.16);
    }

    .room-card::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .16;
      background:
        linear-gradient(transparent 0 38px, rgba(255,255,255,.12) 39px 41px, transparent 42px),
        linear-gradient(90deg, transparent 0 78px, rgba(255,255,255,.1) 79px 81px, transparent 82px);
      pointer-events: none;
    }

    .room-card > * { position: relative; z-index: 1; }
    .room-card small { color: color-mix(in srgb, var(--room) 44%, #fff); font-weight: 950; letter-spacing: .08em; text-transform: uppercase; }
    .room-card strong { font-size: 1.5rem; text-transform: uppercase; }
    .room-card p { margin: 0; color: #e9e3ff; font-weight: 760; }
    .room-card footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .crystal { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 15px; color: var(--room); background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); filter: drop-shadow(0 0 16px color-mix(in srgb, var(--room) 64%, transparent)); font-size: 1.7rem; }
    .room-card.locked { opacity: .58; }
    .room-card.locked button { background: rgba(255,255,255,.08); color: #d8d0f4; }
    .room-card.completed::after {
      content: "Crystal collected";
      position: absolute;
      right: 14px;
      top: 14px;
      z-index: 2;
      padding: 6px 9px;
      border-radius: 999px;
      color: #0b2418;
      background: #9ff3c4;
      font-size: .72rem;
      font-weight: 950;
    }

    .map-footer {
      margin-top: 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 15px 18px;
      border: 1px solid rgba(226,214,255,.18);
      border-radius: 20px;
      background: rgba(10, 10, 28, .66);
    }

    .inventory {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-weight: 950;
    }

    .inventory span {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 12px;
      color: rgba(255,255,255,.35);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
    }

    .inventory span.collected { color: var(--room); box-shadow: 0 0 18px color-mix(in srgb, var(--room) 56%, transparent); }

    .room {
      min-height: calc(100vh - 104px);
      border: 1px solid rgba(224,212,255,.18);
      border-radius: 28px;
      overflow: hidden;
      background:
        radial-gradient(circle at 78% 24%, color-mix(in srgb, var(--room) 32%, transparent), transparent 25%),
        linear-gradient(135deg, #101328, #090b1b);
      box-shadow: inset 0 0 120px rgba(0,0,0,.28), 0 24px 70px rgba(0,0,0,.22);
    }

    .room-bg-token {
      background:
        linear-gradient(90deg, rgba(4,5,15,.18), rgba(4,5,15,.06) 50%, rgba(4,5,15,.34)),
        url('/assets/img/final-challenge/room1/room-bg.png') center / cover;
    }

    .room-inner {
      min-height: calc(100vh - 104px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 16px;
      padding: clamp(18px, 3vw, 34px);
      background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.2));
    }

    .room-head { display: flex; justify-content: space-between; gap: 16px; align-items: start; }
    .room-head span { color: color-mix(in srgb, var(--room) 48%, #fff); font-weight: 950; text-transform: uppercase; letter-spacing: .08em; }
    .room-head h1 { font-size: clamp(2rem, 4vw, 4.2rem); }
    .room-objective { max-width: 620px; }

    .room-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 370px);
      gap: 18px;
      align-items: stretch;
    }

    .puzzle-board, .guide-panel {
      border: 1px solid rgba(232,222,255,.18);
      border-radius: 22px;
      padding: 18px;
      background: rgba(8, 9, 25, .68);
      box-shadow: inset 0 0 50px rgba(0,0,0,.18);
    }

    .puzzle-board { display: grid; align-content: start; gap: 14px; }
    .guide-panel { display: grid; align-content: start; gap: 12px; }
    .guide-panel img { width: 104px; justify-self: center; filter: drop-shadow(0 18px 24px rgba(0,0,0,.3)); animation: float 3.4s ease-in-out infinite; }
    .guide-panel h2 { margin: 0; }
    .guide-panel p { margin: 0; }

    .step-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 2px;
    }

    .step-pill {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      min-height: 48px;
      padding: 8px 10px;
      border-radius: 14px;
      color: rgba(255,255,255,.66);
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(230,220,255,.13);
      font-weight: 900;
    }

    .step-pill span:first-child {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: #fff;
      background: rgba(255,255,255,.12);
      font-size: .82rem;
    }

    .step-pill.current {
      color: #fff;
      border-color: color-mix(in srgb, var(--room) 58%, rgba(255,255,255,.2));
      background: color-mix(in srgb, var(--room) 22%, rgba(255,255,255,.08));
    }

    .step-pill.done {
      color: #d9ffe9;
      border-color: rgba(124,244,178,.3);
      background: rgba(32,155,93,.16);
    }

    .step-pill.done span:first-child {
      color: #072917;
      background: #7cf4b2;
    }

    .clue {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border-radius: 999px;
      color: #fff;
      background: color-mix(in srgb, var(--room) 28%, rgba(255,255,255,.08));
      border: 1px solid color-mix(in srgb, var(--room) 40%, rgba(255,255,255,.18));
      font-weight: 950;
    }

    .door-zone {
      min-height: 230px;
      display: grid;
      place-items: center;
      gap: 10px;
      text-align: center;
    }

    .tokeniser-device {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 16px;
      align-items: center;
      margin: 14px 0;
      padding: 14px;
      border-radius: 18px;
      background: rgba(0,0,0,.3);
      border: 1px solid rgba(180,210,255,.22);
    }

    .tokeniser-device img { width: 110px; }
    .output-tokens, .slot-row, .choice-grid, .chip-grid { display: flex; flex-wrap: wrap; gap: 10px; }

    .token {
      min-width: 72px;
      min-height: 46px;
      display: grid;
      place-items: center;
      padding: 8px 12px;
      border-radius: 15px;
      color: #32200e;
      background: #dec68e;
      border: 2px solid rgba(95,59,24,.22);
      font-weight: 950;
      font-size: 1.12rem;
      box-shadow: 0 10px 20px rgba(0,0,0,.18);
    }

    .token.selected { outline: 4px solid #ffe56a; transform: translateY(-4px); }
    .token.example-token { min-width: 62px; background: #eadcff; color: #241747; }
    .token.used { opacity: .45; }
    .token[draggable="true"] { cursor: grab; }
    .token[draggable="true"]:active { cursor: grabbing; }
    .slot[draggable="true"] { cursor: grab; }
    .slot[draggable="true"]:active { cursor: grabbing; }
    .token.dragging {
      opacity: .72;
      transform: translateY(-6px) scale(1.03);
      outline: 4px solid rgba(255,229,106,.75);
    }
    .slot.dragging {
      opacity: .72;
      transform: translateY(-5px) scale(1.03);
      border-color: #ffe56a;
      box-shadow: 0 0 0 5px rgba(255,229,106,.12), 0 0 24px rgba(255,229,106,.22);
    }
    .slot {
      width: 76px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: #fff;
      background: rgba(0,0,0,.24);
      border: 2px dashed rgba(230,220,255,.32);
      font-weight: 950;
    }
    .slot.filled { border-style: solid; border-color: color-mix(in srgb, var(--room) 55%, #fff); background: rgba(255,255,255,.14); }
    .slot.drag-over {
      border-style: solid;
      border-color: #ffe56a;
      background: rgba(255,229,106,.16);
      box-shadow: 0 0 0 5px rgba(255,229,106,.12), 0 0 24px rgba(255,229,106,.22);
    }
    .slot.error { border-color: #ff7083; animation: shake .25s ease; }

    .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .choice-grid button, .chip-grid button {
      min-height: 54px;
      color: #f8f4ff;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(230,220,255,.18);
      box-shadow: none;
      text-align: left;
    }
    .choice-grid button.selected, .chip-grid button.selected {
      border-color: color-mix(in srgb, var(--room) 62%, #fff);
      background: color-mix(in srgb, var(--room) 24%, rgba(255,255,255,.1));
    }

    .meter {
      height: 18px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.15);
    }
    .meter span { display: block; height: 100%; width: var(--value); background: linear-gradient(90deg, var(--room), #7cf4b2); }

    .scale {
      min-height: 180px;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .beam {
      width: min(520px, 90%);
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #70a9ff, #ffa726);
      transform: rotate(var(--tilt));
      transition: transform .25s ease;
      box-shadow: 0 0 22px color-mix(in srgb, var(--room) 48%, transparent);
    }
    input[type="range"] { width: 100%; accent-color: var(--room); }

    .fairness-lab {
      display: grid;
      gap: 14px;
    }

    .fairness-data-row {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(250px, .9fr);
      gap: 14px;
      align-items: stretch;
    }

    .data-window, .prediction-window, .data-cleaner {
      border: 1px solid rgba(230,220,255,.16);
      border-radius: 18px;
      padding: 14px;
      background: rgba(255,255,255,.07);
    }

    .data-window h3, .prediction-window h3, .data-cleaner h3 {
      margin: 0 0 9px;
      font-size: 1rem;
    }

    .people-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 8px 0 12px;
    }

    .person-dot {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: #07101f;
      font-size: 1.05rem;
      font-weight: 950;
      box-shadow: 0 6px 14px rgba(0,0,0,.18);
    }

    .person-dot.male { background: linear-gradient(135deg, #8fc5ff, #2f83ff); }
    .person-dot.female { background: linear-gradient(135deg, #ffd68a, #ff9f2f); }

    .bias-sample {
      display: grid;
      gap: 5px;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      color: #ffe2e7;
      background: rgba(170,37,58,.22);
      border: 1px solid rgba(255,112,131,.35);
      font-weight: 850;
    }

    .bias-sample.removed {
      color: #d7ffe8;
      background: rgba(32,155,93,.18);
      border-color: rgba(124,244,178,.34);
      text-decoration: none;
    }

    .fairness-checklist {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .fairness-check {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 8px 10px;
      border-radius: 999px;
      color: #efe9ff;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(230,220,255,.16);
      font-weight: 900;
    }

    .fairness-check.done {
      color: #d7ffe8;
      border-color: rgba(124,244,178,.38);
      background: rgba(32,155,93,.18);
    }

    .data-examples {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .data-example {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 9px;
      align-items: center;
      padding: 9px 10px;
      border-radius: 13px;
      color: #f9f5ff;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(230,220,255,.15);
      font-weight: 850;
    }

    .data-example.warning {
      color: #ffe2e7;
      background: rgba(170,37,58,.2);
      border-color: rgba(255,112,131,.34);
    }

    .data-example.cleaned {
      color: #d7ffe8;
      background: rgba(32,155,93,.18);
      border-color: rgba(124,244,178,.34);
      text-decoration: line-through;
      opacity: .84;
    }

    .fairness-cause {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .fairness-cause span {
      display: grid;
      gap: 4px;
      align-content: start;
      min-height: 78px;
      padding: 10px;
      border-radius: 14px;
      color: #f9f5ff;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.13);
      font-weight: 850;
    }

    .fairness-cause b { color: #fff; }

    .prediction-big {
      display: grid;
      gap: 8px;
      padding: 14px;
      border-radius: 16px;
      background: rgba(0,0,0,.28);
      border: 1px solid rgba(255,255,255,.14);
    }

    .prediction-big strong {
      font-size: clamp(1.6rem, 4vw, 3rem);
      color: #fff;
      line-height: 1;
    }

    .prediction-bars {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .prediction-bar {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) 48px;
      gap: 8px;
      align-items: center;
      color: #f9f5ff;
      font-weight: 900;
    }

    .prediction-bar span:nth-child(2) {
      height: 14px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,.13);
    }

    .prediction-bar i {
      display: block;
      height: 100%;
      width: var(--value);
      border-radius: inherit;
      background: linear-gradient(90deg, var(--bar), #fff2b0);
      transition: width .24s ease;
    }

    .fix-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .remove-card {
      width: 100%;
      display: grid;
      gap: 4px;
      min-height: 72px;
      text-align: left;
      color: #fff;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(230,220,255,.18);
      box-shadow: none;
    }

    .remove-card.selected {
      color: #d7ffe8;
      border-color: rgba(124,244,178,.45);
      background: rgba(32,155,93,.2);
    }

    .remove-card:not(.selected)::before,
    .remove-card.selected::before {
      content: "";
      display: block;
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff5770, #ffbd3d);
      opacity: .85;
    }

    .remove-card.selected::before {
      background: linear-gradient(90deg, #38c985, #7cf4b2);
    }

    .test-output {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      padding: 12px;
      border-radius: 16px;
      color: #f8f4ff;
      background: rgba(155,108,255,.12);
      border: 1px solid rgba(155,108,255,.28);
      font-weight: 850;
    }

    .test-output b { color: #fff; }

    .test-output.good {
      color: #d7ffe8;
      background: rgba(32,155,93,.18);
      border-color: rgba(124,244,178,.36);
    }

    .test-output.bad {

      border-color: rgba(255,112,131,.36);

    .room-foot {

    .completion {

      gap: 14px;

    .crystal-stage {

      width: clamp(132px, 16vw, 190px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      isolation: isolate;

    .crystal-stage::before {
      content: "";
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.78), color-mix(in srgb, var(--room) 46%, transparent) 32%, transparent 70%);

      opacity: .9;
      animation: crystalBurst .8s ease-out both, crystalAura 2.2s ease-in-out .8s infinite;
      z-index: -2;
    }
    .crystal-stage::after {
      content: "";
      position: absolute;
      inset: -8%;
      background:
        radial-gradient(circle at 18% 28%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 78% 20%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 86% 68%, color-mix(in srgb, var(--room) 72%, #fff) 0 3px, transparent 4px),

      z-index: -1;

    .completion-crystal {

        saturate(1.08)
        drop-shadow(0 0 16px #fff)

    .completion .clue { animation: collectedPop .42s ease .16s both; }
    .completion h2,
    .completion p,
    .completion div { animation: softReveal .46s ease .34s both; }

    .exit {

      gap: 18px;
      border: 1px solid rgba(224,212,255,.18);
      border-radius: 28px;

        radial-gradient(circle at 50% 36%, rgba(124,244,178,.18), transparent 30%),

      place-items: center;

    .brain-slot:nth-child(3) { top: 120px; right: 34px; }
    .brain-slot:nth-child(4) { bottom: 72px; right: 72px; }

    .crystal-tray {

      padding: 8px;

    .sequence-slot, .sequence-piece {
      width: 100%;
      min-height: 46px;
      border-radius: 14px;
      padding: 8px 10px;
      border: 1px dashed rgba(230,220,255,.28);
      background: rgba(12,10,32,.54);
      color: rgba(245,240,255,.82);

      box-shadow: none;

    }

      border-style: solid;
      border-color: rgba(124,244,178,.6);
      background: rgba(124,244,178,.12);
      color: #fff;
    }
    .sequence-slot small, .sequence-piece small {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(155,108,255,.24);
      color: #fff;
      font-weight: 950;
    }
    .sequence-piece {
      border-style: solid;
      border-color: rgba(155,108,255,.42);
      background: rgba(155,108,255,.18);
      cursor: pointer;
    }
    .sequence-piece:hover, .sequence-slot.filled:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.54);
    }
    .sequence-piece:not(:disabled),
    .sequence-slot.filled:not(:disabled) {
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: element;
    }
    .sequence-piece:not(:disabled):active,
    .sequence-slot.filled:not(:disabled):active {
      cursor: grabbing;
    }
    .sequence-piece.dragging, .sequence-slot.dragging {
      opacity: .74;
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(255,229,106,.82);
      box-shadow: 0 0 0 4px rgba(255,229,106,.12);
    }
    .sequence-drag-ghost {

      top: 0;

      border: 2px solid rgba(255,229,106,.88);
      border-radius: 16px;
      background: rgba(37,28,75,.96);

      box-shadow: 0 16px 38px rgba(0,0,0,.38), 0 0 28px rgba(255,229,106,.18);
    }
    .sequence-slot.drop-ready {
      border-style: solid;
      border-color: #ffe56a;
      background: rgba(255,229,106,.13);
      box-shadow: 0 0 0 4px rgba(255,229,106,.09), 0 0 22px rgba(255,229,106,.16);
    }
    .sequence-slot.drop-error {
      border-style: solid;
      border-color: rgba(255,90,118,.8);
      background: rgba(255,90,118,.16);
    }
    .sequence-piece:disabled {
      opacity: .42;
      cursor: default;
    }
    .exit-guide {
      margin: 14px 0 0;
      padding: 12px 14px;
      border: 1px solid rgba(124,244,178,.28);
      border-radius: 16px;
      color: #eafff2;
      background: rgba(124,244,178,.12);
      font-weight: 900;
      line-height: 1.35;
    }
    .exit-guide.complete {
      color: #15331f;
      background: #7cf4b2;
      border-color: rgba(124,244,178,.7);
    }
    .exit-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      align-items: center;
      margin-top: 14px;
    }
    .exit-actions .gold {
      color: #271a02;
      background: linear-gradient(135deg, #ffe07a, #ffbd38);
      border-color: rgba(255,224,122,.7);
    }
    .exit-actions .ghost-reset {
      color: #fff;
      border-color: rgba(255,255,255,.28);
      background: rgba(255,255,255,.08);
    }
    @media (max-width: 900px) {
      .brain-puzzle { grid-template-columns: 1fr; }
    }
    @media (min-width: 1500px) {
      .screen {
        max-width: min(1880px, calc(100vw - 44px));
      }

      }

        max-width: min(2140px, calc(100vw - 16px));

      }

      }

        min-width: 146px;
      }
    }

        grid-template-columns: minmax(740px, 1.05fr) minmax(880px, 1.2fr);
      }

      }
      .brain-slot {
        width: 86px;
        height: 86px;
      }

        width: 68px;
        height: 68px;
      }
    }

    .debug-banner { position: fixed; left: 16px; top: 16px; z-index: 30; padding: 8px 12px; border-radius: 999px; color: #241747; background: #ffe58f; font-weight: 950; box-shadow: 0 10px 24px rgba(0,0,0,.25); }
    .debug-toggle { position: fixed; right: 16px; bottom: 16px; z-index: 40; }
    .debug-console { position: fixed; right: 16px; bottom: 66px; z-index: 39; width: min(360px, calc(100vw - 32px)); max-height: 220px; overflow-y: auto; border: 1px solid rgba(220,206,255,.25); border-radius: 16px; padding: 12px; background: rgba(10, 8, 28, .9); box-shadow: 0 18px 45px rgba(0,0,0,.3); display: none; }

    .debug-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .debug-controls button { padding: 9px 10px; font-size: .78rem; }
    .log { white-space: pre-wrap; color: #dcd4ff; font-weight: 700; font-size: .78rem; line-height: 1.4; text-align: left; }

    .journey-strip, .training-demo { display:grid; grid-template-columns:minmax(140px,1fr) auto minmax(140px,1fr) auto minmax(210px,1.35fr); gap:12px; align-items:center; margin:18px 0; }
    .journey-strip button, .training-demo>div { display:grid; gap:7px; min-height:108px; align-content:center; border:1px solid rgba(114,91,203,.3); border-bottom:5px solid rgba(78,61,156,.55); border-radius:18px; padding:16px; color:#201846; background:rgba(255,255,255,.9); text-align:center; }
    .journey-strip button.selected { color:#fff; background:linear-gradient(135deg,#7256d8,#458ed9); }

    .simulation-note { border-radius:14px; padding:12px 14px; color:#45516d; background:rgba(255,255,255,.72); }
    .context-story { display:grid; gap:10px; margin:18px 0; }

    .context-story .outside { border:2px dashed #aeb7c8; border-radius:16px; padding:14px 18px; color:#78849b; background:rgba(238,241,247,.74); opacity:.67; }
    .context-story .inside { border:3px solid var(--room); border-radius:18px; padding:15px 18px; background:rgba(232,252,249,.86); box-shadow:0 8px 0 rgba(39,145,150,.2); }
    .context-story small { display:block; margin-bottom:7px; font-weight:950; text-transform:uppercase; letter-spacing:.05em; }
    .training-demo { grid-template-columns:1fr auto 1fr auto 1fr; }
    @media (max-width:760px) { .journey-strip,.training-demo { grid-template-columns:1fr; }.journey-strip>span,.training-demo>span { transform:rotate(90deg); text-align:center; } }

    @keyframes float { 50% { transform: translateY(-8px); } }
    @keyframes crystalRise {
      from { opacity: 0; transform: translateY(18px) scale(.72); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes crystalBurst {
      from { opacity: 0; transform: scale(.38); }
      to { opacity: .9; transform: scale(1); }
    }
    @keyframes crystalAura { 50% { opacity: .58; transform: scale(1.08); } }
    @keyframes crystalSparkle { 50% { opacity: .42; transform: rotate(6deg) scale(1.04); } }
    @keyframes collectedPop {
      from { opacity: 0; transform: translateY(6px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }

      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

      body { overflow: auto; }

      .map-grid { grid-template-columns: 1fr; }
      .screen, .room, .room-inner, .exit { min-height: auto; }

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span>Final learning challenge</span><strong>Language Model Escape Room</strong></div>
      <div class="top-actions">
        <button class="secondary" type="button" id="topMap">Room Map</button>
        <button type="button" id="topContinue">Continue</button>
        <span class="pill" id="topProgress">0 / 6 crystals</span>
      </div>
    </header>

    <main class="stage">
      <section class="screen active" id="mapScreen"></section>
      <section class="screen" id="roomScreen"></section>
      <section class="screen" id="exitScreen"></section>
    </main>
  </div>

  <div class="debug-banner" id="debugBanner" hidden>HTML5 prototype runtime — replace with Construct export later.</div>
  <button class="debug-toggle secondary" type="button" id="debugToggle" hidden>Developer log</button>
  <aside class="debug-console" id="debugConsole" aria-label="Developer bridge console" hidden>
    <div class="debug-controls" id="debugControls"></div>
    <div class="log" id="log">Debug console ready.</div>
  </aside>

  <script>
    const searchParams = new URLSearchParams(window.location.search);
    const debug = searchParams.get("debug") === "1";
    if (window.parent !== window) document.body.classList.add("embedded");
    const targetOrigin = window.location.origin;
    const rooms = [
      { id: "token", number: 1, title: "Token Workshop", power: "Tokens", crystal: "token", colour: "#9b6cff", aim: "Rebuild a sentence from the text pieces a model can process." },
      { id: "numbers", number: 2, title: "Number Lookup", power: "Numbers", crystal: "numbers", colour: "#3a8bff", aim: "Follow a token ID to one learned row of numbers." },
      { id: "context", number: 3, title: "Context Window", power: "Context", crystal: "context", colour: "#38c4c9", aim: "See which earlier tokens are available right now." },
      { id: "connections", number: 4, title: "Connection Lab", power: "Connections", crystal: "connections", colour: "#ff9d3d", aim: "Find the visible tokens that provide the most helpful clues." },
      { id: "prediction", number: 5, title: "Next-Token Machine", power: "Prediction", crystal: "prediction", colour: "#ff5f9e", aim: "Choose one possible next token, add it, and predict again." },
      { id: "training", number: 6, title: "Training Workshop", power: "Training", crystal: "training", colour: "#46b86f", aim: "Follow prediction, answer, adjustment and repetition during training." }
    ];
    const finalModelPieces = [
      { id: "tokens", label: "Text becomes tokens" },
      { id: "numbers", label: "Tokens point to numbers" },
      { id: "context", label: "Context keeps earlier tokens available" },
      { id: "connections", label: "Helpful tokens shape the current representation" },
      { id: "prediction", label: "Predict one next token" },
      { id: "repeat", label: "Add it to the text and repeat" }
    ];
    const finalReviewPieces = [
      { id: "examples", label: "Read a training example" },
      { id: "train-predict", label: "Predict its next token" },
      { id: "actual", label: "Reveal the actual token" },
      { id: "adjust", label: "Adjust internal parameters" },
      { id: "train-repeat", label: "Repeat across many examples" }
    ];
    const finalModelOrder = finalModelPieces.map((piece) => piece.id);
    const finalReviewOrder = finalReviewPieces.map((piece) => piece.id);

    const state = {
      completed: new Set(),
      crystals: new Set(),
      exitPlaced: new Set(),
      exitModel: [],
      exitReview: [],
      exitFeedback: "",
      finalComplete: false,
      currentScreen: "room-select",
      currentRoom: null,
      currentStep: "hub",
      selected: null,
      roomData: {},
      latestInit: null
    };
    let activeExitDrag = null;
    let lastExitPointerTarget = null;
    let suppressExitClick = false;

    const $ = (id) => document.getElementById(id);
    const mapScreen = $("mapScreen");
    const roomScreen = $("roomScreen");
    const exitScreen = $("exitScreen");
    const log = $("log");

    function write(message) {
      if (!debug) return;
      log.textContent = `${new Date().toLocaleTimeString()}  ${message}\n` + log.textContent;
    }

    function send(type, payload = {}) {
      window.parent.postMessage({ type, payload }, targetOrigin);
      write(`sent ${type}`);
    }

    function applyInit(payload = {}) {
      state.latestInit = payload;
      state.completed = new Set(payload.completedRooms || []);
      state.crystals = new Set(payload.crystals || []);
      state.finalComplete = Boolean(payload.finalExitCompleted);
      state.exitPlaced = state.finalComplete ? new Set(rooms.map((room) => room.crystal)) : new Set();
      state.exitModel = state.finalComplete ? [...finalModelOrder] : [];
      state.exitReview = state.finalComplete ? [...finalReviewOrder] : [];
      state.exitFeedback = "";
      const requestedScreen = ["room-select", "room", "final-exit"].includes(payload.currentScreen) ? payload.currentScreen : "room-select";
      const requestedRoom = roomById(payload.currentRoom)?.id || null;
      state.currentScreen = requestedScreen === "room" && requestedRoom ? "room" : requestedScreen === "final-exit" ? "final-exit" : "room-select";
      state.currentRoom = state.currentScreen === "room" ? requestedRoom : null;
      state.currentStep = typeof payload.currentStep === "string" ? payload.currentStep : state.currentScreen === "room-select" ? "hub" : "playing";
      state.roomData = state.currentRoom ? defaultRoomData(state.currentRoom) : state.roomData;
      render();
    }

    function roomById(id) {
      return rooms.find((room) => room.id === id || room.crystal === id);
    }

    function firstIncomplete() {
      return rooms.find((room) => !state.completed.has(room.id));
    }

    function isUnlocked(room) {
      if (room.number === 1) return true;
      const previous = rooms[room.number - 2];
      return state.completed.has(previous.id) || state.completed.has(room.id);
    }

    function updateTop() {
      $("topProgress").textContent = `${state.crystals.size} / ${rooms.length} crystals`;
    }

    function showScreen(name) {
      state.currentScreen = name;
      mapScreen.classList.toggle("active", name === "room-select");
      roomScreen.classList.toggle("active", name === "room");
      exitScreen.classList.toggle("active", name === "final-exit");
      if (name === "room-select") send("ESCAPE_ROOM_RETURNED_TO_HUB");
      else send("ESCAPE_ROOM_SCREEN_CHANGED", { currentScreen: name, roomId: state.currentRoom, step: "playing" });
    }

    function openMap() {
      state.currentRoom = null;
      renderMap();
      showScreen("room-select");
    }

    function continueAdventure() {
      const next = firstIncomplete();
      if (next) return openRoom(next.id, false);
      return openExit();
    }

    function nextRoomAfter(room) {
      const next = rooms[room.number];
      if (next) return openRoom(next.id, false);
      return openExit();
    }

    function openRoom(id, replay = false) {
      const room = roomById(id);
      if (!room) return;
      if (!isUnlocked(room) && !replay) {
        flashMapMessage(`Room ${room.number} is locked. Finish the previous room first.`);
        return;
      }
      state.currentRoom = room.id;
      state.currentStep = "playing";
      state.selected = null;
      state.roomData = defaultRoomData(room.id);
      renderRoom(room, replay);
      showScreen("room");
      send("ESCAPE_ROOM_ROOM_STARTED", { roomId: room.id, replay: replay || state.completed.has(room.id) });
    }

    function openExit() {
      state.currentRoom = null;
      renderExit();
      showScreen("final-exit");
    }

    function defaultRoomData(id) {
      if (id === "token") return {
        inspected: false,
        tokenised: false,
        sentence: "Robots learn surprisingly fast.",
        answer: ["Robots", "learn", "surprisingly", "fast", "."],
        placed: [],
        tray: ["surprisingly", "Robots", ".", "learn", "answers", "fast"],
        selected: null,
        feedback: ""
      };
      if (id === "numbers") return { step: 0, feedback: "" };
      if (id === "context") return { choice: "", feedback: "" };
      if (id === "connections") return { selected: [], feedback: "" };
      if (id === "prediction") return { round: 0, choice: "", generated: [], feedback: "" };
      if (id === "training") return { step: 0, feedback: "" };
      return {};
    }

    function roomComplete(room) {
      const already = state.completed.has(room.id) && state.crystals.has(room.crystal);
      state.completed.add(room.id);
      state.crystals.add(room.crystal);
      state.currentScreen = "room";
      state.currentRoom = room.id;
      state.currentStep = "completion";
      renderRoom(room, false, true);
      updateTop();
      send("ESCAPE_ROOM_SCREEN_CHANGED", { currentScreen: "completion", roomId: room.id, step: "completion" });
      if (!already) {
        send("ESCAPE_ROOM_ROOM_COMPLETE", { roomId: room.id, crystal: room.crystal });
      }
    }

    function flashMapMessage(text) {
      const box = document.querySelector(".map-feedback");
      if (!box) return;
      box.textContent = text;
      box.className = "feedback bad map-feedback";
      setTimeout(() => {
        box.textContent = "Choose an unlocked room. Completed rooms can be replayed.";
        box.className = "feedback map-feedback";
      }, 2600);
    }

    function render() {
      updateTop();
      renderMap();
      if (state.currentScreen === "room" && state.currentRoom) renderRoom(roomById(state.currentRoom), false, state.currentStep === "complete" || state.currentStep === "completion");
      if (state.currentScreen === "final-exit") renderExit();
      mapScreen.classList.toggle("active", state.currentScreen === "room-select");
      roomScreen.classList.toggle("active", state.currentScreen === "room");
      exitScreen.classList.toggle("active", state.currentScreen === "final-exit");
    }

    function renderMap() {
      const completedCount = rooms.filter((room) => state.completed.has(room.id)).length;
      mapScreen.innerHTML = `
        <section class="hero">
          <div>
            <span class="clue">Final Challenge</span>
            <h1>Language Model Escape Room</h1>
            <p>Help the robot restore six crystals. Each room follows one step in how a language model processes text, predicts, and learns.</p>
            <button type="button" class="gold" data-action="continue">${completedCount ? "Continue adventure" : "Start Room 1"}</button>
          </div>
          <img class="robot" src="/assets/img/final-challenge/room1/guide-robot.png" alt="Guide robot">
        </section>
        <section class="map-grid">
          ${rooms.map((room) => {
            const done = state.completed.has(room.id);
            const unlocked = isUnlocked(room);
            return `<article class="room-card ${unlocked ? "" : "locked"} ${done ? "completed" : ""}" style="--room:${room.colour}">
              <small>Room ${room.number}</small>
              <strong>${room.title}</strong>
              <p>${room.aim}</p>
              <footer>
                <span class="crystal">${done ? "◆" : unlocked ? "◇" : "🔒"}</span>
                <button type="button" data-room="${room.id}" ${unlocked ? "" : "disabled"}>${done ? "Replay puzzle" : unlocked ? "Enter room" : "Locked"}</button>
              </footer>
            </article>`;
          }).join("")}
        </section>
        <section class="map-footer">
          <div class="inventory">
            <strong>Inventory</strong>
            ${rooms.map((room) => `<span class="${state.crystals.has(room.crystal) ? "collected" : ""}" style="--room:${room.colour}" title="${room.power}">${state.crystals.has(room.crystal) ? "◆" : room.number}</span>`).join("")}
          </div>
          <button type="button" class="success" data-action="exit" ${completedCount === rooms.length ? "" : "disabled"}>${state.finalComplete ? "Review Final Exit" : "Open Final Exit"}</button>
        </section>
        <div class="feedback map-feedback">Choose an unlocked room. Completed rooms can be replayed.</div>
      `;
      mapScreen.querySelectorAll("[data-room]").forEach((button) => button.addEventListener("click", () => openRoom(button.dataset.room, state.completed.has(button.dataset.room))));
      mapScreen.querySelector("[data-action='continue']").addEventListener("click", continueAdventure);
      mapScreen.querySelector("[data-action='exit']").addEventListener("click", openExit);
    }

    function renderRoom(room, replay = false, completedView = false) {
      const data = state.roomData;
      roomScreen.innerHTML = `
        <section class="room ${room.id === "token" ? "room-bg-token" : ""}" style="--room:${room.colour}; --tilt:0deg">
          <div class="room-inner">
            <header class="room-head">
              <div class="room-objective">
                <span>Room ${room.number} · ${replay ? "Replay mode" : "Crystal hunt"}</span>
                <h1>${room.title}</h1>
                <p>${room.aim}</p>
              </div>
              <button type="button" class="secondary" data-action="map">Room Map</button>
            </header>
      ${completedView ? completionMarkup(room) : puzzleMarkup(room, data)}
          </div>
        </section>
      `;
      bindRoomEvents(room);
    }

    function completionMarkup(room) {
      const next = rooms[room.number];
      const crystalName = `${room.power} Crystal`;
      const crystalSrc = crystalAsset(room);
      const completionNote = room.id === "token"
        ? "Remember: this is only one possible tokenisation. Different LLMs may split the same sentence differently. The key idea is that tokens are not always whole words."
        : next
          ? `Door opened. Room ${next.number} is ready.`
          : "All rooms cleared. The final exit is ready.";
      return `<section class="completion">
        <div class="crystal-stage" aria-hidden="true">
          <img class="completion-crystal" src="${crystalSrc}" alt="">
        </div>
        <span class="clue">${crystalName} collected</span>
        <h2>${room.power} restored</h2>
        <p>${completionNote}</p>
        <div>
          <button type="button" class="secondary" data-action="map">Room Map</button>
          <button type="button" data-action="replay">Replay</button>
          <button type="button" class="gold" data-action="next-room">${next ? `Enter Room ${next.number}` : "Open Final Exit"}</button>
        </div>
      </section>`;
    }

    function crystalAsset(room) {
      if (room.crystal === "token") {
        return "/assets/img/final-challenge/room1/token-crystal-clean.png";
      }
      const reusedArtwork = {
        numbers: "prediction",
        context: "context",
        connections: "verification",
        prediction: "patterns",
        training: "fairness"
      };
      return `/assets/img/final-challenge/crystals/crystal-${reusedArtwork[room.crystal] || room.crystal}.png`;
    }

    function puzzleMarkup(room, data) {
      if (room.id === "token") return tokenPuzzle(data);
      if (room.id === "numbers") return numbersPuzzle(data);
      if (room.id === "context") return contextWindowPuzzle(data);
      if (room.id === "connections") return connectionsPuzzle(data);
      if (room.id === "prediction") return nextTokenPuzzle(data);
      if (room.id === "training") return trainingLoopPuzzle(data);
      return "";
    }

    function stepStrip(steps, currentIndex) {
      return `<div class="step-strip" aria-label="Room steps">${steps.map((step, index) => {
        const stateClass = index < currentIndex ? "done" : index === currentIndex ? "current" : "";
        return `<div class="step-pill ${stateClass}"><span>${index < currentIndex ? "✓" : index + 1}</span><span>${step}</span></div>`;
      }).join("")}</div>`;
    }

    function guide(text, extra = "") {
      return `<aside class="guide-panel">
        <img src="/assets/img/final-challenge/room1/guide-robot.png" alt="Guide robot">
        <h2>Next clue</h2>
        <p>${text}</p>
        ${extra}
      </aside>`;
    }

    function tokenPuzzle(data) {
      const step = !data.inspected ? 0 : !data.tokenised ? 1 : 2;
      const exampleTokens = ["un", "believ", "able", "!"];
      return `<div class="room-body">
        <section class="puzzle-board">
          ${stepStrip(["Inspect door", "Run tokeniser", "Fill lock"], step)}
          <span class="clue">Learning simulation</span>
          <div class="door-zone">
            <strong>The lock receives text as token pieces, not one whole block.</strong>
            <p>Sentence: <b>${data.sentence}</b></p>
            ${!data.inspected ? `<button type="button" class="gold" data-action="inspect">Inspect door</button>` : !data.tokenised ? `<button type="button" data-action="tokenise">Activate tokeniser</button>` : `
              <div class="tokeniser-device">
                <img src="/assets/img/final-challenge/room1/tokeniser-machine.png" alt="">
                <div>
                  <strong>Example (simplified)</strong>
                  <p>One possible tokenisation of <b>unbelievable!</b> is:</p>
                  <div class="output-tokens">${exampleTokens.map((t) => `<span class="token example-token">${t}</span>`).join("")}</div>
                  <p>Different AI models may split text differently.</p>
                </div>
              </div>
              <p><b>Your lock sentence:</b> ${data.sentence}</p>
              <p>Drag pieces into the lock slots, or click a piece and then a slot. One piece does not belong.</p>
              <div class="slot-row">${data.answer.map((_, index) => `<button type="button" class="slot ${data.placed[index] ? "filled" : ""}" data-slot="${index}" draggable="${data.placed[index] ? "true" : "false"}" aria-label="${data.placed[index] ? `Move ${data.placed[index]} from lock slot ${index + 1}` : `Lock slot ${index + 1}`}">${data.placed[index] || ""}</button>`).join("")}</div>
              <div class="output-tokens">${data.tray.map((token, index) => {
                const used = data.placed.includes(token);
                return `<button type="button" class="token ${data.selected === index ? "selected" : ""} ${used ? "used" : ""}" data-token="${index}" draggable="${used ? "false" : "true"}" aria-label="${used ? `${token} already placed` : `Drag token ${token}`}">${token}</button>`;
              }).join("")}</div>
              <button type="button" data-action="check">Activate lock</button>
              <button type="button" class="secondary" data-action="reset-room">Reset room</button>
            `}
          </div>
          <div class="feedback ${data.feedback?.startsWith("Good") ? "good" : data.feedback ? "bad" : ""}">${data.feedback || "A token can be a whole word, part of a word, or punctuation."}</div>
        </section>
        ${guide(step === 0 ? "Start by checking the door." : step === 1 ? "Run the machine to see a simple example." : "Drag a token piece into each slot from left to right. You can also click a piece, then click a slot.")}
      </div>`;
    }

    function numbersPuzzle(data) {
      const step = data.step || 0;
      return `<div class="room-body">
        <section class="puzzle-board">
          ${stepStrip(["Choose token", "Read its ID", "Open number row", "Explain it"], Math.min(step, 3))}
          <span class="clue">Teaching lookup</span>
          <h2>How does a text piece become something the model can calculate with?</h2>
          <p>Follow one token through a lookup. Each click reveals the next link.</p>
          <div class="journey-strip">
            <button type="button" class="${step >= 1 ? "selected" : ""}" data-action="numbers-step" ${step === 0 ? "" : "disabled"}><small>Token</small><strong>robot</strong></button>
            <span>→</span>
            <button type="button" class="${step >= 2 ? "selected" : ""}" data-action="numbers-step" ${step === 1 ? "" : "disabled"}><small>Token ID</small><strong>${step >= 1 ? "305" : "?"}</strong></button>
            <span>→</span>
            <button type="button" class="${step >= 3 ? "selected" : ""}" data-action="numbers-step" ${step === 2 ? "" : "disabled"}><small>Learned row</small><strong>${step >= 2 ? "[ 0.18, −0.42, 0.73, … ]" : "[ ?, ?, ?, … ]"}</strong></button>
          </div>
          <div class="feedback ${step >= 3 ? "good" : ""}">${step === 0 ? "Start with the token. Its ID is only a label." : step === 1 ? "305 labels this token. It is not a score or meaning." : step === 2 ? "The ID points to one learned row of numbers. Open it." : "The model calculates with number patterns instead of reading the written word like a person."}</div>
          <p class="simulation-note"><b>Teaching example:</b> these short values are illustrative. A real model uses a much larger learned row from its model weights.</p>
          <button type="button" data-action="check" ${step >= 3 ? "" : "disabled"}>Collect the Numbers Crystal</button>
        </section>
        ${guide(step < 3 ? "Follow the arrows one step at a time: token, label, then learned number row." : "The ID finds the row. The row gives the model numbers it can work with.")}
      </div>`;
    }

    function contextWindowPuzzle(data) {
      const options = [
        ["umbrella", "umbrella at home"],
        ["clouds", "dark clouds"],
        ["outside", "looked outside"]
      ];
      return `<div class="room-body">
        <section class="puzzle-board">
          ${stepStrip(["Read growing text", "Find the boundary", "Choose missing clue"], data.choice ? 2 : 1)}
          <span class="clue">Current reading window</span>
          <h2>Which earlier clue has moved outside the model's current view?</h2>
          <div class="context-story">
            <p class="outside"><small>Outside the window</small>Mia left her <b>umbrella</b> at home.</p>
            <div class="inside"><small>Inside the window</small><p>Dark clouds covered the sky.</p><p>She looked outside and ...</p></div>
          </div>
          <div class="choice-grid">${options.map(([id, text]) => `<button type="button" class="${data.choice === id ? "selected" : ""}" data-choice="${id}">${text}</button>`).join("")}</div>
          <button type="button" data-action="check">Check the context window</button>
          <div class="feedback ${data.feedback?.startsWith("Good") ? "good" : data.feedback ? "bad" : ""}">${data.feedback || "The context window is the group of earlier tokens available for the current step."}</div>
        </section>
        ${guide("Look for the faded line outside the outlined reading window.")}
      </div>`;
    }

    function connectionsPuzzle(data) {
      const tokens = ["The", "tired", "dog", "slept", "beside", "the", "warm", "fire", "."];
      return `<div class="room-body">
        <section class="puzzle-board">
          ${stepStrip(["Read the task", "Connect two clues", "Explain the answer"], data.selected.length >= 2 ? 2 : 1)}
          <span class="clue">All tokens are visible</span>
          <h2>What is likely to be sleeping?</h2>
          <p>Choose the two tokens that connect most directly to this question.</p>
          <div class="chip-grid">${tokens.map((token, index) => `<button type="button" class="${data.selected.includes(token) ? "selected" : ""}" data-chip="${token}">${token}</button>`).join("")}</div>
          <button type="button" data-action="check">Test the connections</button>
          <div class="feedback ${data.feedback?.startsWith("Good") ? "good" : data.feedback ? "bad" : ""}">${data.feedback || "Visible tokens do not all help equally. The current task changes which connections matter most."}</div>
        </section>
        ${guide("Choose the thing that can sleep and the action that tells you it slept.")}
      </div>`;
    }

    function nextTokenPuzzle(data) {
      const firstRound = data.round === 0;
      const options = firstRound
        ? [["door",45],["box",30],["book",18],["banana",7]]
        : [["inside",50],["away",25],["slowly",18],["banana",7]];
      const sentence = firstRound ? "The robot opened the ___" : `The robot opened the ${data.generated[0] || "door"} and stepped ___`;
      return `<div class="room-body">
        <section class="puzzle-board">
          ${stepStrip(["Compare candidates", "Add one token", "Predict again"], firstRound ? (data.choice ? 1 : 0) : 2)}
          <span class="clue">Reviewed classroom probabilities</span>
          <h2>${sentence}</h2>
          <p>Several tokens are possible. Pick the strongest classroom candidate, then add it to the text.</p>
          <div class="choice-grid">${options.map(([token, chance]) => `<button type="button" class="${data.choice === token ? "selected" : ""}" data-choice="${token}"><strong>${token}</strong><small>${chance}%</small></button>`).join("")}</div>
          <button type="button" data-action="check">${firstRound ? "Add selected token" : "Add token and finish"}</button>
          <div class="feedback ${data.feedback?.startsWith("Good") ? "good" : data.feedback ? "bad" : ""}">${data.feedback || "These values are reviewed teaching data, not live Qwen output. A higher chance is not a guarantee."}</div>
        </section>
        ${guide(firstRound ? "Choose the highest reviewed chance. After it joins the sentence, the model predicts again." : "The new token changes the text available for the next prediction.")}
      </div>`;
    }

    function trainingLoopPuzzle(data) {
      const step = data.step || 0;
      const labels = ["Predict next token", "Reveal actual token", "Compare", "Adjust parameters", "Repeat example"];
      return `<div class="room-body">
        <section class="puzzle-board">
          ${stepStrip(labels, step)}
          <span class="clue">Teaching training loop</span>
          <h2>The puppy chased the ___</h2>
          <div class="training-demo">
            <div><small>Model prediction</small><strong>${step >= 1 ? "cat" : "?"}</strong></div>
            <span>→</span>
            <div><small>Actual token</small><strong>${step >= 2 ? "ball" : "?"}</strong></div>
            <span>→</span>
            <div><small>Internal parameters</small><strong>${step >= 4 ? "adjusted" : "waiting"}</strong></div>
          </div>
          <button type="button" data-action="training-step" ${step >= 5 ? "disabled" : ""}>${labels[Math.min(step, 4)]}</button>
          <button type="button" data-action="check" ${step >= 5 ? "" : "disabled"}>Collect the Training Crystal</button>
          <div class="feedback ${step >= 5 ? "good" : ""}">${step === 0 ? "First the model makes a prediction from a training example." : step === 1 ? "Now reveal the actual next token supplied by the training text." : step === 2 ? "The prediction and actual token are compared." : step === 3 ? "The difference guides a tiny adjustment to many internal parameters." : step === 4 ? "Training repeats across many examples." : "Training happens before normal text generation. This browser is demonstrating the loop, not training Qwen."}</div>
          <p class="simulation-note"><b>Important:</b> this is a simplified visual demonstration. No model weights are trained in your browser.</p>
        </section>
        ${guide("Observe one step, click, then see what changed. Training repeats this cycle across many examples.")}
      </div>`;
    }

    function predictionPuzzle(data) {
      const options = ["umbrella", "shoes", "lunch", "dog"];
      return `<div class="room-body">
        <section class="puzzle-board">
          ${stepStrip(["Read clue", "Pick token", "Start machine"], data.choice ? 2 : 1)}
          <span class="clue">Machine clue</span>
          <h2>It was raining, so I took my ____.</h2>
          <p>Which word fits best?</p>
          <div class="choice-grid">${options.map((option) => `<button type="button" class="${data.choice === option ? "selected" : ""}" data-choice="${option}">${option}</button>`).join("")}</div>
          <button type="button" data-action="check">Start prediction machine</button>
          <div class="feedback ${data.feedback?.startsWith("Good") ? "good" : data.feedback ? "bad" : ""}">${data.feedback || "The sentence gives a clue. Some words fit better."}</div>
        </section>
        ${guide("Use the clue before the blank. Rain makes one answer much more likely.")}
      </div>`;
    }

    function verificationPuzzle(data) {
      const options = [
        ["trust", "Trust it because it sounds confident."],
        ["verify", "Check whether the source or fact exists."],
        ["ignore", "Ignore every answer with numbers."],
        ["repeat", "Ask the AI to repeat the same claim."]
      ];
      return `<div class="room-body">
        <section class="puzzle-board">
          ${stepStrip(["Read claim", "Choose action", "File evidence"], data.selected ? 2 : 1)}
          <span class="clue">Archive note</span>
          <h2>"A 2024 study proved purple notebooks improve memory by 37%."</h2>
          <p>It sounds official, but there is no source. What should you do?</p>
          <div class="choice-grid">${options.map(([id, text]) => `<button type="button" class="${data.selected === id ? "selected" : ""}" data-choice="${id}">${text}</button>`).join("")}</div>
          <button type="button" data-action="check">File the evidence</button>
          <div class="feedback ${data.feedback?.startsWith("Good") ? "good" : data.feedback ? "bad" : ""}">${data.feedback || "A made-up answer can sound very real."}</div>
        </section>
        ${guide("Precise numbers and university names can still be fake. Check the source.")}
      </div>`;
    }

    function contextPuzzle(data) {
      const chips = [
        ["weather", "Weather: rainy and 18°C", true],
        ["location", "Location: Edinburgh", true],
        ["event", "Event: outdoor school trip", true],
        ["colour", "Favourite colour: purple", false],
        ["pet", "My cat is called Milo", false]
      ];
      const useful = data.selected.filter((id) => chips.find((chip) => chip[0] === id)?.[2]).length;
      return `<div class="room-body">
        <section class="puzzle-board">
          ${stepStrip(["Read question", "Pick useful clues", "Focus lens"], data.selected.length ? 2 : 1)}
          <span class="clue">Blurry question</span>
          <h2>What should I wear tomorrow?</h2>
          <p>Pick clues that help answer the question.</p>
          <div class="chip-grid">${chips.map(([id, text]) => `<button type="button" class="${data.selected.includes(id) ? "selected" : ""}" data-chip="${id}">${text}</button>`).join("")}</div>
          <p>Useful clue score</p><div class="meter" style="--value:${Math.min(100, 22 + useful * 24)}%"><span></span></div>
          <button type="button" data-action="check">Focus context lens</button>
          <div class="feedback ${data.feedback?.startsWith("Good") ? "good" : data.feedback ? "bad" : ""}">${data.feedback || "Useful context is related to the question."}</div>
        </section>
        ${guide("Weather, place, and event help. Random facts do not.")}
      </div>`;
    }

    function trainingPuzzle(data) {
      const examples = [
        ["many", "Many correct examples about planets and orbits", true],
        ["one", "Only one lonely example", false],
        ["wrong", "Several wrong examples mixed in", false],
        ["varied", "Different but related examples showing the same pattern", true]
      ];
      return `<div class="room-body">
        <section class="puzzle-board">
          ${stepStrip(["Read goal", "Pick examples", "Run lab"], data.selected.length ? 2 : 1)}
          <span class="clue">Training device</span>
          <h2>Feed the model examples that help it learn a pattern.</h2>
          <p>This is a simplified training simulation.</p>
          <div class="choice-grid">${examples.map(([id, text]) => `<button type="button" class="${data.selected.includes(id) ? "selected" : ""}" data-chip="${id}">${text}</button>`).join("")}</div>
          <button type="button" data-action="check">Run training lab</button>
          <div class="feedback ${data.feedback?.startsWith("Good") ? "good" : data.feedback ? "bad" : ""}">${data.feedback || "Good examples help the model find patterns."}</div>
        </section>
        ${guide("Choose enough examples, and make sure they are correct.")}
      </div>`;
    }

    function fairnessPuzzle(data) {
      const female = 10 - data.ratio;
      const balancedEnough = data.ratio === 5;
      const malePrediction = data.ratio * 10;
      const femalePrediction = 100 - malePrediction;
      const predictedLabel = malePrediction === femalePrediction ? "Both equally" : malePrediction > femalePrediction ? "Male" : "Female";
      const dataMixText = balancedEnough
        ? "The people examples are balanced."
        : data.ratio > 5
          ? "The examples mostly show men."
          : "The examples mostly show women.";
      const shortcutText = data.removed
        ? "The unfair sentence has been removed."
        : "The unfair sentence is still teaching a bad shortcut.";
      const simulatedOutput = balancedEnough && data.removed
        ? "Fairer test output: the model gives both groups a fair chance in this small simulation."
        : balancedEnough
          ? "Numbers are balanced, but the unfair sentence can still push the output in a bad direction."
          : data.removed
            ? `The unfair sentence is gone, but the data still leans ${predictedLabel.toLowerCase()}.`
            : `The output may lean ${predictedLabel.toLowerCase()} and repeat the unfair shortcut.`;
      const testClass = data.tested ? (balancedEnough && data.removed ? "good" : "bad") : "";
      const defaultFeedback = balancedEnough && data.removed
        ? "Ready to test. The examples are balanced and the unfair sentence is gone."
        : balancedEnough
          ? "The examples are balanced. Now remove the unfair sentence."
          : data.removed
            ? "The unfair sentence is gone. Now balance the examples to 5 and 5."
            : "First, balance the examples and remove the unfair sentence.";
      const people = [
        ...Array.from({ length: data.ratio }, () => "male"),
        ...Array.from({ length: female }, () => "female")
      ];
      return `<div class="room-body">
        <section class="puzzle-board">
          ${stepStrip(["Look at data", "Fix data", "Test prediction"], balancedEnough && data.removed ? 2 : balancedEnough || data.removed ? 1 : 0)}
          <span class="clue">Learning simulation</span>
          <h2>Make the training data fairer.</h2>
          <p>The model is not checking what is fair. It follows patterns from the examples it was given.</p>
          <div class="fairness-checklist">
            <span class="fairness-check ${balancedEnough ? "done" : ""}">1. Balance people</span>
            <span class="fairness-check ${data.removed ? "done" : ""}">2. Remove bad shortcut</span>
            <span class="fairness-check ${data.tested && balancedEnough && data.removed ? "done" : ""}">3. Test output</span>
          </div>
          <div class="fairness-lab">
            <div class="fairness-data-row">
              <div class="data-window">
                <h3>Training data shown to the model</h3>
                <div class="people-row">${people.map((kind) => `<span class="person-dot ${kind}" title="${kind}">${kind === "male" ? "M" : "F"}</span>`).join("")}</div>
                <p><b>Male examples:</b> ${data.ratio} · <b>Female examples:</b> ${female}</p>
                <div class="data-examples" aria-label="training examples">
                  <div class="data-example"><span>✓</span><span>Doctor example with a man.</span></div>
                  <div class="data-example"><span>✓</span><span>Doctor example with a woman.</span></div>
                  <div class="data-example ${data.removed ? "cleaned" : "warning"}"><span>${data.removed ? "✓" : "⚠"}</span><span>"Men are usually better leaders."</span></div>
                </div>
                <div class="bias-sample ${data.removed ? "removed" : ""}">
                  <span>${data.removed ? "✓ Removed unfair sentence" : "⚠ Unfair sentence still in data"}</span>
                  <small>${data.removed ? "The data is cleaner now." : "\"Men are usually better leaders.\" This is not a fair example."}</small>
                </div>
              </div>
              <div class="prediction-window">
                <h3>Simulated prediction</h3>
                <div class="prediction-big">
                  <span>The model is more likely to answer:</span>
                  <strong>${predictedLabel}</strong>
                  <div class="prediction-bars">
                    <div class="prediction-bar" style="--bar:#4a91ff; --value:${malePrediction}%"><span>Male</span><span><i></i></span><span>${malePrediction}%</span></div>
                    <div class="prediction-bar" style="--bar:#ffb340; --value:${femalePrediction}%"><span>Female</span><span><i></i></span><span>${femalePrediction}%</span></div>
                  </div>
                </div>
                <div class="fairness-cause">
                  <span><b>Data mix</b>${dataMixText}</span>
                  <span><b>Bad shortcut</b>${shortcutText}</span>
                  <span><b>Test result</b>${simulatedOutput}</span>
                </div>
              </div>
            </div>
            <div class="data-cleaner">
              <h3>Fix the data</h3>
              <div class="fix-controls">
                <label>
                  <b>Change the mix of examples</b>
                  <input type="range" min="0" max="10" step="1" value="${data.ratio}" data-slider="ratio" aria-label="Male examples out of 10">
                </label>
                <span class="pill">M ${data.ratio} / F ${female}</span>
              </div>
              <button type="button" class="remove-card ${data.removed ? "selected" : ""}" data-action="remove-stereotype">
                <strong>${data.removed ? "Bad shortcut removed" : "Remove the bad shortcut"}</strong>
                <span>${data.removed ? "The unfair sentence is crossed out in the training data." : "Take out the sentence that teaches an unfair idea."}</span>
              </button>
            </div>
            <div class="test-output ${testClass}">
              <span>⚖</span>
              <span>${data.tested ? (balancedEnough && data.removed ? "<b>Test passed:</b> the output is fairer because the data is balanced and the bad shortcut is gone." : `<b>Test failed:</b> ${simulatedOutput}`) : "The test chamber checks two things: balanced examples and no unfair shortcut."}</span>
            </div>
          </div>
          <button type="button" data-action="check">Test new prediction</button>
          <div class="feedback ${data.feedback?.startsWith("Good") || data.feedback?.startsWith("Ready") || data.feedback?.startsWith("You removed") ? "good" : data.feedback ? "bad" : ""}">${data.feedback || defaultFeedback}</div>
        </section>
        ${guide("Do both fixes: balance the examples, then remove the bad shortcut. Real AI fairness also needs more testing.")}
      </div>`;
    }

    function bindRoomEvents(room) {
      roomScreen.querySelector("[data-action='map']")?.addEventListener("click", openMap);
      roomScreen.querySelector("[data-action='next']")?.addEventListener("click", continueAdventure);
      roomScreen.querySelector("[data-action='next-room']")?.addEventListener("click", () => nextRoomAfter(room));
      roomScreen.querySelector("[data-action='replay']")?.addEventListener("click", () => openRoom(room.id, true));
      roomScreen.querySelector("[data-action='reset-room']")?.addEventListener("click", () => openRoom(room.id, false));

      if (room.id === "token") bindTokenRoom(room);
      if (room.id === "numbers") bindNumbersRoom(room);
      if (room.id === "context" || room.id === "prediction") bindChoiceRoom(room, "choice");
      if (room.id === "connections") bindChipRoom(room);
      if (room.id === "training") bindTrainingRoom(room);
      roomScreen.querySelector("[data-action='check']")?.addEventListener("click", () => checkRoom(room));
    }

    function bindTokenRoom(room) {
      const data = state.roomData;
      roomScreen.querySelector("[data-action='inspect']")?.addEventListener("click", () => {
        data.inspected = true;
        data.feedback = "Good. Convert the sentence into token pieces before sending it to the lock.";
        renderRoom(room);
        send("ESCAPE_ROOM_PROGRESS", { roomId: room.id, step: "door-inspected" });
      });
      roomScreen.querySelector("[data-action='tokenise']")?.addEventListener("click", () => {
        data.tokenised = true;
        data.feedback = "Good. That was only one possible split. Now solve the lock sentence.";
        renderRoom(room);
        send("ESCAPE_ROOM_PROGRESS", { roomId: room.id, step: "tokeniser-activated" });
      });
      const placeTokenInSlot = (tokenIndex, slotIndex, sourceSlot = null) => {
        const token = sourceSlot === null ? data.tray[tokenIndex] : data.placed[sourceSlot];
        if (!token) return;
        if (sourceSlot !== null) {
          if (sourceSlot === slotIndex) return;
          const displaced = data.placed[slotIndex] || "";
          data.placed[slotIndex] = token;
          data.placed[sourceSlot] = displaced;
        } else {
          const existingIndex = data.placed.indexOf(token);
          if (existingIndex !== -1) data.placed[existingIndex] = "";
          data.placed[slotIndex] = token;
        }
        data.selected = null;
        data.feedback = "Piece placed. Fill the slots from left to right, then activate the lock.";
        renderRoom(room);
      };
      roomScreen.querySelectorAll("[data-token]").forEach((button) => button.addEventListener("click", () => {
        const index = Number(button.dataset.token);
        if (data.placed.includes(data.tray[index])) return;
        data.selected = data.selected === index ? null : index;
        renderRoom(room);
      }));
      roomScreen.querySelectorAll("[data-token]").forEach((button) => {
        button.addEventListener("dragstart", (event) => {
          const index = Number(button.dataset.token);
          if (data.placed.includes(data.tray[index])) {
            event.preventDefault();
            return;
          }
          button.classList.add("dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("application/x-ai-token-piece", JSON.stringify({ tokenIndex: index, sourceSlot: null }));
          event.dataTransfer.setData("text/plain", String(index));
        });
        button.addEventListener("dragend", () => button.classList.remove("dragging"));
      });
      roomScreen.querySelectorAll("[data-slot]").forEach((button) => {
        button.addEventListener("click", () => {
        const slot = Number(button.dataset.slot);
        if (data.selected === null) {
          if (data.placed[slot]) data.placed[slot] = "";
        } else {
          placeTokenInSlot(data.selected, slot);
          return;
        }
        renderRoom(room);
        });
        button.addEventListener("dragstart", (event) => {
          const slot = Number(button.dataset.slot);
          if (!data.placed[slot]) {
            event.preventDefault();
            return;
          }
          button.classList.add("dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("application/x-ai-token-piece", JSON.stringify({ tokenIndex: null, sourceSlot: slot }));
          event.dataTransfer.setData("text/plain", `slot:${slot}`);
        });
        button.addEventListener("dragend", () => button.classList.remove("dragging"));
        button.addEventListener("dragover", (event) => {
          event.preventDefault();
          event.dataTransfer.dropEffect = "move";
          button.classList.add("drag-over");
        });
        button.addEventListener("dragleave", () => button.classList.remove("drag-over"));
        button.addEventListener("drop", (event) => {
          event.preventDefault();
          button.classList.remove("drag-over");
          const slot = Number(button.dataset.slot);
          let payload = {};
          try {
            payload = JSON.parse(event.dataTransfer.getData("application/x-ai-token-piece") || "{}");
          } catch (error) {
            payload = {};
          }
          if (payload.sourceSlot !== null && payload.sourceSlot !== undefined) {
            placeTokenInSlot(null, slot, Number(payload.sourceSlot));
            return;
          }
          const raw = event.dataTransfer.getData("text/plain");
          const tokenIndex = Number(raw);
          if (Number.isInteger(tokenIndex)) placeTokenInSlot(tokenIndex, slot);
        });
      });
    }

    function bindChoiceRoom(room, key) {
      roomScreen.querySelectorAll("[data-choice]").forEach((button) => button.addEventListener("click", () => {
        state.roomData[key] = button.dataset.choice;
        renderRoom(room);
      }));
    }

    function bindChipRoom(room) {
      roomScreen.querySelectorAll("[data-chip]").forEach((button) => button.addEventListener("click", () => {
        const id = button.dataset.chip;
        const selected = state.roomData.selected;
        state.roomData.selected = selected.includes(id) ? selected.filter((item) => item !== id) : [...selected, id];
        renderRoom(room);
      }));
    }

    function bindNumbersRoom(room) {
      roomScreen.querySelector("[data-action='numbers-step']")?.addEventListener("click", () => {
        state.roomData.step = Math.min(3, (state.roomData.step || 0) + 1);
        renderRoom(room);
      });
    }

    function bindTrainingRoom(room) {
      roomScreen.querySelector("[data-action='training-step']")?.addEventListener("click", () => {
        state.roomData.step = Math.min(5, (state.roomData.step || 0) + 1);
        renderRoom(room);
      });
    }

    function bindFairnessRoom(room) {
      roomScreen.querySelector("[data-slider='ratio']")?.addEventListener("input", (event) => {
        state.roomData.ratio = Number(event.target.value);
        state.roomData.tested = false;
        state.roomData.feedback = "";
        renderRoom(room);
      });
      roomScreen.querySelector("[data-action='remove-stereotype']")?.addEventListener("click", () => {
        state.roomData.removed = !state.roomData.removed;
        state.roomData.tested = false;
        state.roomData.feedback = state.roomData.removed ? "You removed the unfair sentence. Now test the prediction." : "The unfair sentence is back in the data.";
        renderRoom(room);
      });
    }

    function checkRoom(room) {
      const data = state.roomData;
      if (room.id === "token") {
        const correct = data.answer || [];
        if (data.placed.filter(Boolean).length < correct.length) data.feedback = `Some slots are empty. Fill all ${correct.length} slots.`;
        else if (data.placed.join("|") !== correct.join("|")) data.feedback = "Not yet. Check the order and remember that one tray piece is a distractor.";
        else return roomComplete(room);
      }
      if (room.id === "numbers") {
        if (data.step >= 3) return roomComplete(room);
        data.feedback = "Follow the token to its ID, then open the learned number row.";
      }
      if (room.id === "context") {
        if (data.choice === "umbrella") return roomComplete(room);
        data.feedback = "Look at the faded line outside the current window.";
      }
      if (room.id === "connections") {
        const selected = new Set(data.selected);
        if (selected.size === 2 && selected.has("dog") && selected.has("slept")) return roomComplete(room);
        data.feedback = "Choose exactly two clues: who can sleep, and which action confirms it?";
      }
      if (room.id === "prediction") {
        const expected = data.round === 0 ? "door" : "inside";
        if (data.choice === expected && data.round === 0) {
          data.generated = [data.choice];
          data.round = 1;
          data.choice = "";
          data.feedback = "Good. The selected token joins the text, so the model predicts again.";
          renderRoom(room);
          return;
        }
        if (data.choice === expected && data.round === 1) return roomComplete(room);
        data.feedback = "Compare the reviewed chances and choose the strongest candidate.";
      }
      if (room.id === "training") {
        if (data.step >= 5) return roomComplete(room);
        data.feedback = "Complete each part of the training loop before collecting the crystal.";
      }
      renderRoom(room);
    }

    function renderExit() {
      const allDone = rooms.every((room) => state.completed.has(room.id) && state.crystals.has(room.crystal));
      const placedCrystals = state.finalComplete ? new Set(rooms.map((room) => room.crystal)) : state.exitPlaced;
      const allPlaced = allDone && rooms.every((room) => placedCrystals.has(room.crystal));
      const modelPlaced = state.finalComplete ? finalModelOrder : state.exitModel;
      const reviewPlaced = state.finalComplete ? finalReviewOrder : state.exitReview;
      const modelCorrect = finalModelOrder.every((id, index) => modelPlaced[index] === id);
      const reviewCorrect = finalReviewOrder.every((id, index) => reviewPlaced[index] === id);
      const modelReady = finalModelOrder.every((_, index) => Boolean(modelPlaced[index]));
      const reviewReady = finalReviewOrder.every((_, index) => Boolean(reviewPlaced[index]));
      const canTryFinal = allPlaced && modelReady && reviewReady;
      const finalReady = allPlaced && modelCorrect && reviewCorrect;
      const exitComplete = state.finalComplete;
      const hasPlacedCards = state.exitModel.length > 0 || state.exitReview.length > 0;
      const titleText = exitComplete ? "Language Model Door opened" : allDone ? "Power the Language Model Door" : "Final room not ready";
