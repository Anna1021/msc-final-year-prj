<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How Language Models Work — Escape Room</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff8ff;
      --muted: #d8d0f4;
      --panel: rgba(14, 10, 32, .78);
      --line: rgba(228, 214, 255, .2);
      --purple: #9b6cff;
      --gold: #ffd15a;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      background: #070917;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      color: #fff;
      background: linear-gradient(135deg, #775cff, #5037ed);
      box-shadow: 0 12px 24px rgba(38, 20, 120, .22);
      font-weight: 950;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }
    button:disabled {
      opacity: .62;
      cursor: not-allowed;
      filter: grayscale(.35);
      box-shadow: none;
      color: #b9c2d8;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(230,220,255,.15);
    }
    button.secondary { background: rgba(255,255,255,.08); border: 1px solid var(--line); box-shadow: none; }
    button.gold { color: #281c05; background: linear-gradient(135deg, #ffe08a, #ffbf34); }
    button.success { color: #072917; background: linear-gradient(135deg, #7cf4b2, #25b866); }
    button.success:disabled { color: #9ca7bf; background: rgba(255,255,255,.08); }
    button.danger { background: linear-gradient(135deg, #ff7587, #e64058); }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background:
        radial-gradient(circle at 20% 8%, rgba(155,108,255,.28), transparent 24%),
        radial-gradient(circle at 82% 78%, rgba(255,193,63,.2), transparent 24%),
        linear-gradient(135deg, #0a0d20, #17102d 48%, #07101f);
    }

    .topbar {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(230,220,255,.14);
      background: rgba(7, 9, 23, .72);
      backdrop-filter: blur(14px);
    }

    body.embedded .topbar { display: none; }
    body.embedded .screen {
      min-height: calc(100vh - 16px);
      max-width: min(2100px, calc(100vw - 12px));
    }
    body.embedded .room,
    body.embedded .room-inner,
    body.embedded .exit { min-height: calc(100vh - 16px); }
    body.embedded .stage { padding: 8px; }
    body.embedded .hero {
      min-height: 270px;
      padding: 28px 36px;
      grid-template-columns: minmax(0, 1fr) 230px;
    }
    body.embedded .hero h1 { font-size: clamp(2rem, 4vw, 3.5rem); }
    body.embedded .hero p { max-width: 640px; }
    body.embedded .hero .robot { width: 210px; }
    body.embedded .map-grid { margin-top: 12px; }
    body.embedded .room-card { min-height: 156px; padding: 17px; }

    .brand span {
      display: block;
      color: #b7a6ff;
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 950;
    }

    .brand strong { font-size: 1.1rem; }
    .top-actions { display: flex; align-items: center; justify-content: flex-end; gap: 9px; flex-wrap: wrap; }
    .pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 9px 12px; color: #f5f0ff; background: rgba(255,255,255,.1); border: 1px solid rgba(230,220,255,.18); font-weight: 950; }

    .stage {
      min-height: 0;
      position: relative;
      overflow: auto;
      padding: 18px;
    }

    .screen {
      min-height: calc(100vh - 104px);
      display: none;
      max-width: min(1500px, calc(100vw - 36px));
      margin: 0 auto;
    }

    .screen.active { display: block; }

    .hero {
      min-height: 360px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 360px);
      gap: 24px;
      align-items: center;
      padding: clamp(24px, 4vw, 52px);
      border: 1px solid rgba(224,212,255,.18);
      border-radius: 28px;
      background:
        radial-gradient(circle at 80% 24%, rgba(155,108,255,.4), transparent 26%),
        linear-gradient(135deg, rgba(21, 14, 48, .9), rgba(10, 11, 30, .92)),
        url('/assets/img/final-challenge/room1/room-bg.png') center / cover;
      box-shadow: inset 0 0 120px rgba(0,0,0,.28), 0 24px 70px rgba(0,0,0,.22);
    }

    .hero h1, .room h1, .exit h1 { margin: 8px 0 12px; font-size: clamp(2.3rem, 5vw, 5rem); line-height: .95; }
    .hero p, .room p, .exit p { color: var(--muted); font-weight: 780; line-height: 1.5; font-size: 1rem; }
    .robot { width: min(280px, 100%); filter: drop-shadow(0 24px 40px rgba(0,0,0,.35)); animation: float 3.4s ease-in-out infinite; justify-self: center; }

    .map-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .room-card {
      min-height: 186px;
      position: relative;
      overflow: hidden;
      display: grid;
      align-content: space-between;
      gap: 12px;
      padding: 20px;
      border: 1px solid color-mix(in srgb, var(--room) 42%, rgba(255,255,255,.2));
      border-radius: 22px;
      text-align: left;
      color: #fff;
      background:
        radial-gradient(circle at 82% 18%, color-mix(in srgb, var(--room) 36%, transparent), transparent 26%),
        linear-gradient(135deg, rgba(13, 12, 33, .94), rgba(8, 11, 26, .92));
      box-shadow: inset 0 0 80px rgba(0,0,0,.25), 0 18px 38px rgba(0,0,0,.16);
    }

    .room-card::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .16;
      background:
        linear-gradient(transparent 0 38px, rgba(255,255,255,.12) 39px 41px, transparent 42px),
        linear-gradient(90deg, transparent 0 78px, rgba(255,255,255,.1) 79px 81px, transparent 82px);
      pointer-events: none;
    }

    .room-card > * { position: relative; z-index: 1; }
    .room-card small { color: color-mix(in srgb, var(--room) 44%, #fff); font-weight: 950; letter-spacing: .08em; text-transform: uppercase; }
    .room-card strong { font-size: 1.5rem; text-transform: uppercase; }
    .room-card p { margin: 0; color: #e9e3ff; font-weight: 760; }
    .room-card footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .crystal { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 15px; color: var(--room); background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); filter: drop-shadow(0 0 16px color-mix(in srgb, var(--room) 64%, transparent)); font-size: 1.7rem; }
    .room-card.locked { opacity: .58; }
    .room-card.locked button { background: rgba(255,255,255,.08); color: #d8d0f4; }
    .room-card.completed::after {
      content: attr(data-complete-label);
      position: absolute;
      right: 14px;
      top: 14px;
      z-index: 2;
      padding: 6px 9px;
      border-radius: 999px;
      color: #0b2418;
      background: #9ff3c4;
      font-size: .72rem;
      font-weight: 950;
    }

    .map-footer {
      margin-top: 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 15px 18px;
      border: 1px solid rgba(226,214,255,.18);
      border-radius: 20px;
      background: rgba(10, 10, 28, .66);
    }

    .inventory {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-weight: 950;
    }

    .inventory span {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 12px;
      color: rgba(255,255,255,.35);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
    }

    .inventory span.collected { color: var(--room); box-shadow: 0 0 18px color-mix(in srgb, var(--room) 56%, transparent); }

    .room {
      min-height: calc(100vh - 104px);
      border: 1px solid rgba(224,212,255,.18);
      border-radius: 28px;
      overflow: hidden;
      background:
        radial-gradient(circle at 78% 24%, color-mix(in srgb, var(--room) 32%, transparent), transparent 25%),
        linear-gradient(135deg, #101328, #090b1b);
      box-shadow: inset 0 0 120px rgba(0,0,0,.28), 0 24px 70px rgba(0,0,0,.22);
    }

    .room-bg-token {
      background:
        linear-gradient(90deg, rgba(4,5,15,.18), rgba(4,5,15,.06) 50%, rgba(4,5,15,.34)),
        url('/assets/img/final-challenge/room1/room-bg.png') center / cover;
    }

    .room-bg-numbers {
      background:
        linear-gradient(105deg, rgba(6, 10, 30, .9), rgba(18, 25, 67, .72) 54%, rgba(9, 9, 29, .9)),
        radial-gradient(circle at 72% 18%, rgba(91, 158, 255, .34), transparent 28%),
        url('/assets/img/final-challenge/room1/room-bg.png') center / cover;
    }

    .room-bg-context {
      background:
        linear-gradient(105deg, rgba(5, 12, 29, .92), rgba(11, 38, 58, .74) 58%, rgba(8, 12, 34, .9)),
        radial-gradient(circle at 76% 20%, rgba(56, 196, 201, .3), transparent 28%),
        url('/assets/img/final-challenge/room1/room-bg.png') center / cover;
    }

    .room-inner {
      min-height: calc(100vh - 104px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 16px;
      padding: clamp(18px, 3vw, 34px);
      background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.2));
    }

    .room-head { display: flex; justify-content: space-between; gap: 16px; align-items: start; }
    .room-head span { color: color-mix(in srgb, var(--room) 48%, #fff); font-weight: 950; text-transform: uppercase; letter-spacing: .08em; }
    .room-head h1 { font-size: clamp(2rem, 4vw, 4.2rem); }
    .room-objective { max-width: 620px; }

    .room-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 370px);
      gap: 18px;
      align-items: stretch;
    }

    .puzzle-board, .guide-panel {
      border: 1px solid rgba(232,222,255,.18);
      border-radius: 22px;
      padding: 18px;
      background: rgba(8, 9, 25, .68);
      box-shadow: inset 0 0 50px rgba(0,0,0,.18);
    }

    .puzzle-board { display: grid; align-content: start; gap: 14px; }
    .guide-panel { display: grid; align-content: start; gap: 12px; }
    .guide-panel img { width: 104px; justify-self: center; filter: drop-shadow(0 18px 24px rgba(0,0,0,.3)); animation: float 3.4s ease-in-out infinite; }
    .guide-panel h2 { margin: 0; }
    .guide-panel p { margin: 0; }

    .step-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 2px;
    }

    .step-pill {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      min-height: 48px;
      padding: 8px 10px;
      border-radius: 14px;
      color: rgba(255,255,255,.66);
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(230,220,255,.13);
      font-weight: 900;
    }

    .step-pill span:first-child {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: #fff;
      background: rgba(255,255,255,.12);
      font-size: .82rem;
    }

    .step-pill.current {
      color: #fff;
      border-color: color-mix(in srgb, var(--room) 58%, rgba(255,255,255,.2));
      background: color-mix(in srgb, var(--room) 22%, rgba(255,255,255,.08));
    }

    .step-pill.done {
      color: #d9ffe9;
      border-color: rgba(124,244,178,.3);
      background: rgba(32,155,93,.16);
    }

    .step-pill.done span:first-child {
      color: #072917;
      background: #7cf4b2;
    }

    .clue {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border-radius: 999px;
      color: #fff;
      background: color-mix(in srgb, var(--room) 28%, rgba(255,255,255,.08));
      border: 1px solid color-mix(in srgb, var(--room) 40%, rgba(255,255,255,.18));
      font-weight: 950;
    }

    .door-zone {
      min-height: 230px;
      display: grid;
      place-items: center;
      gap: 10px;
      text-align: center;
    }

    .tokeniser-device {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 16px;
      align-items: center;
      margin: 14px 0;
      padding: 14px;
      border-radius: 18px;
      background: rgba(0,0,0,.3);
      border: 1px solid rgba(180,210,255,.22);
    }

    .tokeniser-device img { width: 110px; }
    .output-tokens, .slot-row, .choice-grid, .chip-grid { display: flex; flex-wrap: wrap; gap: 10px; }

    .token {
      min-width: 72px;
      min-height: 46px;
      display: grid;
      place-items: center;
      padding: 8px 12px;
      border-radius: 15px;
      color: #32200e;
      background: #dec68e;
      border: 2px solid rgba(95,59,24,.22);
      font-weight: 950;
      font-size: 1.12rem;
      box-shadow: 0 10px 20px rgba(0,0,0,.18);
    }

    .token.selected { outline: 4px solid #ffe56a; transform: translateY(-4px); }
    .token.example-token { min-width: 62px; background: #eadcff; color: #241747; }
    .token.used { opacity: .45; }
    .token[draggable="true"] { cursor: grab; }
    .token[draggable="true"]:active { cursor: grabbing; }
    .slot[draggable="true"] { cursor: grab; }
    .slot[draggable="true"]:active { cursor: grabbing; }
    .token.dragging {
      opacity: .72;
      transform: translateY(-6px) scale(1.03);
      outline: 4px solid rgba(255,229,106,.75);
    }
    .slot.dragging {
      opacity: .72;
      transform: translateY(-5px) scale(1.03);
      border-color: #ffe56a;
      box-shadow: 0 0 0 5px rgba(255,229,106,.12), 0 0 24px rgba(255,229,106,.22);
    }
    .slot {
      width: 76px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: #fff;
      background: rgba(0,0,0,.24);
      border: 2px dashed rgba(230,220,255,.32);
      font-weight: 950;
    }
    .slot.filled { border-style: solid; border-color: color-mix(in srgb, var(--room) 55%, #fff); background: rgba(255,255,255,.14); }
    .slot.drag-over {
      border-style: solid;
      border-color: #ffe56a;
      background: rgba(255,229,106,.16);
      box-shadow: 0 0 0 5px rgba(255,229,106,.12), 0 0 24px rgba(255,229,106,.22);
    }
    .slot.error { border-color: #ff7083; animation: shake .25s ease; }

    .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .choice-grid button, .chip-grid button {
      min-height: 54px;
      color: #f8f4ff;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(230,220,255,.18);
      box-shadow: none;
      text-align: left;
    }
    .choice-grid button.selected, .chip-grid button.selected {
      border-color: color-mix(in srgb, var(--room) 62%, #fff);
      background: color-mix(in srgb, var(--room) 24%, rgba(255,255,255,.1));
    }

    .room-bg-token .door-zone { align-content: start; }
    .token-split-challenge {
      width: min(820px, 100%);
      display: grid;
      gap: 13px;
      margin-top: 6px;
      border: 1px solid rgba(215, 201, 255, .25);
      border-radius: 20px;
      padding: 18px;
      color: #f8f6ff;
      background: rgba(11, 10, 34, .48);
      box-shadow: inset 0 0 28px rgba(155, 108, 255, .1);
      text-align: left;
    }
    .token-question-badge {
      width: fit-content;
      border-radius: 999px;
      padding: 6px 10px;
      color: #241747;
      background: #eadcff;
      font-size: .78rem;
      font-weight: 950;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .token-split-challenge h2, .token-split-challenge p { margin: 0; }
    .token-target-sentence {
      border-radius: 14px;
      padding: 13px 15px;
      color: #282044;
      background: rgba(255,255,255,.94);
      font-size: 1.2rem;
      font-weight: 850;
    }
    .token-target-sentence mark {
      border-radius: 7px;
      padding: 2px 5px;
      color: #3e2386;
      background: #e9dcff;
      box-shadow: 0 3px 0 #aa86ef;
    }
    .token-split-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .token-split-option {
      min-height: 90px;
      display: grid;
      align-content: center;
      gap: 9px;
      border: 1px solid rgba(225, 215, 255, .28);
      border-bottom: 5px solid rgba(157, 126, 225, .48);
      border-radius: 16px;
      padding: 12px;
      color: #f9f7ff;
      background: rgba(255,255,255,.08);
      text-align: left;
    }
    .token-split-option small { color: #cdc3e9; font-weight: 900; }
    .token-split-option > span { display: flex; flex-wrap: wrap; gap: 5px; }
    .token-split-option b, .token-comparison span {
      border-radius: 9px;
      padding: 6px 8px;
      color: #2a1b50;
      background: #eee4ff;
      box-shadow: 0 3px 0 #a986e8;
    }
    .token-split-option:hover { border-color: #cbb6ff; background: rgba(155,108,255,.17); }
    .token-split-option.selected {
      border-color: #ffe56a;
      border-bottom-color: #cda72d;
      background: rgba(255,229,106,.13);
      box-shadow: 0 0 0 3px rgba(255,229,106,.12);
    }
    .token-split-option:focus-visible { outline: 3px solid #ffe76d; outline-offset: 3px; }
    .token-comparison {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      border-radius: 16px;
      padding: 13px;
      color: #2a2442;
      background: rgba(255,255,255,.94);
    }
    .token-comparison > div { display: grid; gap: 7px; }
    .token-comparison small { color: #635879; font-weight: 950; text-transform: uppercase; letter-spacing: .04em; }
    .token-comparison div > div { display: flex; flex-wrap: wrap; gap: 5px; }
    .token-comparison em { color: #665d78; font-size: .78rem; font-style: normal; font-weight: 800; }
    .token-comparison > b { color: #6f55cb; }
    .token-hint { border-left: 4px solid #ffe56a; border-radius: 10px; padding: 9px 11px; background: rgba(255,229,106,.1); }
    .token-room-actions { display: flex; flex-wrap: wrap; gap: 9px; }
    .token-lock-accepts { margin: 0; color: #d7ffe8; font-weight: 950; }
    .token-success-chain {
      display: grid;
      grid-template-columns: minmax(110px,1fr) auto minmax(110px,1fr) auto minmax(190px,1.4fr);
      align-items: center;
      gap: 10px;
      width: min(760px, 100%);
    }
    .token-success-chain > span { display: grid; gap: 5px; border-radius: 14px; padding: 11px; background: rgba(255,255,255,.1); }
    .token-success-chain small { color: #d5cced; font-weight: 900; text-transform: uppercase; }
    .token-success-chain i { color: #c3adff; font-size: 1.3rem; font-style: normal; font-weight: 950; }

    .room-bg-numbers {
      background:
        linear-gradient(105deg, rgba(5, 20, 30, .9), rgba(13, 52, 57, .7) 54%, rgba(8, 20, 31, .9)),
        radial-gradient(circle at 72% 18%, rgba(70, 212, 155, .32), transparent 28%),
        url('/assets/img/final-challenge/room1/room-bg.png') center / cover;
    }
    .context-chamber-body { grid-template-columns: minmax(0, 1fr) minmax(290px, 360px); }
    .context-chamber-board { gap: 16px; }
    .context-chamber-console, .context-chamber-scanner, .context-lock-question {
      border: 1px solid rgba(177, 255, 220, .22);
      border-radius: 20px;
      padding: 18px;
      background: linear-gradient(140deg, rgba(3, 16, 28, .62), rgba(22, 72, 70, .32));
      box-shadow: inset 0 0 34px rgba(70, 212, 155, .08);
    }
    .context-chamber-console { display: grid; gap: 14px; min-height: 202px; }
    .context-console-state { display: grid; justify-items: center; gap: 8px; text-align: center; color: #e8fffa; }
    .context-console-state p { max-width: 500px; margin: 0; color: #c7e5dc; }
    .context-console-orb { width: 54px; height: 54px; border: 3px solid #75f0bb; border-radius: 50%; background: radial-gradient(circle at 35% 28%, #e8fff6 0 7%, #4ad59b 8% 26%, #123e43 28%); box-shadow: 0 0 0 7px rgba(117,240,187,.09), 0 0 34px rgba(117,240,187,.3); }
    .context-console-state.inspected .context-console-orb { border-color: #85d4ff; background: radial-gradient(circle at 35% 28%, #eaf8ff 0 7%, #57bdf1 8% 26%, #183c57 28%); box-shadow: 0 0 0 7px rgba(133,212,255,.1), 0 0 34px rgba(133,212,255,.28); }
    .context-console-state.scanned .context-console-orb { animation: contextScan 1.8s ease-in-out infinite; }
    .context-chamber-scanner { display: grid; gap: 15px; }
    .context-chamber-sequence { display: flex; flex-wrap: wrap; justify-content: center; align-items: end; gap: 10px; padding-top: 25px; }

      }).sort(([a], [b]) => b.length - a.length);
      if (!entries.length) return;
      const exact = new Map(entries);
      const replace = (value) => {
        if (exact.has(value)) return exact.get(value);

        const trailing = value.match(/\s*$/)?.[0] || "";
        const coreEnd = trailing.length ? value.length - trailing.length : value.length;
        const core = value.slice(leading.length, coreEnd);
        if (exact.has(core)) return `${leading}${exact.get(core)}${trailing}`;
        return entries.reduce((result, [source, translated]) => {
          const isTemplateFragment = /^Room\s$/.test(source) || /^The .+\s$/.test(source);
          return isTemplateFragment ? result.split(source).join(translated) : result;
        }, value);
      };

      let node;
      while ((node = walker.nextNode())) {

      if (!box) return;
      box.textContent = text;
      box.className = "feedback bad map-feedback";
      setTimeout(() => {
        box.textContent = "Choose an unlocked room. Completed rooms can be replayed.";
        box.className = "feedback map-feedback";
      }, 2600);
    }

    function render() {
      updateTop();
      renderMap();
      if (state.currentScreen === "room" && state.currentRoom) renderRoom(roomById(state.currentRoom), false, state.currentStep === "complete" || state.currentStep === "completion");
      if (state.currentScreen === "final-exit") renderExit();
      if (state.currentScreen === "completion") renderCompletion();
      mapScreen.classList.toggle("active", state.currentScreen === "room-select");
      roomScreen.classList.toggle("active", state.currentScreen === "room");
      exitScreen.classList.toggle("active", state.currentScreen === "final-exit");
      completionScreen.classList.toggle("active", state.currentScreen === "completion");
    }

    function renderMap() {
      const completedCount = rooms.filter((room) => state.completed.has(room.id)).length;
      mapScreen.innerHTML = `
        <section class="hero">
          <div>
            <span class="clue">Final Challenge</span>
            <h1>Language Model Escape Room</h1>
            <p>Restore five crystals with your guide. Each room reviews one of the five lessons about how language models process text, predict, and learn.</p>
            <button type="button" class="gold" data-action="continue">${completedCount ? "Continue adventure" : "Start Room 1"}</button>
          </div>
          <img class="robot" src="/assets/img/final-challenge/room1/guide-robot.png" alt="Guide robot">
        </section>
        <section class="map-grid">
          ${rooms.map((room) => {
            const done = state.completed.has(room.id);
            const unlocked = isUnlocked(room);
            return `<article class="room-card ${unlocked ? "" : "locked"} ${done ? "completed" : ""}" data-complete-label="Crystal collected" style="--room:${room.colour}">
              <small>Room ${room.number}</small>
              <strong>${room.title}</strong>
              <p>${room.aim}</p>
              <footer>
                <span class="crystal">${done ? "◆" : unlocked ? "◇" : "🔒"}</span>
                <button type="button" data-room="${room.id}" ${unlocked ? "" : "disabled"}>${done ? "Replay puzzle" : unlocked ? "Enter room" : "Locked"}</button>
              </footer>
            </article>`;
          }).join("")}
        </section>
        <section class="map-footer">
          <div class="inventory">
            <strong>Inventory</strong>
            ${rooms.map((room) => `<span class="${state.crystals.has(room.crystal) ? "collected" : ""}" style="--room:${room.colour}" title="${room.power}">${state.crystals.has(room.crystal) ? "◆" : room.number}</span>`).join("")}
          </div>
          <button type="button" class="success" data-action="exit" ${completedCount === rooms.length ? "" : "disabled"}>${state.finalComplete ? "Review Final Exit" : "Open Final Exit"}</button>
        </section>
        <div class="feedback map-feedback">Choose an unlocked room. Completed rooms can be replayed.</div>
      `;
      mapScreen.querySelectorAll("[data-room]").forEach((button) => button.addEventListener("click", () => openRoom(button.dataset.room, state.completed.has(button.dataset.room))));
      mapScreen.querySelector("[data-action='continue']").addEventListener("click", continueAdventure);
      mapScreen.querySelector("[data-action='exit']").addEventListener("click", openExit);
      localise(mapScreen);
    }

    function renderRoom(room, replay = false, completedView = false) {
      const data = state.roomData;
      roomScreen.innerHTML = `
        <section class="room ${room.id === "token" ? "room-bg-token" : room.id === "numbers" ? "room-bg-numbers" : room.id === "context" ? "room-bg-context" : room.id === "connections" ? "room-bg-connections" : room.id === "prediction" ? "room-bg-prediction" : ""}" style="--room:${room.colour}; --tilt:0deg">
          <div class="room-inner">
            <header class="room-head">
              <div class="room-objective">
                <span>Room ${room.number} · ${replay ? "Replay mode" : "Crystal hunt"}</span>
                <h1>${room.title}</h1>
                <p>${room.aim}</p>
              </div>
              <button type="button" class="secondary" data-action="map">Room Map</button>
            </header>
      ${completedView ? completionMarkup(room) : puzzleMarkup(room, data)}
          </div>
        </section>
      `;
      bindRoomEvents(room);
      localise(roomScreen);
    }

    function completionMarkup(room) {
      const activeTokenPuzzle = tokenRoomTeachingData();
      const activity = activeActivityData();
      const next = rooms[room.number];
      const powerLabel = state.language === "zh" ? ({ Tokens: "词元", Context: "上下文", Connections: "连接", Prediction: "预测", Patterns: "模式" }[room.power] || room.power) : room.power;
      const crystalName = state.language === "zh" ? `${powerLabel}水晶` : `${room.power} Crystal`;
      const crystalSrc = crystalAsset(room);
      const completionNote = room.id === "token"
        ? state.language === "zh"
          ? "正确！词元边界取决于分词器。不同分词器可能会用不同方式拆分同一段文字。"
          : "Correct! Token boundaries depend on the tokenizer. Different tokenizers may split the same text differently."
        : room.id === "numbers"
          ? activity.contextChamber.completion
        : room.id === "context"
          ? activity.connectionLab.completion
        : room.id === "connections"
          ? activity.predictionMachine.completion
        : room.id === "prediction"
          ? activity.patternWorkshop.completion
        : next
          ? `Door opened. Room ${next.number} is ready.`
          : "All rooms cleared. The final exit is ready.";
      const tokenMechanism = room.id === "token" ? `<p class="token-lock-accepts">The lock accepts the text as Token pieces.</p><div class="token-success-chain" aria-label="Text passes through the tokenizer and becomes Token pieces">
        <span><small>Text</small><b>${activeTokenPuzzle.challenge.targetWord}</b></span>
        <i aria-hidden="true">↓</i>
        <span><small>Tokenizer</small><b>Qwen2.5</b></span>
        <i aria-hidden="true">↓</i>
        <span class="token-success-pieces"><small>Token pieces</small><b>${activeTokenPuzzle.challenge.targetPieces.map((piece) => `[${piece}]`).join(" ")}</b></span>
      </div>` : "";
      const numbersMechanism = room.id === "numbers" ? `<div class="token-success-chain context-success-chain" aria-label="Tokens inside the current context window are available">
        <span><small>${activity.contextChamber.windowLabel}</small><b>${activity.contextChamber.insideWindow.join(" · ")}</b></span>
      </div>` : "";
      const predictionMechanism = room.id === "connections" ? `<div class="token-success-chain context-success-chain prediction-context-payoff" aria-label="${activity.predictionMachine.updatedContextLabel}">
        <span><small>${activity.predictionMachine.updatedContextLabel}</small><b>${activity.predictionMachine.updatedContext}</b></span>
      </div><p>${activity.predictionMachine.completionContinuation}</p>` : "";
      const patternMechanism = room.id === "prediction" ? `<div class="pattern-success-nodes" aria-label="Training examples lead through repeated small adjustments to learned patterns and later predictions">
        <span>Training examples</span><i>→</i><span>Small adjustments</span><i>→</i><span>Learned patterns</span><i>→</i><span>Later predictions</span>
      </div>` : "";
      return `<section class="completion">
        <div class="crystal-stage" aria-hidden="true">
          <img class="completion-crystal" src="${crystalSrc}" alt="">
        </div>
        <span class="clue">${state.language === "zh" ? `${crystalName}已收集` : `${crystalName} collected`}</span>
        <h2>${state.language === "zh" ? `${powerLabel}已恢复` : `${room.power} restored`}</h2>
        ${tokenMechanism}
        ${numbersMechanism}
        ${predictionMechanism}
        ${patternMechanism}
        <p>${completionNote}</p>
        <div>
          <button type="button" class="secondary" data-action="map">Room Map</button>
          <button type="button" data-action="replay">Replay</button>
          <button type="button" class="gold" data-action="next-room">${next ? `Enter Room ${next.number}` : "Open Final Exit"}</button>
        </div>
      </section>`;
    }

    function crystalAsset(room) {
      if (room.crystal === "token") return "/assets/img/final-challenge/crystals/crystal-fairness.png";
      const reusedArtwork = {
        numbers: "context",
        "connection-lab": "verification",
        context: "context",
        "prediction-machine": "prediction",
        connections: "verification",
        prediction: "patterns",
        training: "fairness"
      };
      return `/assets/img/final-challenge/crystals/crystal-${reusedArtwork[room.crystal] || room.crystal}.png`;
    }

    function finalCrystalColour(room) {
      return {
        token: "#ff5f9e",
        numbers: "#46d49b",
        "connection-lab": "#ff7655",
        "prediction-machine": "#ffd15a",
        prediction: "#6da9ff"
      }[room.crystal] || room.colour;
    }

    function finalCrystalLabel(room) {
      return room.crystal === "prediction" ? "Training" : room.power;
    }

    function localisedConceptLabel(label) {
      if (state.language !== "zh") return label;
      return ({ Training: "训练", Tokens: "词元", Context: "上下文", Connections: "连接", Prediction: "预测", Patterns: "模式", Repeat: "重复" }[label] || label);
    }

    function puzzleMarkup(room, data) {
      if (room.id === "token") return tokenPuzzle(data);
      if (room.id === "numbers") return contextChamberPuzzle(data);
      if (room.id === "context") return contextWindowPuzzle(data);
      if (room.id === "connections") return connectionsPuzzle(data);
      if (room.id === "prediction") return patternWorkshopPuzzle(data);
      if (room.id === "training") return trainingLoopPuzzle(data);
      return "";
    }

    function stepStrip(steps, currentIndex) {
      return `<div class="step-strip" aria-label="Room steps">${steps.map((step, index) => {
        const stateClass = index < currentIndex ? "done" : index === currentIndex ? "current" : "";
        return `<div class="step-pill ${stateClass}"><span>${index < currentIndex ? "✓" : index + 1}</span><span>${step}</span></div>`;
      }).join("")}</div>`;
    }

    function numbersIcon(name) {
      const paths = {
        lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
        brain: '<path d="M9.5 4.5A3 3 0 0 0 6.5 7v.7A3.5 3.5 0 0 0 5 14.3V16a4 4 0 0 0 4 4h1V5.5a1 1 0 0 0-.5-1Z"/><path d="M14.5 4.5a3 3 0 0 1 3 2.5v.7a3.5 3.5 0 0 1 1.5 6.6V16a4 4 0 0 1-4 4h-1V5.5a1 1 0 0 1 .5-1Z"/>',
        search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
        dice: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 8h.01M16 8h.01M8 16h.01M16 16h.01M12 12h.01"/>'
      };
      return `<svg class="numbers-lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]}</svg>`;
    }

    function contextIcon(name) {
      const paths = {
        umbrella: '<path d="M22 12a10.06 10.06 0 0 0-20 0Z"/><path d="M12 12v8a2 2 0 0 0 4 0"/><path d="M12 2v1"/>',
        cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9Z"/>',
        eye: '<path d="M2.06 12.35a1 1 0 0 1 0-.7C3.73 7.6 7.6 5 12 5c4.4 0 8.27 2.6 9.94 6.65a1 1 0 0 1 0 .7C20.27 16.4 16.4 19 12 19c-4.4 0-8.27-2.6-9.94-6.65Z"/><circle cx="12" cy="12" r="3"/>',
        arrow: '<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>'
      };
      return `<svg class="context-lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]}</svg>`;
    }

    function guide(text, extra = "") {
      return `<aside class="guide-panel">
        <img src="/assets/img/final-challenge/room1/guide-robot.png" alt="Guide robot">
        <h2>Next clue</h2>
        <p>${text}</p>
        ${extra}
      </aside>`;
    }

    function tokenPuzzle(data) {
      const step = !data.inspected ? 0 : !data.tokenised ? 1 : 2;
      const puzzle = tokenRoomTeachingData();
      const example = puzzle.example;
      const challenge = puzzle.challenge;
      const selectedOption = challenge.options.find((option) => option.id === data.selectedOption);
      const comparison = data.submitted && selectedOption ? `<div class="token-comparison" aria-live="polite">
        <div><small>Your idea</small><div>${selectedOption.pieces.map((piece) => `<span>${piece}</span>`).join("")}</div></div>
        <b aria-hidden="true">${state.language === "zh" ? "对比" : "vs"}</b>
        <div><small>Tokenizer split</small><div>${challenge.targetPieces.map((piece) => `<span>${piece}</span>`).join("")}</div><em>${puzzle.copy.comparisonNote}</em></div>
      </div>` : "";
      return `<div class="room-body">
        <section class="puzzle-board">
          ${stepStrip(["Inspect door", "See verified split", "Choose the matching split"], step)}
          <span class="clue">Verified Qwen2.5 tokenizer</span>
          <div class="door-zone">
            <strong>The lock receives text as token pieces, not one whole block.</strong>
            ${!data.inspected ? `<button type="button" class="gold" data-action="inspect">Inspect door</button>` : !data.tokenised ? `<button type="button" data-action="tokenise">Activate tokeniser</button>` : `
              <div class="tokeniser-device">
                <img src="/assets/img/final-challenge/room1/tokeniser-machine.png" alt="">
                <div>
                  <strong>Verified example</strong>
                  <p>Here is how the tokenizer used in LLM Explorer splits <b>${example.text}</b></p>
                  <div class="output-tokens">${example.pieces.map((piece) => `<span class="token example-token">${piece}</span>`).join("")}</div>
                  <p>Different tokenizers may split the same text differently.</p>
                </div>
              </div>
              <div class="token-split-challenge">
                <span class="token-question-badge">Lock question</span>
                <h2>${puzzle.copy.question}</h2>
                <p class="token-target-sentence">${state.language === "zh" ? `<mark>${challenge.sentence}</mark>` : `The reader found an <mark>${challenge.targetWord}</mark> clue.`}</p>
                <p>${puzzle.copy.instruction}</p>
                <div class="token-split-options" role="group" aria-label="${puzzle.copy.optionAriaLabel}">${challenge.options.map((option, index) => `<button type="button" class="token-split-option ${data.selectedOption === option.id ? "selected" : ""}" data-token-option="${option.id}" aria-pressed="${data.selectedOption === option.id}"><small>${puzzle.copy.optionLabel} ${String.fromCharCode(65 + index)}</small><span>${option.statement ? `<strong>${option.statement}</strong>` : option.pieces.map((piece) => `<b>${piece}</b>`).join("")}</span></button>`).join("")}</div>
                ${comparison}
                ${data.showHint ? `<p class="token-hint" role="status">${puzzle.copy.hint}</p>` : ""}
                <div class="token-room-actions"><button type="button" data-action="check" ${data.selectedOption ? "" : "disabled"}>Activate lock</button><button type="button" class="secondary" data-action="token-hint">${data.showHint ? "Hide hint" : "Show hint"}</button><button type="button" class="secondary" data-action="reset-room">Reset room</button></div>
              </div>
            `}
          </div>
          <div class="feedback ${data.feedbackKind === "good" ? "good" : data.feedbackKind === "bad" ? "bad" : ""}" role="status" aria-live="polite">${roomFeedback(data, "feedback.tokenDefault")}</div>
        </section>
        ${guide(step === 0 ? "Start by checking the door." : step === 1 ? "Run the machine to see a verified tokenizer example." : "Compare the three splits, choose one, then activate the lock. The exact boundaries come from this tokenizer.")}
      </div>`;
    }

    function numbersPuzzle(data) {
      const teaching = numbersRoomTeachingData;
      const scene = !data.drawerOpened ? 1 : !data.showConcept ? 2 : 3;
      const feedbackClass = data.feedbackKind === "good" ? "good" : data.feedbackKind === "bad" ? "bad" : "";
      const sceneDots = `<div class="numbers-scene-progress" aria-label="Scene ${scene} of 3"><b>${scene} / 3</b><span class="active"></span><span class="${scene >= 2 ? "active" : ""}"></span><span class="${scene >= 3 ? "active" : ""}"></span></div>`;
      const lookupPath = `<div class="numbers-simple-path" aria-label="Token reader has ID 305">
        <div class="numbers-object token-object"><small>Token</small><strong>${teaching.token}</strong></div>
        <span aria-hidden="true">↓</span>
        <div class="numbers-id-with-guide"><div class="numbers-object id-object"><small>Lookup ID</small><strong>${teaching.tokenId}</strong></div><img class="numbers-path-robot" src="/assets/img/final-challenge/room1/guide-robot.png" alt="Guide robot holding the lookup ID"></div>
      </div>`;

      if (scene === 1) {
        return `<div class="numbers-scene-wrap">
          <section class="numbers-scene-card numbers-find-scene">
            ${sceneDots}
            <span class="clue">From the Token Workshop</span>
            <h2>Where does <q>${teaching.token}</q> go?</h2>
            <p>The tokenizer made the Token <b>${teaching.token}</b>. Now follow its ID.</p>
            ${lookupPath}
            <h3>Find drawer ${teaching.tokenId}.</h3>
            <div class="numbers-drawers numbers-drawers-scene" role="group" aria-label="Choose drawer 305">
              ${teaching.drawers.map((drawer) => {
                const isWrong = String(drawer) === String(data.selectedDrawer) && drawer !== teaching.tokenId;
                return `<button type="button" class="numbers-drawer ${isWrong ? "wrong" : ""}" data-number-drawer="${drawer}" aria-pressed="${String(drawer) === String(data.selectedDrawer)}">${numbersIcon("lock")}<small>Drawer</small><strong>${drawer}</strong><span>${isWrong ? "Try another number" : "Open"}</span></button>`;
              }).join("")}
            </div>
            ${data.feedbackKind === "bad" ? `<div class="numbers-robot-nudge" role="status" aria-live="polite"><img src="/assets/img/final-challenge/room1/guide-robot.png" alt="Guide robot"><p>Look at the number on the ID card. Find the drawer with the same number.</p></div>` : ""}
          </section>
        </div>`;
      }

      if (scene === 2) {
        return `<div class="numbers-scene-wrap">
          <section class="numbers-scene-card numbers-reveal-scene">
            ${sceneDots}
            <span class="clue">Drawer matched</span>
            <h2>Drawer ${teaching.tokenId} opens</h2>
            <div class="numbers-reveal-layout">
              <div class="numbers-complete-path" aria-label="Token reader uses ID 305 to find a learned number row">
                ${lookupPath}
                <span class="numbers-down-arrow" aria-hidden="true">↓</span>
                <div class="numbers-open-drawer">
                  <div><small>Drawer</small><strong>${teaching.tokenId}</strong></div>
                  <div class="numbers-values" aria-label="Illustrative learned number row">${teaching.illustrativeRow.map((value) => `<b>${value}</b>`).join("")}</div>
                </div>
              </div>
              <aside class="numbers-robot-bubble">
                <img src="/assets/img/final-challenge/room1/guide-robot.png" alt="Guide robot">
                <p><b>305 did not create these numbers.</b><br>It only told the model where to find them.</p>
              </aside>
            </div>
            <p class="numbers-row-use">The model uses this learned number row in later calculations.</p>
            <p class="numbers-tiny-accuracy">Simplified teaching row — real models use much larger learned representations.</p>
            <button type="button" class="numbers-continue" data-action="continue-number-lookup">Continue</button>
          </section>
        </div>`;
      }

      return `<div class="numbers-scene-wrap">
        <section class="numbers-scene-card numbers-check-scene">
          ${sceneDots}
          <span class="clue">Final lock</span>
          <h2>What did ID ${teaching.tokenId} actually do?</h2>
          <div class="numbers-short-choices" role="radiogroup" aria-label="Choose what token ID 305 does">
            ${teaching.concepts.map((concept) => {
              const icon = concept.id === "meaning" ? "brain" : concept.id === "lookup-label" ? "search" : "dice";
              const shortLabel = concept.id === "meaning" ? "Stores the meaning" : concept.id === "lookup-label" ? "Finds the number row" : "Shows probability";
              const selected = data.selectedConcept === concept.id;
              return `<button type="button" role="radio" aria-checked="${selected}" class="numbers-short-choice ${selected ? "selected" : ""} ${data.conceptPassed && concept.id === teaching.correctConceptId ? "correct" : ""}" data-number-concept="${concept.id}">${numbersIcon(icon)}<strong>${shortLabel}</strong></button>`;
            }).join("")}
          </div>
          <div class="numbers-final-feedback ${feedbackClass}" role="status" aria-live="polite">${roomFeedback(data, "feedback.numbersDefault")}</div>
          ${data.conceptPassed ? `<div class="numbers-crystal-ready"><strong>Numbers Crystal ready</strong><p>Exactly — an ID is a lookup label.</p><button type="button" class="numbers-collect" data-action="check">Collect the Numbers Crystal</button></div>` : ""}
        </section>
      </div>`;
    }

    function contextChamberPuzzle(data) {
      const step = !data.inspected ? 0 : !data.scannerActive ? 1 : 2;
      const activity = activeActivityData();
      const teaching = activity.contextChamber;
      const beforeWindow = teaching.beforeWindow;
      const insideWindow = teaching.insideWindow;
      const afterWindow = teaching.afterWindow;
      const options = [
        { id: "inside", tokens: insideWindow },
        { id: "before", tokens: beforeWindow },
        { id: "almost", tokens: teaching.almostWindow },
        { id: "all", tokens: [...beforeWindow, ...insideWindow, ...afterWindow], label: teaching.entireSentenceLabel }
      ];
      const feedbackClass = data.feedbackKind === "good" ? "good" : data.feedbackKind === "bad" ? "bad" : "";
      const token = (value, extra = "") => `<span class="context-chamber-token ${extra}">${value}</span>`;
      const optionMarkup = options.map((option, index) => {
        const selected = data.selectedOption === option.id;
        const submittedState = data.submitted && selected ? (option.id === teaching.correctOptionId ? "correct" : "wrong") : "";
        return `<button type="button" class="context-lock-option ${selected ? "selected" : ""} ${submittedState}" data-context-option="${option.id}" aria-pressed="${selected}">
          <small>${activity.optionLabel} ${String.fromCharCode(65 + index)}</small>
          <span class="context-lock-option-chips">${option.label ? `<b>${option.label}</b>` : option.tokens.map((item) => `<b>${item}</b>`).join("")}</span>
        </button>`;
      }).join("");
      const scanner = data.scannerActive ? `<div class="context-chamber-scanner" aria-label="${teaching.windowAria}">
        <div class="context-chamber-sequence">
          <div class="context-chamber-outside">${beforeWindow.map((item) => token(item, "outside")).join("")}</div>
          <div class="context-chamber-window">
            <span class="context-chamber-window-label">${teaching.windowLabel}</span>
            <div>${insideWindow.map((item) => token(item, "inside")).join("")}</div>
          </div>
          <div class="context-chamber-outside">${afterWindow.map((item) => token(item, "outside")).join("")}</div>
        </div>
        <div class="context-chamber-legend" aria-label="${teaching.legendAria}">
          <span>${teaching.insideLegend}</span>
          <span>${teaching.outsideLegend}</span>
        </div>
      </div>` : "";
      const lock = data.scannerActive ? `<section class="context-lock-question">
        <span class="token-question-badge">Lock question</span>
        <h2>${teaching.question}</h2>
        <p>${teaching.instruction}</p>
        <div class="context-lock-options" role="group" aria-label="${teaching.optionsAria}">${optionMarkup}</div>
        ${data.showHint ? `<p class="context-lock-hint" role="status">${teaching.hint}</p>` : ""}
        <div class="token-room-actions"><button type="button" data-action="check" ${data.selectedOption ? "" : "disabled"}>Unlock context door</button><button type="button" class="secondary" data-action="context-hint">${data.showHint ? "Hide hint" : "Show hint"}</button><button type="button" class="secondary" data-action="reset-room">Reset room</button></div>
      </section>` : "";
      const consoleState = !data.inspected
        ? `<div class="context-console-state"><span class="context-console-orb" aria-hidden="true"></span><strong>Door scanner offline</strong><p>The console is waiting for an inspection.</p><button type="button" class="gold" data-action="inspect-context">Inspect console</button></div>`
        : !data.scannerActive

    function checkRoom(room) {
      const data = state.roomData;
      if (room.id === "token") {
        const activeTokenPuzzle = tokenRoomTeachingData();
        if (!data.selectedOption) {
          setRoomFeedback(data, "feedback.tokenChoose", "bad");
        } else if (data.selectedOption === activeTokenPuzzle.challenge.correctOptionId) {
          return roomComplete(room);
        } else {
          data.submitted = true;
          data.attempts += 1;
          setRoomFeedback(data, "feedback.tokenIncorrect", "bad");
        }
      }
      if (room.id === "numbers") {
        const teaching = activeActivityData().contextChamber;
        if (!data.scannerActive) {
          setRoomFeedback(data, "feedback.contextNeedScanner", "bad");
        } else if (!data.selectedOption) {
          setRoomFeedback(data, "feedback.contextChoose", "bad");
        } else if (data.selectedOption === teaching.correctOptionId) {
          return roomComplete(room);
        } else {
          data.submitted = true;
          data.attempts += 1;
          setRoomFeedback(data, "feedback.contextIncorrect", "bad");
        }
      }
      if (room.id === "context") {
        const teaching = activeActivityData().connectionLab;
        if (!data.scannerActive) {
          setRoomFeedback(data, "feedback.connectionNeedScanner", "bad");
        } else if (!data.selectedOption) {
          setRoomFeedback(data, "feedback.connectionChoose", "bad");
        } else if (data.selectedOption === teaching.correctOptionId) {
          return roomComplete(room);
        } else {
          data.submitted = true;
          data.attempts += 1;
          setRoomFeedback(data, "feedback.connectionIncorrect", "bad");
        }
      }
      if (room.id === "connections") {
        const teaching = activeActivityData().predictionMachine;
        if (!data.machineRan) {
          setRoomFeedback(data, "feedback.predictionNeedMachine", "bad");
        } else if (data.selectedOption === "") {
          setRoomFeedback(data, "feedback.predictionChoose", "bad");
        } else if (data.selectedOption === teaching.correctOptionId) {
          data.correctSolved = true;
          setRoomFeedback(data, "feedback.predictionCorrect", "good");
          renderRoom(room);
          return roomComplete(room);
        } else {
          data.submitted = true;
          data.attempts += 1;
          setRoomFeedback(data, "feedback.predictionIncorrect", "bad");
        }
      }
      if (room.id === "prediction") {
        const teaching = activeActivityData().patternWorkshop;
        if (!data.predictionRevealed) {
          setRoomFeedback(data, "feedback.patternNeedPrediction", "bad");
        } else if (data.selectedOption === "") {
          setRoomFeedback(data, "feedback.patternChoose", "bad");
        } else if (data.selectedOption === teaching.correctOptionId) {
          setRoomFeedback(data, "feedback.patternCorrect", "good");
          return roomComplete(room);
        } else {
          data.submitted = true;
          data.attempts += 1;
          setRoomFeedback(data, "feedback.patternIncorrect", "bad");
        }
      }
      if (room.id === "training") {
        if (data.step >= 5) return roomComplete(room);
        data.feedback = "Complete each part of the training loop before collecting the crystal.";
      }
      renderRoom(room);
    }

          <section class="review-console">
            <h2>${consoleTitle}</h2>
            ${puzzleUnlocked ? "" : `<p>${consoleInstruction}</p><div class="exit-guide">${fusionActive ? "The five crystal energies are combining. The Final Lock will activate when the final crystal forms." : "Step 1: click or drag the crystal chips below to power the Language Model Door."}</div>`}
            ${!fused ? `<div class="crystal-tray" aria-label="Collected crystals">
              ${rooms.map((room) => {
                const collected = state.crystals.has(room.crystal);
                const placed = placedCrystals.has(room.crystal);
                const crystalLabel = localisedConceptLabel(finalCrystalLabel(room));
                return `<button type="button" class="crystal-token ${placed ? "placed" : ""}" style="--room:${finalCrystalColour(room)}" data-exit-crystal="${room.crystal}" draggable="${collected && !placed && state.exitStage === "placing" ? "true" : "false"}" ${collected && !state.finalComplete && state.exitStage === "placing" ? "" : "disabled"}>
                  ${collected ? `<img src="${crystalAsset(room)}" alt="">` : `<span>${room.number}</span>`}
                  <span>${crystalLabel}</span>
                </button>`;
              }).join("")}
            </div>` : ""}
            ${puzzleUnlocked ? `<div class="brain-puzzle">
                ${renderSequence("final", finalConceptTrayPieces, finalConceptOrder, conceptPlaced, "Rebuild the model's process", "Arrange the ideas to show how a language model gets from learning patterns to generating text. This is the model's process, not the order of the lessons you completed. Drag each card into slots 1–6. You can also click a card to fill the next empty slot, and click a filled slot to remove it.")}
                ${state.exitHint ? `<div class="exit-hint" role="status"><strong>Hint</strong> Training happened earlier, before use. During use, text becomes Tokens, available Context is processed, information is combined through Connections, one next Token is predicted, then the selected Token is added to the Context and the process repeats.</div>` : ""}
              </div>` : `<div class="final-lock-locked ${fusionActive ? "forming" : ""}" aria-live="polite"><strong>FINAL LOCK</strong><span>${fusionActive ? "Combining the five crystal energies..." : "Combine all five crystals to reveal the last challenge."}</span></div>`}
            <div class="exit-actions">
              <button type="button" class="secondary" data-action="map">Room Map</button>
              ${!exitComplete && puzzleUnlocked ? `<button type="button" class="ghost-reset" data-action="clear-final" ${hasPlacedCards ? "" : "disabled"}>Reset cards</button>` : ""}
              ${!exitComplete && puzzleUnlocked ? `<button type="button" class="secondary" data-action="hint-final">${state.exitHint ? "Hide hint" : "Show hint"}</button>` : ""}
              ${exitComplete ? `<button type="button" class="gold" data-action="replay-final">Replay final puzzle</button>` : ""}
              <button type="button" class="success" data-action="complete" ${canTryFinal && !exitComplete ? "" : "disabled"}>${exitComplete ? "Exit is open" : "Solve Final Lock"}</button>
            </div>
          </section>
        </div>
        <div class="feedback ${finalReady || state.finalComplete ? "good" : "bad"}">${state.finalComplete ? message("exit.complete") : exitFeedback() || (finalReady ? message("exit.ready") : fusionActive ? message("exit.forming") : puzzleUnlocked ? message("exit.orderPrompt") : allDone ? message("exit.placePrompt") : message("exit.needsCrystals"))}</div>
      </section>`;
      localise(exitScreen);
      if (fusionActive) startFinalFusion();
      exitScreen.querySelector("[data-action='map']").addEventListener("click", openMap);
      const replayButton = exitScreen.querySelector("[data-action='replay-final']");
      if (replayButton) replayButton.addEventListener("click", () => {
        state.finalComplete = false;
        resetFinalFusion();
        state.exitPlaced = new Set();
        state.exitOrder = [];
        state.exitHint = false;
        setExitFeedback("exit.reset");
        renderExit();
      });
      const clearButton = exitScreen.querySelector("[data-action='clear-final']");
      if (clearButton) clearButton.addEventListener("click", () => {
        state.exitOrder = [];
        setExitFeedback("exit.cardsCleared");
        renderExit();
      });
      const hintButton = exitScreen.querySelector("[data-action='hint-final']");
      if (hintButton) hintButton.addEventListener("click", () => {
        state.exitHint = !state.exitHint;
        renderExit();
      });
      const updatePlacedCrystals = (crystal, removePlaced = false) => {
        if (!allDone || state.finalComplete || state.exitStage !== "placing") return;
        if (removePlaced && state.exitPlaced.has(crystal)) state.exitPlaced.delete(crystal);
        else state.exitPlaced.add(crystal);
        if (state.exitPlaced.size === rooms.length && state.exitStage === "placing") {
          state.exitStage = "fusing";
        }
        setExitFeedback(state.exitPlaced.size === rooms.length ? "exit.fusionStarted" : "exit.placedProgress", { count: state.exitPlaced.size, total: rooms.length });
        if (!state.exitPlaced.size) {
          state.exitOrder = [];
        }
        renderExit();
      };
      exitScreen.querySelectorAll("[data-exit-crystal]").forEach((button) => {
        button.addEventListener("click", () => updatePlacedCrystals(button.dataset.exitCrystal, true));
        button.addEventListener("dragstart", (event) => {
          if (button.getAttribute("draggable") !== "true" || !event.dataTransfer) {
            event.preventDefault();
            return;
          }
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("application/x-ai-crystal", button.dataset.exitCrystal);
          event.dataTransfer.setData("text/plain", button.dataset.exitCrystal);
        });
      });
      exitScreen.querySelectorAll("[data-exit-crystal-slot]").forEach((slot) => {
        slot.addEventListener("dragover", (event) => {
          if (state.exitStage !== "placing") return;
          event.preventDefault();
          if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
          slot.classList.add("drop-ready");
        });
        slot.addEventListener("dragleave", () => slot.classList.remove("drop-ready"));
        slot.addEventListener("drop", (event) => {
          event.preventDefault();
          slot.classList.remove("drop-ready");
          const crystal = event.dataTransfer?.getData("application/x-ai-crystal") || event.dataTransfer?.getData("text/plain");
          if (rooms.some((room) => room.crystal === crystal)) updatePlacedCrystals(crystal);
        });
      });

      const exitTarget = () => state.exitOrder;
      const exitLimit = () => finalConceptOrder.length;
      const placeExitPiece = (kind, piece, requestedIndex = null, fromIndex = null) => {
        if (!puzzleUnlocked || state.finalComplete) return;
        const target = exitTarget(kind);
        const limit = exitLimit(kind);
        const safeIndex = (value) => {
          if (value === null || value === undefined || value === "") return null;
          const index = Number(value);
          return Number.isInteger(index) && index >= 0 && index < limit ? index : null;
        };
        const destination = safeIndex(requestedIndex);
        const source = safeIndex(fromIndex);

        if (source === null && target.includes(piece)) return;
        if (source !== null && target[source] !== piece) return;

        if (destination !== null) {
          if (source === destination) return;
          if (source === null && target[destination]) {
            setExitFeedback("exit.slotOccupied");
            renderExit();
            return;
          }
          const displaced = target[destination];
          target[destination] = piece;
          if (source !== null) target[source] = displaced;
        } else {
          const emptyIndex = Array.from({ length: limit }, (_, index) => index).find((index) => !target[index]);
          if (emptyIndex === undefined) return;
          if (source !== null) target[source] = undefined;
          target[emptyIndex] = piece;
        }

        setExitFeedback(Array.from({ length: limit }, (_, index) => target[index]).filter(Boolean).length === limit ? "exit.slotsFull" : "exit.cardPlaced");
        renderExit();
      };

      const readExitDragPayload = (event) => {
        const transfer = event.dataTransfer;
        const json = transfer?.getData("application/x-ai-exit-piece");
        if (json) {
          try {
            const payload = JSON.parse(json);
            if (payload.kind && payload.piece) {
              return {
                kind: payload.kind,
                piece: payload.piece,
                fromIndex: payload.fromIndex === null || payload.fromIndex === undefined ? null : Number(payload.fromIndex)
              };
            }
          } catch (error) {
            // Fall back to text/plain below.
          }
        }
        const raw = transfer?.getData("text/plain") || "";
        const [kind, piece, fromIndex] = raw.split(":");
        if (!kind || !piece) {
          return activeExitDrag?.kind && activeExitDrag?.piece
            ? {
                kind: activeExitDrag.kind,
                piece: activeExitDrag.piece,
                fromIndex: activeExitDrag.fromIndex === null || activeExitDrag.fromIndex === undefined
                  ? null
                  : Number(activeExitDrag.fromIndex)
              }
            : null;
        }
        return { kind, piece, fromIndex: fromIndex === "" || fromIndex === undefined ? null : Number(fromIndex) };
      };

      const handleExitDrop = (event, boardKind, requestedIndex = null, visualTarget = null) => {
        if (state.finalComplete) return;
        event.preventDefault();
        event.stopPropagation();
        exitScreen.querySelectorAll(".drop-ready, .drop-error").forEach((node) => node.classList.remove("drop-ready", "drop-error"));
        const payload = readExitDragPayload(event);
        activeExitDrag = null;
        if (!payload) {
          setExitFeedback("exit.unreadableCard");
          renderExit();
          return;
        }
        if (payload.kind !== boardKind) {
          if (visualTarget) visualTarget.classList.add("drop-error");
          setExitFeedback("exit.wrongDropArea");
          renderExit();
          return;
        }
        placeExitPiece(boardKind, payload.piece, requestedIndex, payload.fromIndex);
      };

      const writeExitDragPayload = (event, payload, label) => {
        if (!event.dataTransfer) return;
        activeExitDrag = payload;
        event.dataTransfer.effectAllowed = "move";
        const serialised = JSON.stringify(payload);
        event.dataTransfer.setData("application/x-ai-exit-piece", serialised);
        event.dataTransfer.setData("text/plain", `${payload.kind}:${payload.piece}:${payload.fromIndex ?? ""}`);

        const dragImage = document.createElement("div");
        dragImage.className = "sequence-drag-ghost";
        dragImage.textContent = label;
        dragImage.style.left = "-1000px";
        dragImage.style.top = "-1000px";
        document.body.appendChild(dragImage);
        event.dataTransfer.setDragImage(dragImage, 30, 24);
        window.setTimeout(() => dragImage.remove(), 0);
      };

      const showNativeDropTarget = (event, boardKind, visualTarget) => {
        if (state.finalComplete) return;
        const payload = activeExitDrag || readExitDragPayload(event);
        if (!payload) return;
        event.preventDefault();
        event.stopPropagation();
        if (event.dataTransfer) event.dataTransfer.dropEffect = payload.kind === boardKind ? "move" : "none";
        clearExitDropHighlights();
        visualTarget.classList.add(payload.kind === boardKind ? "drop-ready" : "drop-error");
      };

      const clearExitDropHighlights = () => {
        exitScreen.querySelectorAll(".drop-ready, .drop-error").forEach((node) => node.classList.remove("drop-ready", "drop-error"));
      };

      const pointInside = (rect, clientX, clientY) => (
        clientX >= rect.left &&
        clientX <= rect.right &&
        clientY >= rect.top &&
        clientY <= rect.bottom
      );

      const findExitDropTarget = (clientX, clientY, preferredKind = null) => {
        const allSlots = Array.from(exitScreen.querySelectorAll("[data-exit-slot]"));
        const slots = preferredKind
          ? allSlots.filter((slot) => slot.dataset.exitSlot === preferredKind)
          : allSlots;
        const allBoards = Array.from(exitScreen.querySelectorAll(".sequence-board"));
        const boards = preferredKind
          ? allBoards.filter((board) => board.querySelector(`[data-exit-slot="${preferredKind}"]`))
          : allBoards;

        const targetForSlot = (slot) => ({
          kind: slot.dataset.exitSlot,
          index: Number(slot.dataset.index),
          element: slot
        });

        const targetForBoard = (board) => {
          const selector = preferredKind ? `[data-exit-slot="${preferredKind}"]` : "[data-exit-slot]";
          const firstSlot = board.querySelector(selector);
          return firstSlot ? {
            kind: firstSlot.dataset.exitSlot,
            index: null,
            element: board
          } : null;
        };

        const distanceToRect = (rect) => {
          const x = Math.max(rect.left, Math.min(clientX, rect.right));
          const y = Math.max(rect.top, Math.min(clientY, rect.bottom));
          return Math.hypot(clientX - x, clientY - y);
        };

        const directSlot = slots.find((slot) => pointInside(slot.getBoundingClientRect(), clientX, clientY));
        if (directSlot) return targetForSlot(directSlot);

        const directBoard = boards.find((board) => pointInside(board.getBoundingClientRect(), clientX, clientY));
        if (directBoard) return targetForBoard(directBoard);

        const elements = typeof document.elementsFromPoint === "function"
          ? document.elementsFromPoint(clientX, clientY)
          : [document.elementFromPoint(clientX, clientY)];
        for (const element of elements) {
          if (!element || element.classList?.contains("sequence-drag-ghost")) continue;
          const slot = element.closest?.("[data-exit-slot]");
          if (slot && exitScreen.contains(slot) && (!preferredKind || slot.dataset.exitSlot === preferredKind)) {
            return targetForSlot(slot);
          }
          const board = element.closest?.(".sequence-board");
          if (board && exitScreen.contains(board)) {
            const boardTarget = targetForBoard(board);
            if (boardTarget) return boardTarget;
          }
        }

        let nearestSlot = null;
        slots.forEach((slot) => {
          const distance = distanceToRect(slot.getBoundingClientRect());
          if (distance <= 140 && (!nearestSlot || distance < nearestSlot.distance)) {
            nearestSlot = { slot, distance };
          }
        });
        if (nearestSlot) return targetForSlot(nearestSlot.slot);

        let nearestBoard = null;
        boards.forEach((board) => {
          const distance = distanceToRect(board.getBoundingClientRect());
          if (distance <= 180 && (!nearestBoard || distance < nearestBoard.distance)) {
            nearestBoard = { board, distance };
          }
        });
        if (nearestBoard) return targetForBoard(nearestBoard.board);

        return null;
      };

      const highlightExitPointerTarget = (clientX, clientY, payload) => {
        clearExitDropHighlights();
        const target = findExitDropTarget(clientX, clientY, payload?.kind || null);
        lastExitPointerTarget = target;
        if (!target || !payload) return null;
        target.element.classList.add(target.kind === payload.kind ? "drop-ready" : "drop-error");
        return target;
      };

      const startExitPointerDrag = (event, payload, label, sourceElement) => {
        if (!puzzleUnlocked || state.finalComplete || sourceElement.disabled) return;
        if (event.button !== undefined && event.button !== 0) return;

        event.preventDefault();
        sourceElement.classList.add("dragging");
        activeExitDrag = payload;
        lastExitPointerTarget = null;

	      const startX = event.clientX;
	      const startY = event.clientY;
	      let moved = false;
	      let finished = false;
	      let lastPoint = { clientX: startX, clientY: startY };
	      try {
	        sourceElement.setPointerCapture?.(event.pointerId);
	      } catch (error) {
	        // Pointer capture is a reliability helper. Dragging still works without it.
	      }
	      const ghost = document.createElement("div");
        ghost.className = "sequence-drag-ghost";
        ghost.textContent = label;
        document.body.appendChild(ghost);

        const moveGhost = (clientX, clientY) => {
          ghost.style.left = `${clientX}px`;
          ghost.style.top = `${clientY}px`;
        };

        const finish = (dropEvent, cancelled = false) => {
          if (finished) return;
          finished = true;
          dropEvent.preventDefault?.();
          dropEvent.stopPropagation?.();
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp, true);
          window.removeEventListener("pointercancel", onCancel, true);
          document.removeEventListener("pointerup", onUp, true);
          document.removeEventListener("pointercancel", onCancel, true);
	          try {
	            sourceElement.releasePointerCapture?.(dropEvent.pointerId);
	          } catch (error) {
	            // The pointer may already be released by the browser.
	          }
	          sourceElement.classList.remove("dragging");
          const rememberedTarget = lastExitPointerTarget;
          ghost.remove();
          clearExitDropHighlights();

          if (cancelled) {
            activeExitDrag = null;
            lastExitPointerTarget = null;
            return;
          }

          const finalX = Number.isFinite(dropEvent.clientX) ? dropEvent.clientX : lastPoint.clientX;
          const finalY = Number.isFinite(dropEvent.clientY) ? dropEvent.clientY : lastPoint.clientY;
          const distance = Math.hypot(finalX - startX, finalY - startY);
          if (!moved || distance < 8) {
            suppressExitClick = true;
            window.setTimeout(() => { suppressExitClick = false; }, 0);
            if (payload.fromIndex === null || payload.fromIndex === undefined) {
              placeExitPiece(payload.kind, payload.piece);
            } else {
              const target = exitTarget(payload.kind);
              if (target[payload.fromIndex] === payload.piece) {
                target[payload.fromIndex] = undefined;
                setExitFeedback("exit.cardRemoved");
                renderExit();
              }
            }
            activeExitDrag = null;
            lastExitPointerTarget = null;
            return;
          }

          suppressExitClick = true;
          window.setTimeout(() => { suppressExitClick = false; }, 0);
          const target = rememberedTarget || findExitDropTarget(finalX, finalY, payload.kind);
          activeExitDrag = null;
          lastExitPointerTarget = null;
          if (!target) {
            setExitFeedback("exit.dropOnSlot");
            renderExit();
            return;
          }
          if (target.kind !== payload.kind) {
            setExitFeedback("exit.wrongDropArea");
            renderExit();
            return;
          }
          placeExitPiece(target.kind, payload.piece, target.index, payload.fromIndex);
        };

        const onMove = (moveEvent) => {
          moveEvent.preventDefault();
          moved = true;
          lastPoint = { clientX: moveEvent.clientX, clientY: moveEvent.clientY };
          moveGhost(moveEvent.clientX, moveEvent.clientY);
          highlightExitPointerTarget(moveEvent.clientX, moveEvent.clientY, payload);
        };
        const onUp = (upEvent) => finish(upEvent);
        const onCancel = (cancelEvent) => finish(cancelEvent, true);

        moveGhost(startX, startY);
        window.addEventListener("pointermove", onMove, { passive: false });
        window.addEventListener("pointerup", onUp, { capture: true });
        window.addEventListener("pointercancel", onCancel, { capture: true });
        document.addEventListener("pointerup", onUp, { capture: true });
        document.addEventListener("pointercancel", onCancel, { capture: true });
      };

      exitScreen.querySelectorAll("[data-exit-piece]").forEach((button) => {
        button.addEventListener("click", (event) => {
          if (suppressExitClick) {
            event.preventDefault();
            event.stopPropagation();
            return;
          }
          placeExitPiece(button.dataset.exitPiece, button.dataset.piece);
        });
        button.addEventListener("pointerdown", (event) => {
          startExitPointerDrag(
            event,
            { kind: button.dataset.exitPiece, piece: button.dataset.piece, fromIndex: null },
            button.textContent.trim(),
            button
          );
        });
        button.addEventListener("dragstart", (event) => {
          if (!puzzleUnlocked || state.finalComplete || button.disabled) {
            event.preventDefault();
            return;
          }
          writeExitDragPayload(
            event,
            { kind: button.dataset.exitPiece, piece: button.dataset.piece, fromIndex: null },
            button.textContent.trim()
          );
          button.classList.add("dragging");
        });
        button.addEventListener("dragend", () => {
          button.classList.remove("dragging");
          activeExitDrag = null;
          clearExitDropHighlights();
        });
      });

      exitScreen.querySelectorAll("[data-exit-slot]").forEach((button) => {
        button.addEventListener("click", (event) => {
          if (suppressExitClick) {
            event.preventDefault();
            event.stopPropagation();
            return;
          }
          if (state.finalComplete) return;
          const target = exitTarget(button.dataset.exitSlot);
          const index = Number(button.dataset.index);
          if (!target[index]) return;
          target[index] = undefined;
          setExitFeedback("exit.cardRemoved");
          renderExit();
        });
        button.addEventListener("pointerdown", (event) => {
          if (state.finalComplete) return;
          const target = exitTarget(button.dataset.exitSlot);
          const index = Number(button.dataset.index);
          const piece = target[index];
          if (!piece) return;
          startExitPointerDrag(
            event,
            { kind: button.dataset.exitSlot, piece, fromIndex: index },
            button.textContent.trim().replace(/^\d+\s*/, ""),
            button
          );
        });
        button.addEventListener("dragstart", (event) => {
          if (state.finalComplete || button.disabled) {
            event.preventDefault();
            return;
          }
          const target = exitTarget(button.dataset.exitSlot);
          const index = Number(button.dataset.index);
          const piece = target[index];
          if (!piece) {
            event.preventDefault();
            return;
          }
          writeExitDragPayload(
            event,
            { kind: button.dataset.exitSlot, piece, fromIndex: index },
            button.textContent.trim().replace(/^\d+\s*/, "")
          );
          button.classList.add("dragging");
        });
        button.addEventListener("dragend", () => {
          button.classList.remove("dragging");
          activeExitDrag = null;
          clearExitDropHighlights();
        });
        button.addEventListener("dragenter", (event) => showNativeDropTarget(event, button.dataset.exitSlot, button));
        button.addEventListener("dragover", (event) => showNativeDropTarget(event, button.dataset.exitSlot, button));
        button.addEventListener("dragleave", () => button.classList.remove("drop-ready", "drop-error"));
        button.addEventListener("drop", (event) => handleExitDrop(event, button.dataset.exitSlot, Number(button.dataset.index), button));
      });

      exitScreen.querySelectorAll(".sequence-board").forEach((board) => {
        const firstSlot = board.querySelector("[data-exit-slot]");
        const kind = firstSlot?.dataset.exitSlot;
        if (!kind) return;
        board.addEventListener("dragenter", (event) => showNativeDropTarget(event, kind, board));
        board.addEventListener("dragover", (event) => showNativeDropTarget(event, kind, board));
        board.addEventListener("dragleave", (event) => {
          if (!board.contains(event.relatedTarget)) board.classList.remove("drop-ready", "drop-error");
        });
        board.addEventListener("drop", (event) => handleExitDrop(event, kind, null, board));
      });

      exitScreen.querySelector("[data-action='complete']").addEventListener("click", () => {
        if (state.finalComplete) return;
        if (!puzzleUnlocked) {
          setExitFeedback(fusionActive ? "exit.waitFusion" : "exit.placeAllFirst");
          renderExit();
          return;
        }
        if (!conceptReady) {
          setExitFeedback("exit.fillSlots");
          renderExit();
          return;
        }
        if (!conceptCorrect) {
          setExitFeedback("exit.incorrectOrder");
          renderExit();
          return;
        }
        state.finalComplete = true;
        state.exitPlaced = new Set(rooms.map((room) => room.crystal));
        state.exitOrder = [...finalConceptOrder];
        setExitFeedback("");
        send("ESCAPE_ROOM_COMPLETE", {});
        renderExit();
        if (completionTimer) window.clearTimeout(completionTimer);
        const reducedMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;
        completionTimer = window.setTimeout(() => {
          completionTimer = null;
          openCompletion({ focus: true });
        }, reducedMotion ? 80 : 700);
      });
    }

    window.addEventListener("message", (event) => {
      if (event.origin !== targetOrigin) return;
      const data = event.data || {};
      if (data.payload?.progress) applyInit(data.payload.progress);
      if (data.type === "ESCAPE_ROOM_INIT") applyInit(data.payload || {});
      if (data.type === "ESCAPE_ROOM_REQUEST_STATE") {
        if (data.payload?.progress) applyInit(data.payload.progress);
        send("ESCAPE_ROOM_READY");
      }
      if (data.type === "ESCAPE_ROOM_OPEN_HUB" || data.type === "ESCAPE_ROOM_RETURN_TO_HUB") openMap();
      if (data.type === "ESCAPE_ROOM_CONTINUE") continueAdventure();
      if (data.type === "ESCAPE_ROOM_OPEN_FINAL_EXIT") openExit();
      if (data.type === "ESCAPE_ROOM_OPEN_ROOM" || data.type === "ESCAPE_ROOM_REPLAY_ROOM") openRoom(data.payload?.roomId || "token", Boolean(data.payload?.replay));
      if (data.type === "ESCAPE_ROOM_RESET") {
        if (completionTimer) window.clearTimeout(completionTimer);
        completionTimer = null;
        resetFinalFusion();
        state.completed.clear();
        state.crystals.clear();
        state.exitPlaced.clear();
        state.exitOrder = [];
        state.exitHint = false;
        setExitFeedback("");
        state.finalComplete = false;
        openMap();
      }
    });

    $("topMap").addEventListener("click", openMap);
    $("topContinue").addEventListener("click", continueAdventure);

    if (debug) {
      $("debugBanner").hidden = false;
      $("debugToggle").hidden = false;
      $("debugConsole").hidden = false;
      $("debugToggle").addEventListener("click", () => $("debugConsole").classList.toggle("open"));
      $("debugControls").innerHTML = rooms.map((room) => `<button type="button" data-debug-room="${room.id}">Complete R${room.number}</button>`).join("") + `<button type="button" data-debug-final>Final</button>`;
      $("debugControls").querySelectorAll("[data-debug-room]").forEach((button) => button.addEventListener("click", () => roomComplete(roomById(button.dataset.debugRoom))));
      $("debugControls").querySelector("[data-debug-final]").addEventListener("click", () => send("ESCAPE_ROOM_COMPLETE", {}));
    }

    const startRoom = searchParams.get("room");
    render();
    if (startRoom && roomById(startRoom)) openRoom(startRoom, true);
    send("ESCAPE_ROOM_READY");
  </script>
</body>
</html>
