                <small>+</small>
                <span>${piece.label}</span>
              </button>`;
            }).join("")}
          </div>
        </section>`;
      exitScreen.innerHTML = `<section class="exit ${exitComplete ? "review-mode" : ""}">
        <div>
          <span class="clue">Final Exit</span>
          <h1>${titleText}</h1>
          <p>${leadText}</p>
          <div class="exit-steps" aria-label="Final exit steps">
            <span class="${allPlaced ? "done" : "active"}">1. Place crystals</span>
            <span class="${modelCorrect ? "done" : allPlaced ? "active" : ""}">2. Build text generation</span>
            <span class="${reviewCorrect ? "done" : modelReady ? "active" : ""}">3. Add human checks</span>
          </div>
        </div>
        <div class="brain-door">
          <section class="brain-chamber" aria-label="AI Brain Door">
            <div class="brain-core ${allPlaced ? "charged" : ""} ${finalReady ? "ready" : ""}">
              <span>AI</span>
            </div>
            ${rooms.map((room) => {
              const placed = placedCrystals.has(room.crystal);
              return `<div class="brain-slot ${placed ? "filled" : ""}" style="--room:${room.colour}" aria-label="${room.power} slot">
                ${placed ? `<img src="${crystalAsset(room)}" alt="${room.power} crystal">` : `<span>${room.number}</span>`}
              </div>`;
            }).join("")}
            <div class="brain-status">${state.finalComplete ? "Door open" : finalReady ? "Ready to open" : allPlaced ? "Brain charged" : "Waiting for crystals"}</div>
          </section>
          <section class="review-console">
            <h2>${consoleTitle}</h2>
            <p>${consoleInstruction}</p>
            <div class="exit-guide ${exitComplete ? "complete" : ""}">
              ${exitComplete
                ? "Complete. You can look back at the mental model here, or replay it to practise the final puzzle again."
                : allPlaced
                  ? "Step 2: build how LLMs make text. Step 3: build what people should check after an answer appears."
                  : "Step 1: click the crystal chips below to power the AI Brain."}
            </div>
            <div class="crystal-tray" aria-label="Collected crystals">
              ${rooms.map((room) => {
                const collected = state.crystals.has(room.crystal);
                const placed = placedCrystals.has(room.crystal);
                return `<button type="button" class="crystal-token ${placed ? "placed" : ""}" style="--room:${room.colour}" data-exit-crystal="${room.crystal}" ${collected && !state.finalComplete ? "" : "disabled"}>
                  ${collected ? `<img src="${crystalAsset(room)}" alt="">` : `<span>${room.number}</span>`}
                  <span>${room.power}</span>
                </button>`;
              }).join("")}
            </div>
            <div class="brain-puzzle" ${allPlaced ? "" : "hidden"}>
              ${renderSequence("model", finalModelPieces, finalModelOrder, modelPlaced, "AI Brain sequence", "How does the model make text?")}
              ${renderSequence("review", finalReviewPieces, finalReviewOrder, reviewPlaced, "Human Review console", "What should people do after output appears?")}
            </div>
            <div class="exit-actions">
              <button type="button" class="secondary" data-action="map">Room Map</button>
              ${!exitComplete && allPlaced ? `<button type="button" class="ghost-reset" data-action="clear-final" ${hasPlacedCards ? "" : "disabled"}>Reset cards</button>` : ""}
              ${exitComplete ? `<button type="button" class="gold" data-action="replay-final">Replay final puzzle</button>` : ""}
              <button type="button" class="success" data-action="complete" ${canTryFinal && !exitComplete ? "" : "disabled"}>${exitComplete ? "Exit is open" : "Activate AI Brain"}</button>
            </div>
          </section>
        </div>
        <div class="feedback ${finalReady || state.finalComplete ? "good" : "bad"}">${state.finalComplete ? "LLMs generate text by predicting tokens from learned patterns. Their answers depend on training data and context, so they can be useful but also wrong or biased and should be checked critically." : state.exitFeedback || (finalReady ? "The AI Brain is ready. Activate it to open the exit." : allPlaced ? "Build both sequences, then activate the AI Brain." : allDone ? "Place all six crystals around the brain door." : "The exit needs every room's crystal.")}</div>
      </section>`;
      exitScreen.querySelector("[data-action='map']").addEventListener("click", openMap);
      const replayButton = exitScreen.querySelector("[data-action='replay-final']");
      if (replayButton) replayButton.addEventListener("click", () => {
        state.finalComplete = false;
        state.exitPlaced = new Set();
        state.exitModel = [];
        state.exitReview = [];
        state.exitFeedback = "Final lock reset. Place the six crystals, then rebuild the model.";
        renderExit();
      });
      const clearButton = exitScreen.querySelector("[data-action='clear-final']");
      if (clearButton) clearButton.addEventListener("click", () => {
        state.exitModel = [];
        state.exitReview = [];
        state.exitFeedback = "Cards cleared. Start with how the model makes text, then add the human checks.";
        renderExit();
      });
      exitScreen.querySelectorAll("[data-exit-crystal]").forEach((button) => button.addEventListener("click", () => {
        if (!allDone || state.finalComplete) return;
        const crystal = button.dataset.exitCrystal;
        if (state.exitPlaced.has(crystal)) state.exitPlaced.delete(crystal);
        else state.exitPlaced.add(crystal);
        state.exitFeedback = state.exitPlaced.size === rooms.length
          ? "All crystals are placed. Now build the text-generation chain and the human-check chain."
          : `${state.exitPlaced.size} / ${rooms.length} crystals placed. Keep powering the AI Brain.`;
        if (!state.exitPlaced.size) {
          state.exitModel = [];
          state.exitReview = [];
        }
        renderExit();
      }));

      const exitTarget = (kind) => kind === "review" ? state.exitReview : state.exitModel;
      const exitLimit = (kind) => kind === "review" ? finalReviewOrder.length : finalModelOrder.length;
      const placeExitPiece = (kind, piece, requestedIndex = null, fromIndex = null) => {
        if (!allPlaced || state.finalComplete) return;
        const target = exitTarget(kind);
        const limit = exitLimit(kind);
        const safeIndex = (value) => {
          const index = Number(value);
          return Number.isInteger(index) && index >= 0 && index < limit ? index : null;
        };
        const destination = safeIndex(requestedIndex);
        const source = safeIndex(fromIndex);

        if (source === null && target.includes(piece)) return;
        if (source !== null && target[source] !== piece) return;

        if (destination !== null) {
          if (source === destination) return;
          if (source === null && target[destination]) {
            state.exitFeedback = "That slot already has a card. Drag the card to swap, or choose an empty slot.";
            renderExit();
            return;
          }
          const displaced = target[destination];
          target[destination] = piece;
          if (source !== null) target[source] = displaced;
        } else {
          const emptyIndex = Array.from({ length: limit }, (_, index) => index).find((index) => !target[index]);
          if (emptyIndex === undefined) return;
          if (source !== null) target[source] = undefined;
          target[emptyIndex] = piece;
        }

        state.exitFeedback = Array.from({ length: limit }, (_, index) => target[index]).filter(Boolean).length === limit
          ? "This console is filled. Drag cards to change the order, or fill the other console."
          : "Card added to a slot. Keep filling the empty slots.";
        renderExit();
      };

      const readExitDragPayload = (event) => {
        const json = event.dataTransfer.getData("application/x-ai-exit-piece");
        if (json) {
          try {
            const payload = JSON.parse(json);
            if (payload.kind && payload.piece) {
              return {
                kind: payload.kind,
                piece: payload.piece,
                fromIndex: payload.fromIndex === null || payload.fromIndex === undefined ? null : Number(payload.fromIndex)
              };
            }
          } catch (error) {
            // Fall back to text/plain below.
          }
        }
        const raw = event.dataTransfer.getData("text/plain") || "";
        const [kind, piece, fromIndex] = raw.split(":");
        if (!kind || !piece) return null;
        return { kind, piece, fromIndex: fromIndex === "" || fromIndex === undefined ? null : Number(fromIndex) };
      };

      const handleExitDrop = (event, boardKind, requestedIndex = null, visualTarget = null) => {
        if (state.finalComplete) return;
        event.preventDefault();
        event.stopPropagation();
        exitScreen.querySelectorAll(".drop-ready, .drop-error").forEach((node) => node.classList.remove("drop-ready", "drop-error"));
        const payload = readExitDragPayload(event);
        if (!payload) {
          state.exitFeedback = "I could not read that card. Try dragging it again, or click it instead.";
          renderExit();
          return;
        }
        if (payload.kind !== boardKind) {
          if (visualTarget) visualTarget.classList.add("drop-error");
          state.exitFeedback = "That card belongs in the other console. Match the card to its console title.";
          renderExit();
          return;
        }
        placeExitPiece(boardKind, payload.piece, requestedIndex, payload.fromIndex);
      };

      exitScreen.querySelectorAll("[data-exit-piece]").forEach((button) => {
        button.addEventListener("click", () => {
          placeExitPiece(button.dataset.exitPiece, button.dataset.piece);
        });
        button.addEventListener("dragstart", (event) => {
          if (!allPlaced || state.finalComplete || button.disabled) {
            event.preventDefault();
            return;
          }
          button.classList.add("dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("application/x-ai-exit-piece", JSON.stringify({
            kind: button.dataset.exitPiece,
            piece: button.dataset.piece,
            fromIndex: null
          }));
          event.dataTransfer.setData("text/plain", `${button.dataset.exitPiece}:${button.dataset.piece}:`);
        });
        button.addEventListener("dragend", () => {
          button.classList.remove("dragging");
        });
      });

      exitScreen.querySelectorAll("[data-exit-slot]").forEach((button) => {
        button.addEventListener("click", () => {
          if (state.finalComplete) return;
          const target = exitTarget(button.dataset.exitSlot);
          const index = Number(button.dataset.index);
          if (!target[index]) return;
          target[index] = undefined;
          state.exitFeedback = "Card removed. Try the order again.";
          renderExit();
        });
        button.addEventListener("dragstart", (event) => {
          if (state.finalComplete) {
            event.preventDefault();
            return;
          }
          const target = exitTarget(button.dataset.exitSlot);
          const index = Number(button.dataset.index);
          const piece = target[index];
          if (!piece) {
            event.preventDefault();
            return;
          }
          button.classList.add("dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("application/x-ai-exit-piece", JSON.stringify({
            kind: button.dataset.exitSlot,
            piece,
            fromIndex: index
          }));
          event.dataTransfer.setData("text/plain", `${button.dataset.exitSlot}:${piece}:${index}`);
        });
        button.addEventListener("dragend", () => {
          button.classList.remove("dragging");
        });
        button.addEventListener("dragover", (event) => {
          if (state.finalComplete) return;
          event.preventDefault();
          event.stopPropagation();
          event.dataTransfer.dropEffect = "move";
          button.classList.add("drop-ready");
        });
        button.addEventListener("dragleave", () => {
          button.classList.remove("drop-ready");
        });
        button.addEventListener("drop", (event) => {
          handleExitDrop(event, button.dataset.exitSlot, Number(button.dataset.index), button);
        });
      });
      exitScreen.querySelectorAll(".sequence-board").forEach((board) => {
        const firstSlot = board.querySelector("[data-exit-slot]");
        if (!firstSlot) return;
        const boardKind = firstSlot.dataset.exitSlot;
        board.addEventListener("dragover", (event) => {
          if (state.finalComplete) return;
          event.preventDefault();
          event.dataTransfer.dropEffect = "move";
          board.classList.add("drop-ready");
        });
        board.addEventListener("dragleave", (event) => {
          if (!board.contains(event.relatedTarget)) board.classList.remove("drop-ready");
        });
        board.addEventListener("drop", (event) => {
          const slot = event.target.closest("[data-exit-slot]");
          if (slot && board.contains(slot)) return;
          handleExitDrop(event, boardKind, null, board);
        });
      });
      exitScreen.querySelector("[data-action='complete']").addEventListener("click", () => {
        if (state.finalComplete) return;
        if (!allPlaced) {
          state.exitFeedback = "Place every crystal around the AI Brain first.";
          renderExit();
          return;
        }
        if (!modelReady || !reviewReady) {
          state.exitFeedback = "Fill every empty slot before activating the brain.";
          renderExit();
          return;
        }
        if (!modelCorrect) {
          state.exitFeedback = "The text-making order is not right yet. Training patterns come before tokens, prediction, and output.";
          renderExit();
          return;
        }
        if (!reviewCorrect) {
          state.exitFeedback = "The checking order is not right yet. First verify facts, then check fairness, then use AI carefully.";
          renderExit();
          return;
        }
        state.finalComplete = true;
        state.exitPlaced = new Set(rooms.map((room) => room.crystal));
        state.exitModel = [...finalModelOrder];
        state.exitReview = [...finalReviewOrder];
        state.exitFeedback = "";
        send("ESCAPE_ROOM_COMPLETE", {});
        renderExit();
      });
    }

    window.addEventListener("message", (event) => {
      if (event.origin !== targetOrigin) return;
      const data = event.data || {};
      if (data.payload?.progress) applyInit(data.payload.progress);
      if (data.type === "ESCAPE_ROOM_INIT") applyInit(data.payload || {});
      if (data.type === "ESCAPE_ROOM_REQUEST_STATE") {
        if (data.payload?.progress) applyInit(data.payload.progress);
        send("ESCAPE_ROOM_READY");
      }
      if (data.type === "ESCAPE_ROOM_OPEN_HUB" || data.type === "ESCAPE_ROOM_RETURN_TO_HUB") openMap();
      if (data.type === "ESCAPE_ROOM_CONTINUE") continueAdventure();
      if (data.type === "ESCAPE_ROOM_OPEN_FINAL_EXIT") openExit();
      if (data.type === "ESCAPE_ROOM_OPEN_ROOM" || data.type === "ESCAPE_ROOM_REPLAY_ROOM") openRoom(data.payload?.roomId || "token", Boolean(data.payload?.replay));
      if (data.type === "ESCAPE_ROOM_RESET") {
        state.completed.clear();
        state.crystals.clear();
        state.exitPlaced.clear();
        state.exitModel = [];
        state.exitReview = [];
        state.exitFeedback = "";
        state.finalComplete = false;
        openMap();
      }
    });

    $("topMap").addEventListener("click", openMap);
    $("topContinue").addEventListener("click", continueAdventure);

    if (debug) {
      $("debugBanner").hidden = false;
      $("debugToggle").hidden = false;
      $("debugConsole").hidden = false;
      $("debugToggle").addEventListener("click", () => $("debugConsole").classList.toggle("open"));
      $("debugControls").innerHTML = rooms.map((room) => `<button type="button" data-debug-room="${room.id}">Complete R${room.number}</button>`).join("") + `<button type="button" data-debug-final>Final</button>`;
      $("debugControls").querySelectorAll("[data-debug-room]").forEach((button) => button.addEventListener("click", () => roomComplete(roomById(button.dataset.debugRoom))));
      $("debugControls").querySelector("[data-debug-final]").addEventListener("click", () => send("ESCAPE_ROOM_COMPLETE", {}));
    }

    const startRoom = searchParams.get("room");
    render();
    if (startRoom && roomById(startRoom)) openRoom(startRoom, true);
    send("ESCAPE_ROOM_READY");
  </script>
</body>
</html>
